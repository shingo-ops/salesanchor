title = "salesanchor gitleaks config"

[extend]
# gitleaks デフォルトルールセットを継承
useDefault = true

# =============================================================
# allowlist: 誤検知として許可するパターン（グローバル）
# =============================================================

[allowlist]
description = "プロジェクト固有の誤検知除外ルール"
paths = [
  ".env.example",
  # SEC-01: APIキーを含む例外文字列をテストするファイル（偽キーのみ使用）
  "backend/tests/test_gemini_error_redact.py",
  # HDD アーカイブ試験の偽の合言葉（実値でない。PR #4331 の履歴に残るため除外）
  "scripts/tests/test-claude-archive.sh",
]
regexes = [
  # ドキュメント内の公開済み Meta App ID（秘密情報でない）
  "1250869697105619",
  # Google OAuth クライアントID（公開情報）
  "730863365967-icreuf1q3l7uenlf8iifh3hi0cumqa7e\\.apps\\.googleusercontent\\.com",
  # テスト・サンプル用トークンのプレースホルダ
  "your-secret-verify-token-here",
  "your-.*-here",
  "example\\.com",
  "test@example\\.com",
  # Fernet鍵生成コマンドのサンプル（実値ではない）
  "Fernet\\.generate_key\\(\\)",
  # スクリプト内のサンプルARN・リソースID
  "AWS_ACCOUNT_ID",
  # テスト用の架空 Discord ユーザー ID（18桁の数字。実値でない。PR #4318 の履歴に残るため除外）
  # 現行コードは数字リテラルを書かず組み立てている（backend/tests/test_notification_event_routing.py）
  "999888777666555444",
  "123456789012345678",
  # E2Eテスト用ダミーFirebase APIキー（実値でない）
  "AIzaSyE2E-dummy",
  "e2e-fixture\\.firebaseapp\\.com",
  "e2e-fixture",
  # 段W の試験 backend/tests/test_web_push.py の架空の購読鍵（実値でない。PR #5013 の履歴に残るため除外）
  "BNcRdreALRFXTkOOUHK1EtK2wtaz5Ry4YfYCA_0QTpQtUbVlUls0VJXg7A8u\\-Ts1XbjhazAkj7I99e8QcYP7DkM",
  "tBHItJI5svbpez7KI4CCXg",
]

# =============================================================
# 追加ルール: このプロジェクト固有のパターン
# =============================================================

[[rules]]
id = "salesanchor-fernet-key"
description = "METADATA_FERNET_KEY の平文埋め込み検出"
regex = '''METADATA_FERNET_KEY\s*=\s*[A-Za-z0-9+/=_-]{44,}'''
tags = ["secret", "fernet"]
[rules.allowlist]
paths = [".env.example", "docs/"]

[[rules]]
id = "salesanchor-meta-app-secret"
description = "META_APP_SECRET の平文埋め込み検出"
regex = '''META_APP_SECRET\s*=\s*[a-f0-9]{32,}'''
tags = ["secret", "meta"]
[rules.allowlist]
paths = [".env.example"]

# =============================================================
# build-on-github 便1（docs/handoff/build-on-github/design.md §7-2・§24 C1）
# frontend の完成品の画面の JS には Firebase の web API key が載る（設計どおり・画面を開く人に届く値）。
# 既定の規則 gcp-api-key を名前で広げ、その場所だけを例外にする。他の規則・他の場所は今のまま当てる。
# この場所は置き場に無いので、置き場の走査（secret-scan.yml）の結果は変わらない。
# =============================================================
[[rules]]
id = "gcp-api-key"

[[rules.allowlists]]
description = "frontend 完成品の画面の JS（Firebase web API key は設計どおり載る）"
paths = ['''(^|/)usr/share/nginx/html/assets/[^/]+\.js$''']
