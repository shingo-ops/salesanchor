<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" role="img" aria-label="再発行の確認ダイアログ">
<style>
/* PLACEHOLDER TOKENS: 値のみ親 images/ の実値へ置換。構造は不変。 */
svg{--font:'Hiragino Sans','Noto Sans JP',sans-serif;--text:#2C2C2A;--sub:#5F5E5A;--acc-s:#534AB7;--acc-t:#3C3489;--bd:#D3D1C7;--bd2:#888780;--surf:#F1EFE8;--onacc:#FFFFFF;}
text{font-family:var(--font);fill:var(--text);}
.sub{fill:var(--sub);}
.bd2{fill:none;stroke:var(--bd2);stroke-width:0.5;}
</style>
<!-- 遮蔽層(模式) -->
<rect x="0" y="0" width="680" height="320" fill="#00000022"/>
<!-- ダイアログ -->
<rect x="180" y="30" width="320" height="260" rx="12" fill="#FFFFFF" stroke="var(--bd)" stroke-width="0.5"/>
<text x="204" y="66" font-size="15">再発行の確認</text>

<text x="204" y="96" font-size="12" class="sub">請求書 INV-1024 →</text>
<text x="332" y="96" font-size="12">INV-1024-01 として再発行</text>
<text x="204" y="114" font-size="11" class="sub">番号本体は変えず、最新版として発行します。</text>

<rect x="204" y="128" width="272" height="82" rx="8" fill="var(--surf)"/>
<text x="216" y="150" font-size="11" class="sub">数量調整</text>
<text x="464" y="150" font-size="11" text-anchor="end">151 BOX　3 → 2</text>
<text x="216" y="172" font-size="11" class="sub">送料（再計算）</text>
<text x="464" y="172" font-size="11" text-anchor="end">¥2,400</text>
<text x="216" y="194" font-size="11" class="sub">合計</text>
<text x="464" y="194" font-size="11" text-anchor="end">¥18,400</text>

<text x="204" y="230" font-size="10.5" class="sub">確定すると旧版は履歴に移り、最新版のみが有効になります。</text>

<rect class="bd2" x="300" y="250" width="76" height="28" rx="5"/>
<text x="338" y="268" font-size="12" class="sub" text-anchor="middle">取消</text>
<rect x="384" y="250" width="92" height="28" rx="5" fill="var(--acc-s)"/>
<text x="430" y="268" font-size="12" fill="var(--onacc)" text-anchor="middle">再発行を確定</text>
</svg>
