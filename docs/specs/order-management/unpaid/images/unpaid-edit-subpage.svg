<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" role="img" aria-label="未入金・編集下層ページ">
<style>
/* PLACEHOLDER TOKENS: 値のみ親 images/ の実値へ置換。構造は不変。 */
svg{--font:'Hiragino Sans','Noto Sans JP',sans-serif;--text:#2C2C2A;--sub:#5F5E5A;--acc-s:#534AB7;--acc-f:#EEEDFE;--acc-t:#3C3489;--bd:#D3D1C7;--bd2:#888780;--warn-f:#FBF3E2;--warn-t:#8A6114;--dang-t:#8F3320;--onacc:#FFFFFF;}
text{font-family:var(--font);fill:var(--text);}
.sub{fill:var(--sub);}
.bd{fill:none;stroke:var(--bd);stroke-width:0.5;}
.bd2{fill:none;stroke:var(--bd2);stroke-width:0.5;}
.dash{fill:none;stroke:var(--bd2);stroke-width:0.5;stroke-dasharray:4 4;}
</style>

<text x="20" y="30" font-size="15">◁ 編集：ORD-1024</text>
<text x="660" y="30" font-size="11" class="sub" text-anchor="end">請求書 INV-1024 ・ 未入金</text>
<line x1="20" y1="42" x2="660" y2="42" stroke="var(--bd)" stroke-width="0.5"/>
<text x="20" y="62" font-size="11" class="sub">山田商店　・　PayPal · USD　・　期日 7/10</text>

<!-- 支払い条件(変更可) -->
<text x="20" y="88" font-size="10" class="sub">支払い方法・通貨（変更可）</text>
<rect class="bd2" x="20" y="94" width="120" height="24" rx="5"/>
<text x="30" y="110" font-size="11">PayPal ▾</text>
<rect class="bd2" x="150" y="94" width="90" height="24" rx="5"/>
<text x="160" y="110" font-size="11">USD ▾</text>

<!-- 明細ヘッダ -->
<text x="20" y="142" font-size="10" class="sub">品目</text>
<text x="360" y="142" font-size="10" class="sub" text-anchor="end">単価(編集可)</text>
<text x="470" y="142" font-size="10" class="sub" text-anchor="middle">数量</text>
<text x="600" y="142" font-size="10" class="sub" text-anchor="end">金額</text>
<line x1="20" y1="150" x2="660" y2="150" stroke="var(--bd)" stroke-width="0.5"/>

<!-- 明細行1 -->
<text x="20" y="174" font-size="12">ポケカ 151 BOX</text>
<rect class="bd2" x="290" y="162" width="70" height="22" rx="4"/>
<text x="352" y="177" font-size="11" text-anchor="end">¥3,000</text>
<rect class="bd2" x="430" y="162" width="80" height="22" rx="4"/>
<text x="470" y="177" font-size="11" text-anchor="middle">−　3　＋</text>
<text x="600" y="177" font-size="12" text-anchor="end">¥9,000</text>
<text x="640" y="177" font-size="11" class="sub" text-anchor="end">削除</text>
<line x1="20" y1="192" x2="660" y2="192" stroke="var(--bd)" stroke-width="0.5"/>

<!-- 明細行2 -->
<text x="20" y="216" font-size="12">SV 強化BOX</text>
<rect class="bd2" x="290" y="204" width="70" height="22" rx="4"/>
<text x="352" y="219" font-size="11" text-anchor="end">¥3,500</text>
<rect class="bd2" x="430" y="204" width="80" height="22" rx="4"/>
<text x="470" y="219" font-size="11" text-anchor="middle">−　2　＋</text>
<text x="600" y="219" font-size="12" text-anchor="end">¥7,000</text>
<text x="640" y="219" font-size="11" class="sub" text-anchor="end">削除</text>
<line x1="20" y1="234" x2="660" y2="234" stroke="var(--bd)" stroke-width="0.5"/>

<!-- 商品を追加 -->
<rect class="dash" x="20" y="244" width="130" height="26" rx="5"/>
<text x="85" y="261" font-size="11" class="sub" text-anchor="middle">＋ 商品を追加</text>

<!-- 集計 -->
<text x="470" y="262" font-size="11" class="sub">小計</text>
<text x="640" y="262" font-size="11" text-anchor="end">¥16,000</text>
<text x="470" y="282" font-size="11" class="sub">送料（自動再計算）</text>
<text x="640" y="282" font-size="11" text-anchor="end">¥2,400</text>
<line x1="470" y1="290" x2="640" y2="290" stroke="var(--bd)" stroke-width="0.5"/>
<text x="470" y="308" font-size="12">合計</text>
<text x="640" y="308" font-size="12" text-anchor="end">¥18,400</text>

<!-- 版管理の注記 -->
<rect x="20" y="298" width="420" height="30" rx="6" fill="var(--acc-f)"/>
<text x="32" y="317" font-size="10.5" fill="var(--acc-t)">再発行＝INV-1024-01。番号本体は不変・最新版のみ有効（旧版は履歴）。</text>

<!-- アクション -->
<rect class="bd2" x="20" y="344" width="120" height="26" rx="5"/>
<text x="80" y="361" font-size="11" fill="var(--dang-t)" text-anchor="middle">キャンセル処理</text>
<rect x="520" y="344" width="140" height="26" rx="5" fill="var(--acc-s)"/>
<text x="590" y="361" font-size="11" fill="var(--onacc)" text-anchor="middle">再発行する（-01）</text>
</svg>
