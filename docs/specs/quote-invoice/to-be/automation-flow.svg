<svg width="720" height="450" viewBox="0 0 720 450" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="720" height="450" rx="12" fill="#f7f6f2" stroke="#d3d1c7" stroke-width="1"/>

  <text x="130" y="36" font-size="14" font-weight="600" fill="#2c2c2a" text-anchor="middle">人間がやること</text>
  <text x="470" y="36" font-size="14" font-weight="600" fill="#2c2c2a" text-anchor="middle">システムが自動でやること</text>

  <rect x="40" y="54" width="180" height="40" rx="8" fill="#e6f1fb" stroke="#378add" stroke-width="1"/>
  <text x="130" y="79" font-size="13" fill="#0c447c" text-anchor="middle">① 商品名・状態を選ぶ</text>
  <rect x="40" y="150" width="180" height="40" rx="8" fill="#e6f1fb" stroke="#378add" stroke-width="1"/>
  <text x="130" y="175" font-size="13" fill="#0c447c" text-anchor="middle">② 数量を選ぶ</text>
  <rect x="40" y="246" width="180" height="40" rx="8" fill="#e6f1fb" stroke="#378add" stroke-width="1"/>
  <text x="130" y="271" font-size="13" fill="#0c447c" text-anchor="middle">③ 配送会社を選ぶ</text>
  <rect x="40" y="356" width="180" height="46" rx="8" fill="#e6f1fb" stroke="#378add" stroke-width="1"/>
  <text x="130" y="376" font-size="13" fill="#0c447c" text-anchor="middle">④ 発行ボタンを押す</text>
  <text x="130" y="393" font-size="11" fill="#185fa5" text-anchor="middle">ワンボタン</text>

  <rect x="300" y="54" width="170" height="40" rx="8" fill="#e1f5ee" stroke="#1d9e75" stroke-width="1"/>
  <text x="385" y="79" font-size="12" fill="#0f6e56" text-anchor="middle">在庫DBから金額反映</text>
  <rect x="300" y="140" width="170" height="40" rx="8" fill="#e1f5ee" stroke="#1d9e75" stroke-width="1"/>
  <text x="385" y="165" font-size="12" fill="#0f6e56" text-anchor="middle">商品ごと小計を計算</text>
  <rect x="300" y="196" width="170" height="44" rx="8" fill="#e1f5ee" stroke="#1d9e75" stroke-width="1"/>
  <text x="385" y="215" font-size="12" fill="#0f6e56" text-anchor="middle">重量×料金帯で</text>
  <text x="385" y="231" font-size="12" fill="#0f6e56" text-anchor="middle">各社送料を計算・比較</text>
  <rect x="300" y="250" width="170" height="40" rx="8" fill="#e1f5ee" stroke="#1d9e75" stroke-width="1"/>
  <text x="385" y="275" font-size="12" fill="#0f6e56" text-anchor="middle">米国宛は関税を計算</text>

  <rect x="510" y="150" width="170" height="90" rx="8" fill="#faeeda" stroke="#ba7517" stroke-width="1"/>
  <text x="595" y="180" font-size="13" font-weight="600" fill="#633806" text-anchor="middle">総額を常時表示</text>
  <text x="595" y="204" font-size="11" fill="#854f0b" text-anchor="middle">小計＋送料＋関税</text>
  <text x="595" y="220" font-size="11" fill="#854f0b" text-anchor="middle">が見やすく整理</text>

  <rect x="300" y="330" width="380" height="80" rx="8" fill="#faece7" stroke="#d85a30" stroke-width="1"/>
  <text x="490" y="356" font-size="13" font-weight="600" fill="#712b13" text-anchor="middle">発行後の自動処理</text>
  <text x="490" y="378" font-size="11" fill="#993c1d" text-anchor="middle">PDF発行 → Orderに自動紐付け → Google Driveに自動保存</text>
  <text x="490" y="394" font-size="11" fill="#993c1d" text-anchor="middle">PayPalはAPIで発行 / メール送信（設定でON時）</text>

