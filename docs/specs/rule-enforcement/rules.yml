# 決まり台帳（正本）。書式と検査: docs/handoff/rule-enforcement/design.md §5 R1、検査 scripts/ci/check_rule_registry.py、決め方 docs/adr/ADR-1047-rule-registry.md
# 決まりの語を含む行は、すべて下の rules か not_rules のどちらかに入れる（1 行は 1 項目だけ。check_rule_registry.py が数える）。
# id: 文書の頭文字＋番号。A=AGENTS.md C=CLAUDE.md F=frontend/AGENTS.md K=backend/AGENTS.md S=STANDARD-WORKFLOW.md
#     AE=aeon-routing AR=agent-roles CX=codex-operations PP=design-partner-preamble P=design-partner DC=dev-commands
#     E=evidence-registry X=executor-checklist XP=executor-preamble KP=kpi L=lessons.d T=task-template B=branch-operations/README.md
#     最初に登録した 15 件は 2 桁（A09 など）、R1b で足した項目は 3 桁（A012 など。番号は R1b の仕分け表の通し番号）。
# kind: gate（機械が止める。check に必須チェックの名前）／review（人が見る）／exempt（PR に痕跡が残らない）。check を書いてよいのは gate だけ。
#   review の reason が「gate候補（R6）: 」で始まる行は、機械で○×が決まるが今は止める必須チェックが無い行（R6 で必須チェックにする対象）。
#   「gate候補（R3）: 」は R3 で PR 側の検査にする行。
# anchor: 出典の 1 行にだけ当たる文字列（先頭の一部でよい）。
# 決まりの語の一覧（下の words）・rule-docs.txt・この台帳の変更は GO 記録の要る対象（scripts/check-process-artifacts.js）。
words: 禁止|必ず|必須|厳禁|してはならない|しない|すること|MUST|NEVER

rules:
  - id: A09
    source: AGENTS.md
    anchor: "`shingo-ops` 名義でのコード変更PR作成は禁止"
    kind: gate
    check: "process-artifacts gate"
    when: ci
    fixture: ""
    evidence: "R2 で見本を置く"
    reason: "gh auth status での名義確認は PR の外なので対象外。shingo-ops 名義のコード変更 PR は check-process-artifacts.js:814-819 が止める。書類だけの PR は検査が飛ぶ（:774）が、AGENTS.md:33 が docs-only PR を対象外にしているので妨げない。PR 作者の取得に失敗すると check-process-artifacts.js:809-810 で警告だけで通る。R2/R6 の宿題"
  - id: A13
    source: AGENTS.md
    anchor: "を含む PR は PO の「GO #PR番号」まで main にマージしない"
    kind: gate
    check: "process-artifacts gate"
    when: ci
    fixture: ""
    evidence: "R2 で見本を置く"
    reason: "migrations/・deploy.yml・本番 scripts/ を含む PR の GO 記録の有無は check-process-artifacts.js:925-931 が止める（危険パスは :115-134）。危険パスを含む PR は書類だけの PR にならないので :774 の飛びは当たらず、飛ぶ条件は無い。「まで main にマージしない」という順序そのものは PR の外"
