
<svg width="720" height="620" viewBox="0 0 720 620" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <rect x="0" y="0" width="720" height="620" rx="12" fill="#f7f6f2" stroke="#d3d1c7" stroke-width="1"/>

  <text x="24" y="34" font-size="18" font-weight="600" fill="#2c2c2a">&#8592; ロールを編集</text>
  <text x="24" y="54" font-size="12" fill="#5f5e5a">営業担当</text>

  <rect x="24" y="70" width="672" height="50" rx="8" fill="#ffffff" stroke="#d3d1c7" stroke-width="1"/>
  <text x="38" y="92" font-size="10" fill="#888780">ロール名</text>
  <rect x="38" y="96" width="280" height="18" rx="4" fill="#ffffff" stroke="#378add" stroke-width="1"/>
  <text x="46" y="109" font-size="10" fill="#2c2c2a">営業担当</text>

  <rect x="24" y="134" width="672" height="380" rx="8" fill="#ffffff" stroke="#d3d1c7" stroke-width="1"/>
  <text x="38" y="156" font-size="12" font-weight="600" fill="#2c2c2a">ページ別アクセス権限</text>
  <text x="38" y="172" font-size="9" fill="#888780">メニュー単位で一括設定、その下の各ページで個別に上書きできます</text>

  <rect x="38" y="186" width="644" height="180" rx="6" fill="#ffffff" stroke="#d3d1c7" stroke-width="1"/>
  <rect x="38" y="186" width="644" height="34" fill="#f1efe8"/>
  <text x="52" y="207" font-size="12" font-weight="600" fill="#2c2c2a">&#128230; 在庫管理（メニュー全体）</text>
  <rect x="580" y="194" width="90" height="20" rx="4" fill="#ffffff" stroke="#378add" stroke-width="1"/>
  <text x="625" y="208" font-size="10" fill="#0c447c" text-anchor="middle">閲覧のみ &#9660;</text>

  <text x="60" y="238" font-size="9" fill="#888780">個別ページ</text>
  <text x="560" y="238" font-size="9" fill="#888780" text-anchor="middle">非表示</text>
  <text x="610" y="238" font-size="9" fill="#888780" text-anchor="middle">閲覧のみ</text>
  <text x="660" y="238" font-size="9" fill="#888780" text-anchor="middle">編集</text>
  <line x1="38" y1="246" x2="682" y2="246" stroke="#e3e1d9" stroke-width="1"/>

  <text x="60" y="266" font-size="11" fill="#2c2c2a">在庫管理（親・一覧）</text>
  <circle cx="560" cy="262" r="6" fill="none" stroke="#b4b2a9" stroke-width="1.5"/>
  <circle cx="610" cy="262" r="6" fill="#378add" stroke="#378add" stroke-width="1.5"/>
  <circle cx="660" cy="262" r="6" fill="none" stroke="#b4b2a9" stroke-width="1.5"/>

  <rect x="38" y="278" width="644" height="30" fill="#f1efe8"/>
  <text x="60" y="298" font-size="11" fill="#0c447c" font-weight="600">&#8594; 商品マスタ</text>
  <circle cx="560" cy="293" r="6" fill="none" stroke="#b4b2a9" stroke-width="1.5"/>
  <circle cx="610" cy="293" r="6" fill="none" stroke="#b4b2a9" stroke-width="1.5"/>
  <circle cx="660" cy="293" r="6" fill="#378add" stroke="#378add" stroke-width="1.5"/>
  <text x="60" y="320" font-size="9" fill="#0c447c">&#8593; メニュー全体は「閲覧のみ」だが、商品マスタだけ個別に「編集」へ上書き</text>

  <text x="60" y="350" font-size="11" fill="#2c2c2a">在庫チャート分析</text>
  <circle cx="560" cy="346" r="6" fill="none" stroke="#b4b2a9" stroke-width="1.5"/>
  <circle cx="610" cy="346" r="6" fill="#378add" stroke="#378add" stroke-width="1.5"/>
  <circle cx="660" cy="346" r="6" fill="none" stroke="#b4b2a9" stroke-width="1.5"/>

  <rect x="38" y="380" width="644" height="34" rx="6" fill="#f1efe8"/>
  <text x="52" y="401" font-size="12" font-weight="600" fill="#2c2c2a">&#128233; 受信箱（メニュー全体）</text>
  <rect x="580" y="388" width="90" height="20" rx="4" fill="#ffffff" stroke="#378add" stroke-width="1"/>
  <text x="625" y="402" font-size="10" fill="#0c447c" text-anchor="middle">編集 &#9660;</text>

  <text x="360" y="440" font-size="9" fill="#888780" text-anchor="middle">競合時はページ個別設定を優先（メニュー一括設定より優先）</text>

  <rect x="24" y="530" width="140" height="30" rx="6" fill="#ffffff" stroke="#378add" stroke-width="2"/>
  <text x="94" y="549" font-size="11" fill="#0c447c" text-anchor="middle">保存する</text>
  <rect x="174" y="530" width="100" height="30" rx="6" fill="#ffffff" stroke="#b4b2a9" stroke-width="1"/>
  <text x="224" y="549" font-size="11" fill="#2c2c2a" text-anchor="middle">キャンセル</text>
  <text x="682" y="549" font-size="12" fill="#c4432f" text-anchor="end">&#128465; 削除</text>
</svg>
