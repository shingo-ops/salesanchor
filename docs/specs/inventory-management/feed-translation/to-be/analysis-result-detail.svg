  <text x="38" y="420" font-size="11" fill="#5f5e5a">PSA10 ARバルク</text>
  <text x="238" y="404" font-size="9" fill="#888780">状態</text>
  <text x="238" y="420" font-size="11" fill="#5f5e5a">PSA10</text>
  <text x="378" y="404" font-size="9" fill="#888780">数量</text>
  <text x="378" y="420" font-size="11" fill="#854f0b">?</text>
  <text x="478" y="404" font-size="9" fill="#888780">価格</text>
  <text x="478" y="420" font-size="11" fill="#854f0b">?</text>

  <rect x="24" y="454" width="672" height="150" rx="8" fill="#ffffff" stroke="#378add" stroke-width="1.5"/>
