  <text x="660" y="232" font-size="10" fill="#854f0b" text-anchor="end">0/40</text>
  <line x1="38" y1="246" x2="660" y2="246" stroke="#e3e1d9" stroke-width="1"/>

  <text x="38" y="268" font-size="11" fill="#5f5e5a">③ 除外キーワード衝突</text>
  <rect x="580" y="258" width="80" height="18" rx="4" fill="#dff3e6"/>
