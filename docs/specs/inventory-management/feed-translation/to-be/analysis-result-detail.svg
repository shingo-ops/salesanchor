  <rect x="38" y="554" width="130" height="26" rx="6" fill="#ffffff" stroke="#378add" stroke-width="1"/>
  <text x="48" y="571" font-size="11" fill="#2c2c2a">PSA10 &#9660;</text>
  <text x="184" y="548" font-size="9" fill="#888780">数量</text>
