  <text x="194" y="571" font-size="11" fill="#2c2c2a">2</text>
  <text x="330" y="548" font-size="9" fill="#888780">価格</text>
  <rect x="330" y="554" width="130" height="26" rx="6" fill="#ffffff" stroke="#378add" stroke-width="1"/>
  <text x="340" y="571" font-size="11" fill="#2c2c2a">¥45,000</text>

  <rect x="24" y="620" width="672" height="46" rx="8" fill="#e6f1fb"/>
  <text x="360" y="640" font-size="10" fill="#0c447c" text-anchor="middle">保存すると原文・AI結果・修正結果が紐づけて記録され、</text>
  <text x="360" y="656" font-size="10" fill="#0c447c" text-anchor="middle">解析精度分析とRAGに使用されます</text>

  <rect x="24" y="682" width="140" height="30" rx="6" fill="#ffffff" stroke="#378add" stroke-width="2"/>
