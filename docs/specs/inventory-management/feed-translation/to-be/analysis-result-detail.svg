  <line x1="38" y1="284" x2="660" y2="284" stroke="#e3e1d9" stroke-width="1"/>

  <text x="38" y="306" font-size="10" fill="#888780">数量・価格が原文に見当たらないため②が0点。①はキーワード一致・表記ゆれで満点にならず</text>
