<svg width="720" height="800" viewBox="0 0 720 800" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <rect x="0" y="0" width="720" height="800" rx="12" fill="#f7f6f2" stroke="#d3d1c7" stroke-width="1"/>

  <text x="24" y="34" font-size="18" font-weight="600" fill="#2c2c2a">&#8592; 解析結果を修正</text>
