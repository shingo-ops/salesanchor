  <rect x="174" y="682" width="100" height="30" rx="6" fill="#ffffff" stroke="#b4b2a9" stroke-width="1"/>
  <text x="224" y="701" font-size="11" fill="#2c2c2a" text-anchor="middle">キャンセル</text>
