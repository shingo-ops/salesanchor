  <rect x="500" y="186" width="63" height="8" rx="4" fill="#2e9e5b"/>
  <text x="660" y="196" font-size="10" fill="#5f5e5a" text-anchor="end">42/60</text>
  <line x1="38" y1="210" x2="660" y2="210" stroke="#e3e1d9" stroke-width="1"/>

  <text x="38" y="232" font-size="11" fill="#5f5e5a">② 必須項目の充足</text>
