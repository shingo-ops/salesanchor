<svg width="720" height="620" viewBox="0 0 720 620" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <rect x="0" y="0" width="720" height="620" rx="12" fill="#f7f6f2" stroke="#d3d1c7" stroke-width="1"/>

  <text x="24" y="34" font-size="18" font-weight="600" fill="#2c2c2a">&#8592; 条件を追加</text>
  <text x="24" y="54" font-size="12" fill="#5f5e5a">1つの条件の中で、状態ごとに別々のルールを設定できます</text>

  <rect x="24" y="70" width="672" height="60" rx="8" fill="#ffffff" stroke="#d3d1c7" stroke-width="1"/>
  <text x="38" y="92" font-size="10" fill="#888780">条件名</text>
  <rect x="38" y="98" width="400" height="24" rx="6" fill="#ffffff" stroke="#378add" stroke-width="1"/>
  <text x="48" y="114" font-size="12" fill="#2c2c2a">状態別・在庫優先の基準</text>

  <rect x="24" y="142" width="672" height="140" rx="8" fill="#ffffff" stroke="#378add" stroke-width="1.5"/>
  <text x="38" y="166" font-size="13" font-weight="600" fill="#0c447c">シュリンク付き</text>

  <text x="38" y="196" font-size="11" fill="#5f5e5a">在庫差</text>
  <rect x="86" y="184" width="46" height="22" rx="5" fill="#ffffff" stroke="#d3d1c7" stroke-width="1"/>
  <text x="109" y="199" font-size="11" fill="#2c2c2a" text-anchor="middle">10</text>
  <text x="140" y="196" font-size="11" fill="#5f5e5a">個以上→価格差</text>
  <rect x="240" y="184" width="66" height="22" rx="5" fill="#ffffff" stroke="#d3d1c7" stroke-width="1"/>
  <text x="273" y="199" font-size="11" fill="#2c2c2a" text-anchor="middle">1,000</text>
  <text x="314" y="196" font-size="11" fill="#5f5e5a">円以内は在庫優先</text>
  <text x="682" y="196" font-size="12" fill="#888780" text-anchor="end">&#128465;</text>

  <rect x="38" y="216" width="644" height="26" rx="6" fill="#ffffff" stroke="#b4b2a9" stroke-width="1" stroke-dasharray="3 2"/>
  <text x="360" y="233" font-size="10" fill="#5f5e5a" text-anchor="middle">+ 段階を追加</text>

  <rect x="24" y="292" width="672" height="120" rx="8" fill="#ffffff" stroke="#d3d1c7" stroke-width="1"/>
  <text x="38" y="316" font-size="13" font-weight="600" fill="#2c2c2a">ダメージあり</text>

  <text x="38" y="346" font-size="11" fill="#5f5e5a">在庫差</text>
  <rect x="86" y="334" width="46" height="22" rx="5" fill="#ffffff" stroke="#d3d1c7" stroke-width="1"/>
  <text x="109" y="349" font-size="11" fill="#2c2c2a" text-anchor="middle">3</text>
  <text x="140" y="346" font-size="11" fill="#5f5e5a">個以上→価格差</text>
  <rect x="240" y="334" width="66" height="22" rx="5" fill="#ffffff" stroke="#d3d1c7" stroke-width="1"/>
  <text x="273" y="349" font-size="11" fill="#2c2c2a" text-anchor="middle">500</text>
  <text x="314" y="346" font-size="11" fill="#5f5e5a">円以内は在庫優先</text>

  <rect x="38" y="366" width="644" height="26" rx="6" fill="#ffffff" stroke="#b4b2a9" stroke-width="1" stroke-dasharray="3 2"/>
  <text x="360" y="383" font-size="10" fill="#5f5e5a" text-anchor="middle">+ 段階を追加</text>

  <rect x="24" y="428" width="672" height="40" rx="8" fill="#ffffff" stroke="#b4b2a9" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="360" y="452" font-size="11" fill="#888780" text-anchor="middle">+ 状態を追加（シュリンクなし・ケース）</text>

  <text x="360" y="490" font-size="10" fill="#888780" text-anchor="middle">ルールを設定していない状態、またはどの段階にも当てはまらない場合は、価格の安い方を優先します</text>

  <rect x="24" y="512" width="180" height="32" rx="6" fill="#ffffff" stroke="#378add" stroke-width="2"/>
  <text x="114" y="533" font-size="11" fill="#0c447c" text-anchor="middle">この条件を保存</text>
  <rect x="214" y="512" width="140" height="32" rx="6" fill="#ffffff" stroke="#b4b2a9" stroke-width="1"/>
  <text x="284" y="533" font-size="11" fill="#2c2c2a" text-anchor="middle">プレビューで確認</text>
</svg>
