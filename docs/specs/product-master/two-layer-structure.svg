<svg xmlns="http://www.w3.org/2000/svg" width="680" viewBox="0 0 680 440" role="img" font-family="sans-serif">
<title>共通と会社ごとの2層構造</title>
<desc>1つの台帳に共通行と会社ごとの行が同居し、持ち主の印で分かれ、各社には共通と自社分だけが見える。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<style>
.t{font-size:14px;font-weight:500}.s{font-size:12px}
.teal{fill:#E1F5EE;stroke:#0F6E56}.tealT{fill:#085041}
.gray{fill:#F1EFE8;stroke:#5F5E5A}.grayT{fill:#2C2C2A}
.blue{fill:#E6F1FB;stroke:#185FA5}.blueT{fill:#0C447C}
.coral{fill:#FAECE7;stroke:#993C1D}.coralT{fill:#712B13}
.arr{stroke:#888780;stroke-width:1.5;fill:none}
</style>
<rect class="gray" x="40" y="30" width="600" height="180" rx="14" stroke-width="0.5"/>
<text class="t grayT" x="60" y="58">1つの台帳（持ち主の印で分ける）</text>
<rect class="teal" x="60" y="74" width="560" height="50" rx="8" stroke-width="0.5"/>
<text class="t tealT" x="80" y="96">共通の行（印＝空）</text>
<text class="s tealT" x="80" y="114">全社で使う・運営（tenant_004/006）だけが編集できる</text>
<rect class="blue" x="60" y="132" width="270" height="50" rx="8" stroke-width="0.5"/>
<text class="t blueT" x="80" y="154">A社の行（印＝A社）</text>
<text class="s blueT" x="80" y="172">A社だけ・A社が編集</text>
<rect class="coral" x="350" y="132" width="270" height="50" rx="8" stroke-width="0.5"/>
<text class="t coralT" x="370" y="154">B社の行（印＝B社）</text>
<text class="s coralT" x="370" y="172">B社だけ・B社が編集</text>
<line class="arr" x1="200" y1="210" x2="200" y2="270" marker-end="url(#arrow)"/>
<line class="arr" x1="480" y1="210" x2="480" y2="270" marker-end="url(#arrow)"/>
<text class="s grayT" x="265" y="244" text-anchor="middle">表示は自動で振り分け</text>
<rect class="gray" x="60" y="270" width="280" height="130" rx="12" stroke-width="0.5"/>
<text class="t grayT" x="200" y="298" text-anchor="middle">A社に見えるもの</text>
<rect class="teal" x="80" y="312" width="240" height="34" rx="6" stroke-width="0.5"/>
<text class="s tealT" x="200" y="333" text-anchor="middle">共通の行</text>
<rect class="blue" x="80" y="354" width="240" height="34" rx="6" stroke-width="0.5"/>
<text class="s blueT" x="200" y="375" text-anchor="middle">A社の行（B社の行は見えない）</text>
<rect class="gray" x="340" y="270" width="280" height="130" rx="12" stroke-width="0.5"/>
<text class="t grayT" x="480" y="298" text-anchor="middle">B社に見えるもの</text>
<rect class="teal" x="360" y="312" width="240" height="34" rx="6" stroke-width="0.5"/>
<text class="s tealT" x="480" y="333" text-anchor="middle">共通の行</text>
<rect class="coral" x="360" y="354" width="240" height="34" rx="6" stroke-width="0.5"/>
<text class="s coralT" x="480" y="375" text-anchor="middle">B社の行（A社の行は見えない）</text>
</svg>
