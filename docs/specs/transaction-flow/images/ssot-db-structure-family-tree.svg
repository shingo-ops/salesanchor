<svg width="100%" viewBox="0 0 700 660" role="img" xmlns="http://www.w3.org/2000/svg" font-family="'Anthropic Sans',-apple-system,'Segoe UI',sans-serif">
<title>SSOT設計のDB構造（v2・在庫接点入り）</title>
<desc>leadを頂点とする家系図。deal、company、orderが順に生まれ、orderの下に明細・仕入・トラブル・出どころ（在庫接点）がぶら下がる。事実の帳簿とマスタ群も示す。</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#898781" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<rect x="40" y="30" width="180" height="52" rx="8" fill="#EEEDFE" stroke="#534AB7"/>
<text x="130" y="48" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">lead（親）</text>
<text x="130" y="66" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">全ての取引の出発点</text>

<line x1="130" y1="82" x2="130" y2="120" stroke="#898781" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="40" y="124" width="180" height="52" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="130" y="142" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">deal（商談化で誕生）</text>
<text x="130" y="160" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">lead必須＝親なしで作れない</text>

<line x1="130" y1="176" x2="130" y2="214" stroke="#898781" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="40" y="218" width="180" height="52" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="130" y="236" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">company（フォームで誕生）</text>
<text x="130" y="254" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">lead必須・dealに登録される</text>

<line x1="130" y1="270" x2="130" y2="308" stroke="#898781" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="40" y="312" width="180" height="52" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="130" y="330" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">order（請求書発行で誕生）</text>
<text x="130" y="348" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">deal必須＝糸は1本だけ</text>

<line x1="220" y1="338" x2="290" y2="338" stroke="#898781" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="294" y="300" width="170" height="76" rx="8" fill="#FCF0DB" stroke="#96690F" stroke-width="0.5"/>
<text x="379" y="320" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#6B4A0A">order_item（明細）</text>
<text x="379" y="340" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#96690F">商品ごとに1行</text>
<text x="379" y="358" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#96690F">売った物の唯一の正</text>

<line x1="464" y1="318" x2="520" y2="288" stroke="#898781" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="514" y="248" width="160" height="64" rx="8" fill="#FDEBE7" stroke="#B3391F" stroke-width="0.5"/>
<text x="594" y="266" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#8C2B16">仕入（伝票＋明細）</text>
<text x="594" y="284" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#B3391F">どの明細のための</text>
<text x="594" y="300" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#B3391F">仕入かを指す</text>

<line x1="464" y1="358" x2="520" y2="384" stroke="#898781" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="514" y="360" width="160" height="64" rx="8" fill="#FDEBE7" stroke="#B3391F" stroke-width="0.5"/>
<text x="594" y="378" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#8C2B16">trouble（数量単位）</text>
<text x="594" y="396" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#B3391F">100個中20個の破損</text>
<text x="594" y="412" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#B3391F">も正確に記録</text>

<line x1="379" y1="376" x2="379" y2="414" stroke="#898781" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#ar)"/>
<rect x="270" y="418" width="218" height="96" rx="8" fill="#F4F3F1" stroke="#6B6961" stroke-width="0.8" stroke-dasharray="5 4"/>
<text x="379" y="436" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#40403B">出どころ（在庫接点・S14）</text>
<text x="379" y="456" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#57564F">自社在庫から引き当て or</text>
<text x="379" y="474" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#57564F">ドロップシッピング（仕入直送）</text>
<text x="379" y="496" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#57564F">在庫の中身は別仕様書（pending）</text>

<rect x="294" y="124" width="180" height="88" rx="8" fill="#FCEBF3" stroke="#B0316E" stroke-width="0.5"/>
<text x="384" y="142" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#8A2456">事実の帳簿</text>
<text x="384" y="162" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#B0316E">請求書：発行日・入金日</text>
<text x="384" y="180" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#B0316E">発送記録：発送日・追跡番号</text>
<text x="384" y="198" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#B0316E">仕入：発注日・支払日</text>
<line x1="294" y1="200" x2="224" y2="320" stroke="#898781" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#ar)"/>
<text x="286" y="252" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#57564F">order に紐づく</text>

<rect x="514" y="30" width="160" height="150" rx="8" fill="#F4F3F1" stroke="#6B6961" stroke-width="0.5"/>
<text x="594" y="50" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#40403B">マスタ（背番号帳）</text>
<text x="594" y="74" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#57564F">流入元・国・規模</text>
<text x="594" y="94" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#57564F">店舗形態・取扱商材</text>
<text x="594" y="114" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#57564F">商品・状態・担当者</text>
<text x="594" y="140" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#57564F">自由入力でなく</text>
<text x="594" y="158" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#57564F">IDで選ぶ＝ゆれゼロ</text>

<rect x="40" y="546" width="634" height="84" rx="10" fill="#F4F3F1" stroke="#6B6961" stroke-width="0.5"/>
<text x="357" y="568" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#40403B">鉄則：同じ事実は1か所にだけ書く（SSOT）</text>
<text x="357" y="590" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#57564F">二重持ち6箇所（入金日×2・発送×2・会社への経路×2 など）を全て1箇所に統合</text>
<text x="357" y="608" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#57564F">lead に繋がらないデータは「そもそも作れない」＝迷子ゼロが構造で保証される</text>
</svg>
