<rect x="250" y="158" width="180" height="56" rx="8" fill="#E6F4F1" stroke="#2A9D8F"/>
<text x="340" y="182" font-size="13" font-weight="600" fill="#1D6A5E" text-anchor="middle">承認したら送信</text>
<text x="340" y="201" font-size="12" fill="#6B7480" text-anchor="middle">送信済み・会話に履歴</text>
