<text x="246" y="29" font-size="12" fill="#6B7480">既存参照(quote-invoice)</text>
<rect x="40" y="52" width="180" height="56" rx="8" fill="#E6F4F1" stroke="#2A9D8F"/>
<text x="130" y="76" font-size="13" font-weight="600" fill="#1D6A5E" text-anchor="middle">見積もり作成を選ぶ</text>
<text x="130" y="95" font-size="12" fill="#6B7480" text-anchor="middle">カルテのボタン</text>
<line x1="222" y1="80" x2="244" y2="80" stroke="#9AA3AE" stroke-width="1.5"/>
<polygon points="244,76 250,80 244,84" fill="#9AA3AE"/>
<rect x="250" y="52" width="180" height="56" rx="8" fill="#F0F1F3" stroke="#9AA3AE"/>
<text x="340" y="76" font-size="13" font-weight="600" fill="#1F2933" text-anchor="middle">作成ページへ遷移</text>
<text x="340" y="95" font-size="12" fill="#6B7480" text-anchor="middle">既存の作成ページ</text>
<line x1="432" y1="80" x2="454" y2="80" stroke="#9AA3AE" stroke-width="1.5"/>
<polygon points="454,76 460,80 454,84" fill="#9AA3AE"/>
