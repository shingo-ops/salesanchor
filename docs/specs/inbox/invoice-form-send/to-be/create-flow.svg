<text x="550" y="95" font-size="12" fill="#6B7480" text-anchor="middle">見積を確定</text>
<line x1="550" y1="110" x2="550" y2="152" stroke="#9AA3AE" stroke-width="1.5"/>
<polygon points="546,152 550,158 554,152" fill="#9AA3AE"/>
