<text x="550" y="182" font-size="13" font-weight="600" fill="#1D6A5E" text-anchor="middle">確認ページ</text>
<text x="550" y="201" font-size="12" fill="#6B7480" text-anchor="middle">承認まで顧客未達</text>
<line x1="458" y1="186" x2="436" y2="186" stroke="#2A9D8F" stroke-width="1.5"/>
