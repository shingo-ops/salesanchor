<text class="ts" x="341" y="308" text-anchor="middle" fill="#444441">自動(API)と手動記録が</text>
<text class="ts" x="341" y="326" text-anchor="middle" fill="#444441">同じ欄に同居（⑧）</text>
<rect x="238" y="386" width="206" height="64" rx="6" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.5"/>
<text class="th" x="341" y="410" text-anchor="middle" fill="#444441">送信口（④）</text>
<text class="ts" x="341" y="432" text-anchor="middle" fill="#444441">テキスト・画像・スタンプ・定型文</text>
<rect x="464" y="158" width="164" height="238" rx="10" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
