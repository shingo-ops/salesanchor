<svg xmlns="http://www.w3.org/2000/svg" width="680" height="510" viewBox="0 0 680 510">
<style>text{font-family:sans-serif}.th{font-size:14px;font-weight:500}.ts{font-size:12px}</style>
<rect x="40" y="40" width="600" height="440" rx="12" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="th" x="52" y="62" fill="#2C2C2A">受信箱画面（親が定義する器）</text>
<rect x="52" y="76" width="576" height="36" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.5"/>
<text class="ts" x="64" y="98" fill="#5F5E5A">ヘッダー</text>
<text class="ts" x="616" y="98" text-anchor="end" fill="#5F5E5A">テンプレート｜Bot・定型文設定｜FAQ｜設定</text>
<rect x="52" y="120" width="576" height="30" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.5"/>
<text class="ts" x="64" y="139" fill="#5F5E5A">すべて/リード/商談中/既存顧客/追客/アーカイブ</text>
<text class="ts" x="616" y="139" text-anchor="end" fill="#5F5E5A">プラットフォーム絞り込み</text>
<rect x="52" y="158" width="166" height="300" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
