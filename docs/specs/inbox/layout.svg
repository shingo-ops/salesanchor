<text class="ts" x="135" y="264" text-anchor="middle" fill="#534AB7">状態タグ（リード等）</text>
<text class="ts" x="135" y="282" text-anchor="middle" fill="#534AB7">並び順: 新着/未読</text>
<rect x="230" y="158" width="222" height="300" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text class="th" x="341" y="180" text-anchor="middle" fill="#26215C">メッセージ欄（①）</text>
<rect x="238" y="190" width="206" height="30" rx="6" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.5"/>
<text class="ts" x="341" y="209" text-anchor="middle" fill="#444441">③ 言語切替　⑧ 手動記録</text>
<rect x="238" y="228" width="206" height="150" rx="6" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.5"/>
