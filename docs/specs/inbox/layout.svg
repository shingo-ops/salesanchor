<text class="ts" x="546" y="300" text-anchor="middle" fill="#993C1D">閲覧・追記が同一画面</text>
<rect x="464" y="404" width="164" height="54" rx="10" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text class="th" x="546" y="426" text-anchor="middle" fill="#4A1B0C">帳票送付（⑥）</text>
<text class="ts" x="546" y="446" text-anchor="middle" fill="#993C1D">見積/請求/フォーム</text>
<text class="ts" x="40" y="500" fill="#5F5E5A">紫＝やり取りの置き場　赤系＝顧客理解の置き場　灰＝器・ヘッダー</text>
