<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 460" width="680" height="460" font-family="sans-serif">
<rect width="680" height="460" fill="#ffffff"/>
<rect x="20" y="20" width="640" height="420" rx="12" fill="none" stroke="#888" stroke-width="1"/>
<text x="40" y="46" font-size="14" font-weight="bold" fill="#1a1a1a">定型文の設定(受信箱内)</text>
<line x1="20" y1="60" x2="660" y2="60" stroke="#ddd" stroke-width="1"/>
<rect x="36" y="76" width="180" height="350" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="52" y="100" font-size="13" font-weight="bold" fill="#04342C">シーン一覧</text>
<rect x="50" y="114" width="152" height="32" rx="6" fill="#9FE1CB" stroke="#0F6E56" stroke-width="1"/>
<text x="64" y="135" font-size="11" fill="#04342C">支払い案内</text>
<text x="64" y="168" font-size="11" fill="#0F6E56">初回挨拶</text>
<text x="64" y="196" font-size="11" fill="#0F6E56">発送連絡</text>
<text x="64" y="224" font-size="11" fill="#0F6E56">見積フォロー</text>
<line x1="50" y1="248" x2="202" y2="248" stroke="#9FE1CB" stroke-width="1"/>
<text x="64" y="272" font-size="11" fill="#0F6E56">+ シーンを追加</text>
<rect x="232" y="76" width="412" height="350" rx="10" fill="#FAEEDA" stroke="#BA7517" stroke-width="1"/>
<text x="248" y="100" font-size="13" font-weight="bold" fill="#633806">テンプレ編集(支払い案内 内)</text>
<text x="248" y="124" font-size="11" fill="#854F0B">テンプレ名 日本語【必須】</text>
<rect x="248" y="132" width="380" height="24" rx="4" fill="#ffffff" stroke="#ccc" stroke-width="1"/>
<text x="258" y="148" font-size="11" fill="#555">入金のお願い</text>
<text x="248" y="176" font-size="11" fill="#854F0B">送る本文 英語【必須】相手が英語受信のとき</text>
<rect x="248" y="184" width="380" height="36" rx="4" fill="#ffffff" stroke="#ccc" stroke-width="1"/>
<text x="258" y="205" font-size="11" fill="#555">Dear customer, this is a friendly reminder...</text>
<text x="248" y="240" font-size="11" fill="#854F0B">送る本文 日本語【必須】相手が日本語受信のとき</text>
<rect x="248" y="248" width="380" height="36" rx="4" fill="#ffffff" stroke="#ccc" stroke-width="1"/>
<text x="258" y="269" font-size="11" fill="#555">お世話になっております。ご入金のお願いです...</text>
<text x="248" y="304" font-size="11" fill="#854F0B">使いどころメモ【任意・送られない】</text>
<rect x="248" y="312" width="380" height="30" rx="4" fill="#ffffff" stroke="#ccc" stroke-width="1"/>
<text x="258" y="331" font-size="11" fill="#555">支払い期限が近い相手へ。催促しすぎない柔らかい文面</text>
<text x="248" y="360" font-size="11" fill="#854F0B">英語版(テンプレ名・使いどころ)【任意・空なら日本語表示】</text>
<rect x="248" y="376" width="80" height="30" rx="6" fill="#FAC775" stroke="#BA7517" stroke-width="1"/>
<text x="288" y="395" font-size="11" text-anchor="middle" fill="#633806">保存</text>
<rect x="340" y="376" width="80" height="30" rx="6" fill="#ffffff" stroke="#A32D2D" stroke-width="1"/>
<text x="380" y="395" font-size="11" text-anchor="middle" fill="#A32D2D">削除</text>
<text x="440" y="395" font-size="11" fill="#854F0B">+ このシーンにテンプレ追加</text>
</svg>
