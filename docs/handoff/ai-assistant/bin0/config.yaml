# 便0-A の Hermes 設定（完成品 v0.23.4・digest 固定）。鍵の値は書かない（鍵は部屋ごとの .env）。
# 場所は完成品の中の hermes_cli/config_defaults.py・gateway/config.py（raw/3-grep.txt）。
# 管理者の固定設定。/etc/hermes/config.yaml に読み取り専用で置く（起動に -v <置き場>:/etc/hermes:ro）。部屋の config と /opt/data/config.yaml にはこの鍵を書かない。
logging:
  # 頼みの先頭 80 字を書く行は INFO（agent/turn_context.py:1290）。WARNING で agent.log の目印 0 行（out/source-check-b4.md）
  level: WARNING

gateway:
  # gateway/config.py:783-785（nested_gateway の multiplex_profiles）
  multiplex_profiles: true

# 全部屋 API の口の道具は空。明示した空の一覧は「道具なし」で閉じる（hermes_cli/tools_config.py:559-566）
platform_toolsets:
  api_server: []

# 覚え書き 2 つ off（hermes_cli/config_defaults.py:1261-1263）
memory:
  memory_enabled: false
  user_profile_enabled: false

# 会話の後ろで回る振り返りを off（agent/background_review.py:319 enabled の既定は true）
auxiliary:
  background_review:
    enabled: false
  title_generation:
    # 新しい会話の最初の送信ごとに題づけの AI 呼び出しが 1 回増える（out/source-check-b5.md Q13）
    enabled: false

# AI 会社の自動の切り替えを切る（既定は空の一覧 hermes_cli/config_defaults.py:25）
# 7回目の F5 で、存在しない頭を送っても別の会社に切り替わらないことを確かめた（out/measure-b-20261125.md 表 3）
fallback_providers: []
