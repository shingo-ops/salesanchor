server {
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # 画面ファイルを圧縮して返す（在庫表の高速化 便1・docs/handoff/frontend-gzip/design.md）
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml text/plain application/manifest+json;

    # index.html: 毎回サーバーに確認させる（キャッシュ無効）
    # → デプロイ後にブラウザが必ず新しいアセットURLを参照できる
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    # 閲覧ページ(/viewer/): 本体と同じ理由で index を毎回確認させる。
    # /viewer の転送は、この location の中だけでポート(8080)を混ぜない（server 全体には置かない）。
    location = /viewer {
        absolute_redirect off;
        return 301 /viewer/;
    }
    location = /viewer/index.html {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }
    location = /viewer/ {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files /viewer/index.html =404;
    }

    # JS/CSS/画像 等のハッシュ付きアセット: 1年間キャッシュ
    # → Vite がビルドごとにファイル名を変えるため、古いファイルが返ることはない
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA ルーティング（全パスを index.html にフォールバック）
    location / {
        try_files $uri $uri/ /index.html;
    }
}
