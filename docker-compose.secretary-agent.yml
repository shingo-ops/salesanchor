# ADR-1056 段2: チャット秘書の容器 secretary-agent（Claude Code を 1 回だけ動かす。DB・redis を持たない）。
# 本体の docker-compose.yml は変えない（別ファイル・別プロジェクト）。
# 起動（deploy.yml が行う）: docker compose -p astro-webapp-secretary -f docker-compose.secretary-agent.yml up -d --force-recreate --no-build
# 止める: docker stop secretary-agent（backend は届かず 503 not_ready。請求書・予定の機能はそのまま動く）
# 秘密（CLAUDE_CODE_OAUTH_TOKEN）の正本は VPS の /home/ubuntu/.config/salesanchor/secretary-agent.env の1か所（値はここに写さない）。
# 置くのは PO が手元で scripts/ops/place-secretary-token.sh を流す。.env には書かない（.env の全キーは backend に渡るため）。
# name は astro-webapp-secretary：deploy の --remove-orphans に消されないよう本体と別プロジェクトにする。
# .env の COMPOSE_PROJECT_NAME が top-level の name: より優先されるため、起動は必ず -p astro-webapp-secretary を付ける。
# frontnet だけに入れる（backnet には入れない）。ports は公開しない（backend からだけ http://secretary-agent:8090）。
name: astro-webapp-secretary

services:
  secretary-agent:
    build: ./secretary-agent
    image: astro-webapp-secretary-agent
    container_name: secretary-agent
    env_file:
      - /home/ubuntu/.config/salesanchor/secretary-agent.env
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:8090/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - frontnet

networks:
  frontnet:
    external: true
    name: astro-webapp_frontnet
