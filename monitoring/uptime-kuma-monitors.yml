# Uptime Kuma 監視項目定義 — SSoT（Single Source of Truth）
#
# 正本。登録は monitoring/scripts/register_kuma_monitors.py。
# register: false は既に本番にある見張りで、script は触らない。
# register: true は本番に無ければ script が足す（同じ名前は作らない）。
# 参照: docs/adr/ADR-069-uptime-kuma-activation.md
# 注意: 監視基盤の宛先は内部向けのため、公開リポジトリには url を書かない

monitors:
  # --- 監視基盤（本番に登録済み。script は触らない）---
  - name: "app-vps node-exporter"
    type: http
    interval: 60
    register: false
    description: "app-vps の node-exporter（監視基盤）"

  - name: "Loki"
    type: http
    interval: 60
    register: false
    description: "Loki（ログ基盤）"

  - name: "Alertmanager"
    type: http
    interval: 60
    register: false
    description: "Alertmanager（通知基盤）"

  - name: "Prometheus"
    type: http
    interval: 60
    register: false
    description: "Prometheus（メトリクス基盤）"

  # --- 利用者向け（script が足す）---
  - name: "App 本番"
    url: "https://app.salesanchor.jp/"
    type: http
    interval: 60
    register: true
    description: "Sales Anchor アプリ本番フロントエンド"

  - name: "API ヘルスチェック"
    url: "https://api.salesanchor.jp/api/health"
    type: http
    interval: 60
    register: true
    description: "FastAPI バックエンド ヘルスエンドポイント"

  - name: "LP"
    url: "https://salesanchor.jp/"
    type: http
    interval: 60
    register: true
    description: "Sales Anchor LP（Astro）"
