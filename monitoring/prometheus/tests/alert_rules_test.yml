  # --- outage-recovery-watch 便1: 時計ずれ ---
  # timestamp() は試験の中の値の時刻（0 から 1m おき）。値と読み取り時刻の差が一定になる系列で確かめる
  - name: ClockSkewFiringBehind
    interval: 1m
    input_series:
      - series: 'node_time_seconds{job="node-exporter", instance="app-vps"}'
        values: '-2436+60x30'
    alert_rule_test:
      - eval_time: 1m
        alertname: ClockSkew
        exp_alerts: []
      - eval_time: 5m
        alertname: ClockSkew
        exp_alerts:
          - exp_labels:
              job: node-exporter
              instance: app-vps
              severity: critical
              tier: page
            exp_annotations:
              summary: "サーバー app-vps の時計が 60 秒以上ずれています"
              description: "app-vps の時計と監視サーバーの時計の差が 40m 36s です。この間、時刻を比べる警報（裏方の処理が止まった等）は止めています。"
              runbook_url: "https://github.com/shingo-ops/salesanchor/blob/main/docs/runbooks/alerts.md#clockskew"

  - name: ClockSkewFiringAhead
    interval: 1m
    input_series:
      - series: 'node_time_seconds{job="node-exporter", instance="app-vps"}'
        values: '61+60x30'
    alert_rule_test:
      - eval_time: 5m
        alertname: ClockSkew
        exp_alerts:
          - exp_labels:
              job: node-exporter
              instance: app-vps
              severity: critical
              tier: page
            exp_annotations:
              summary: "サーバー app-vps の時計が 60 秒以上ずれています"
              description: "app-vps の時計と監視サーバーの時計の差が 1m 1s です。この間、時刻を比べる警報（裏方の処理が止まった等）は止めています。"
              runbook_url: "https://github.com/shingo-ops/salesanchor/blob/main/docs/runbooks/alerts.md#clockskew"

  - name: ClockSkewQuietBelowBoundary
    interval: 1m
    input_series:
      - series: 'node_time_seconds{job="node-exporter", instance="app-vps"}'
        values: '59+60x30'
    alert_rule_test:
      - eval_time: 5m
        alertname: ClockSkew
        exp_alerts: []

  - name: ClockSkewQuietNoSkew
