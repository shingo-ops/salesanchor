# Prometheus アラートルール
# Grafana経由でSlack通知を設定する

groups:
  - name: system_alerts
    rules:
      # CPU使用率が80%を超えた場合（5分間平均）
      - alert: HighCpuUsage
        expr: 100 - (avg(rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 5m
        labels:
          severity: warning
          tier: ticket
        annotations:
          summary: "CPU使用率が80%を超えています"
          description: "CPU使用率: {{ $value | printf \"%.1f\" }}%（5分間平均）"
          runbook_url: "https://github.com/shingo-ops/salesanchor/blob/main/docs/runbooks/alerts.md#highcpuusage"

      # メモリ使用率が85%を超えた場合
      - alert: HighMemoryUsage
        expr: (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100 > 85
        for: 5m
        labels:
          severity: warning
          tier: ticket
        annotations:
          summary: "メモリ使用率が85%を超えています"
          description: "メモリ使用率: {{ $value | printf \"%.1f\" }}%"
          runbook_url: "https://github.com/shingo-ops/salesanchor/blob/main/docs/runbooks/alerts.md#highmemoryusage"

      # ディスク使用率が80%を超えた場合
      - alert: HighDiskUsage
        expr: (1 - node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) * 100 > 80
        for: 5m
        labels:
          severity: warning
          tier: ticket
        annotations:
          summary: "ディスク使用率が80%を超えています"
          description: "ディスク使用率: {{ $value | printf \"%.1f\" }}%"
          runbook_url: "https://github.com/shingo-ops/salesanchor/blob/main/docs/runbooks/alerts.md#highdiskusage"

      # ディスク使用率が90%を超えた場合（即時対応レベル）
      - alert: CriticalDiskUsage
        expr: (1 - node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) * 100 > 90
        for: 2m
        labels:
          severity: critical
          tier: page
        annotations:
          summary: "ディスク使用率が90%を超えています（{{ $labels.instance }}）"
          description: "ディスク使用率: {{ $value | printf \"%.1f\" }}%（instance={{ $labels.instance }}）。即時対応が必要です。"
          runbook_url: "https://github.com/shingo-ops/salesanchor/blob/main/docs/runbooks/alerts.md#criticaldiskusage"

  - name: application_alerts
    rules:
      # サービスダウン検知（Exporter応答なし）
      - alert: ServiceDown
        expr: up == 0
        for: 2m
        labels:
          severity: critical
          tier: page
        annotations:
          summary: "{{ $labels.job }}がダウンしています"
          description: "Exporterからの応答がありません。即時確認してください。"
          runbook_url: "https://github.com/shingo-ops/salesanchor/blob/main/docs/runbooks/alerts.md#servicedown"

      # FastAPI バックエンド 5xxエラーレート（tokens.yml: backend_5xx_per_1m=5）
      # backend/app/metrics.py が出力する http_requests_total を使用
      - alert: BackendHighErrorRate
        expr: sum(rate(http_requests_total{job="backend", status=~"5.."}[1m])) > 5
        for: 2m
        labels:
          severity: warning
          tier: page
        annotations:
          summary: "バックエンド 5xxエラーが急増しています"
          description: "5xxエラーが 1分間で {{ $value | printf \"%.1f\" }} req/s を超えています（閾値: 5 req/s）"
          runbook_url: "https://github.com/shingo-ops/salesanchor/blob/main/docs/runbooks/alerts.md#backendhigherrorrate"

      # FastAPI バックエンドの遅いリクエストの割合（/api/health を除く。tokens.yml: backend_slow_request_sec=2.5・backend_slow_ratio=0.05）
      - alert: BackendHighLatency
        expr: (1 - (sum(rate(http_request_duration_seconds_bucket{job="backend",handler!="/api/health",le="2.5"}[5m])) / sum(rate(http_request_duration_seconds_count{job="backend",handler!="/api/health"}[5m])))) > 0.05
        for: 5m
        labels:
          severity: warning
          tier: ticket
        annotations:
          summary: "バックエンドの遅いリクエストの割合が高い"
          description: "/api/health を除くリクエストのうち 2.5 秒を超えた割合が {{ $value | humanizePercentage }} です（閾値: 5%・5 分継続）"
          runbook_url: "https://github.com/shingo-ops/salesanchor/blob/main/docs/runbooks/alerts.md#backendhighlatency"

      # FastAPI バックエンドの同時処理中リクエスト数（workers=1 前提）
      - alert: BackendWorkerSaturated
        expr: http_requests_in_flight{job="backend"} > 1
        for: 2m
        labels:
          severity: warning
          tier: ticket
        annotations:
          summary: "バックエンド worker が飽和し始めています"
          description: "同時処理中リクエスト数が 1 を超えています。workers=1 運用では待ち行列が発生している可能性があります。"
          runbook_url: "https://github.com/shingo-ops/salesanchor/blob/main/docs/runbooks/alerts.md#backendworkersaturated"

      # SSE 接続数が多いと worker 余力の確認が必要になる
      - alert: BackendSseConnectionsHigh
        expr: sum(sse_connections_active{job="backend"}) > 8
        for: 5m
        labels:
          severity: warning
          tier: ticket
        annotations:
          summary: "バックエンド SSE 接続数が多い"
          description: "SSE 接続数が 8 を超えています。SSE は worker を占有しない一方で、接続とメモリを消費します。"
          runbook_url: "https://github.com/shingo-ops/salesanchor/blob/main/docs/runbooks/alerts.md#backendsseconnectionshigh"

  - name: f2_cleanup
    rules:
      - alert: F2CleanupStale
        expr: (time() - f2_cleanup_last_success_timestamp{instance="app-vps"}) > 691200
        for: 1h
        labels:
          severity: critical
          tier: ticket
        annotations:
          summary: "F2掃除係の黒板が8日以上更新なし(app-vps)"
          description: "f2-cleanup.shが8日以上完全成功していない。cron・スクリプト・textfile配線を確認。"
          runbook_url: "https://github.com/shingo-ops/salesanchor/blob/main/docs/runbooks/alerts.md#f2cleanupstale"
      - alert: F2CleanupAbsent
        expr: absent(f2_cleanup_last_success_timestamp{instance="app-vps"})
        for: 24h
        labels:
          severity: critical
          tier: ticket
        annotations:
          summary: "F2掃除係の黒板メトリクスが消失(app-vps)"
          description: "黒板ファイルまたはtextfile配線の断線疑い。node_exporter設定を確認。"
          runbook_url: "https://github.com/shingo-ops/salesanchor/blob/main/docs/runbooks/alerts.md#f2cleanupabsent"

  - name: uptime_kuma
    rules:
      # Kuma の見張りが失敗している（App・API・LP・監視基盤）
      - alert: KumaMonitorDown
        expr: monitor_status == 0
        for: 2m
        labels:
          severity: critical
          tier: page
        annotations:
          summary: "見張り {{ $labels.monitor_name }} が失敗しています"
          description: "Uptime Kuma の見張り {{ $labels.monitor_name }} が 2 分以上失敗しています"
          runbook_url: "https://github.com/shingo-ops/salesanchor/blob/main/docs/runbooks/alerts.md#kumamonitordown"

      # 証明書の期限が近い
      - alert: CertExpiringSoon
        expr: monitor_cert_days_remaining < 14
        for: 1h
        labels:
          severity: warning
          tier: ticket
        annotations:
          summary: "{{ $labels.monitor_name }} の証明書の期限が近づいています"
          description: "残り {{ $value }} 日です（14 日未満）"
          runbook_url: "https://github.com/shingo-ops/salesanchor/blob/main/docs/runbooks/alerts.md#certexpiringsoon"

      # 証明書が無効
      - alert: CertInvalid
        expr: monitor_cert_is_valid == 0
        for: 10m
        labels:
          severity: critical
          tier: page
        annotations:
          summary: "{{ $labels.monitor_name }} の証明書が無効です"
          description: "Uptime Kuma が証明書を無効と判定しています"
          runbook_url: "https://github.com/shingo-ops/salesanchor/blob/main/docs/runbooks/alerts.md#certinvalid"

  - name: celery_alerts
    rules:
      # celery の heartbeat が古い（beat の停止・worker の停止や詰まり。tokens.yml: celery_heartbeat_stale_sec=600）
      # backend/app/metrics.py が Redis から読んで出す celery_heartbeat_last_success_timestamp_seconds を使用
      - alert: CeleryHeartbeatStale
        expr: (time() - celery_heartbeat_last_success_timestamp_seconds{job="backend"}) > 600
        for: 2m
        labels:
          severity: critical
          tier: page
        annotations:
          summary: "裏方の処理（celery）が 10 分以上動いていません"
          description: "1 分ごとの heartbeat が {{ $value | humanizeDuration }} 前から更新されていません（閾値: 10 分）。beat か worker が止まっているか詰まっています。"
          runbook_url: "https://github.com/shingo-ops/salesanchor/blob/main/docs/runbooks/alerts.md#celeryheartbeatstale"

      # 同じタスクの失敗が 1 時間に 3 回以上（tokens.yml: celery_task_failures_per_1h=3）
      - alert: CeleryTaskFailuresHigh
        expr: sum by (task) (increase(celery_task_failures{job="backend"}[1h])) >= 3
        for: 0m
        labels:
          severity: warning
          tier: ticket
        annotations:
          summary: "裏方の処理（celery）の {{ $labels.task }} が失敗を繰り返しています"
          description: "{{ $labels.task }} が直近 1 時間に {{ $value | humanize }} 回失敗しました（閾値: 3 回）。"
          runbook_url: "https://github.com/shingo-ops/salesanchor/blob/main/docs/runbooks/alerts.md#celerytaskfailureshigh"

      # 待ち行列が溜まっている（tokens.yml: celery_queue_length_max=100）
      - alert: CeleryQueueBacklog
        expr: celery_queue_length{job="backend"} > 100
        for: 10m
        labels:
          severity: warning
          tier: ticket
        annotations:
          summary: "裏方の処理（celery）の待ち行列が溜まっています"
          description: "待ち行列が {{ $value | humanize }} 件です（閾値: 100 件・10 分継続）。"
          runbook_url: "https://github.com/shingo-ops/salesanchor/blob/main/docs/runbooks/alerts.md#celeryqueuebacklog"

      # 閲覧ページの在庫の作り置き（ADR-1019 段2b）が止まっている。保留（配信を止めている最中）かどうかで 2 本に分ける
      # tokens.yml: viewer_inventory_stale_sec=600 / viewer_inventory_hold_recent_sec=120
      # backend/app/metrics.py が Redis（db0）から読んで出す viewer_inventory_*_timestamp_seconds を使用
      - alert: ViewerInventoryStale
        expr: (time() - viewer_inventory_updated_timestamp_seconds{job="backend"}) > 600 and (time() - viewer_inventory_last_hold_timestamp_seconds{job="backend"}) > 120
        for: 2m
        labels:
          severity: warning
          tier: ticket
        annotations:
          summary: "閲覧ページの在庫の作り置きが10分以上更新されていない（保留ではない）"
          description: "作り置きのタスクの失敗が続いている可能性。worker の停止は CeleryHeartbeatStale が別に知らせる"
          runbook_url: "https://github.com/shingo-ops/salesanchor/blob/main/docs/runbooks/alerts.md#viewerinventorystale"

      - alert: ViewerInventoryStaleOnHold
        expr: (time() - viewer_inventory_updated_timestamp_seconds{job="backend"}) > 600 and (time() - viewer_inventory_last_hold_timestamp_seconds{job="backend"}) <= 120
        for: 2m
        labels:
          severity: warning
          tier: ticket
        annotations:
          summary: "閲覧ページの在庫の作り置きが10分以上止まっている（配信の保留中）"
          description: "解析の実行中などで配信が保留されている。閲覧ページは前回の在庫を出し続ける（設計 Q11）"
          runbook_url: "https://github.com/shingo-ops/salesanchor/blob/main/docs/runbooks/alerts.md#viewerinventorystaleonhold"

  - name: backup_alerts
    rules:
      # DB バックアップ（scripts/backup.sh）の最終成功から 26 時間（tokens.yml: backup_stale_sec=93600）
      # prod1 の node-exporter の textfile（backup_local.prom）を使用
      - alert: BackupLocalStale
        expr: (time() - backup_local_last_success_timestamp{instance="app-vps"}) > 93600
        for: 10m
        labels:
          severity: warning
          tier: ticket
        annotations:
          summary: "DB バックアップが 26 時間以上成功していません"
          description: "scripts/backup.sh の最終成功から {{ $value | humanizeDuration }} たちました（閾値: 26 時間）。翌営業日までに復旧してください。"
          runbook_url: "https://github.com/shingo-ops/salesanchor/blob/main/docs/runbooks/alerts.md#backuplocalstale"

      # S3 への写し（scripts/backup_to_s3.sh）の最終成功から 26 時間（tokens.yml: backup_stale_sec=93600）
      # prod1 の node-exporter の textfile（backup_s3.prom）を使用
      - alert: BackupS3Stale
        expr: (time() - backup_s3_last_success_timestamp{instance="app-vps"}) > 93600
        for: 10m
        labels:
          severity: warning
          tier: ticket
        annotations:
          summary: "S3 へのバックアップの写しが 26 時間以上成功していません"
          description: "scripts/backup_to_s3.sh の最終成功から {{ $value | humanizeDuration }} たちました（閾値: 26 時間）。翌営業日までに復旧してください。"
          runbook_url: "https://github.com/shingo-ops/salesanchor/blob/main/docs/runbooks/alerts.md#backups3stale"

      # 成功時刻の系列そのものが無い（textfile の断線・ファイルの消失）
      - alert: BackupTimestampAbsent
        expr: absent(backup_local_last_success_timestamp{instance="app-vps"}) or absent(backup_s3_last_success_timestamp{instance="app-vps"})
        for: 30h
        labels:
          severity: warning
          tier: ticket
        annotations:
          summary: "バックアップの成功時刻が取れていません(app-vps)"
          description: "backup_local.prom か backup_s3.prom の時刻が 30 時間取れていません。textfile の置き場と 2 つのファイルの有無を確認してください。"
          runbook_url: "https://github.com/shingo-ops/salesanchor/blob/main/docs/runbooks/alerts.md#backuptimestampabsent"

  - name: config_drift_alerts
    rules:
      # prod2 に置いた監視設定 6 本と main のずれ（.github/workflows/monitoring-config-drift.yml が毎日 pushgateway に送る）
      - alert: MonitoringConfigDrift
        expr: monitoring_config_drift_files{job="monitoring_config_drift"} > 0
        for: 5m
        labels:
          severity: warning
          tier: ticket
        annotations:
          summary: "監視サーバーの設定が main とずれています"
          description: "prod2 に置いた監視設定のうち {{ $value }} 本が main と一致しません。workflow の実行ログでファイル名を確認し、main の版を置き直してください。"
          runbook_url: "https://github.com/shingo-ops/salesanchor/blob/main/docs/runbooks/alerts.md#monitoringconfigdrift"

      # ずれの確認そのものが止まった（tokens.yml: config_check_stale_sec=180000）
      # pushgateway は最後の値を持ち続けるので、送った時刻の古さで見る
      - alert: MonitoringConfigCheckStale
        expr: (time() - monitoring_config_drift_last_run_timestamp{job="monitoring_config_drift"}) > 180000 or absent(monitoring_config_drift_last_run_timestamp{job="monitoring_config_drift"})
        for: 1h
        labels:
          severity: warning
          tier: ticket
        annotations:
          summary: "監視設定のずれの確認が 50 時間以上動いていません"
          description: "monitoring-config-drift の workflow が 50 時間以上 pushgateway に送っていません。prod2 の runner と workflow の実行を確認してください。"
          runbook_url: "https://github.com/shingo-ops/salesanchor/blob/main/docs/runbooks/alerts.md#monitoringconfigcheckstale"

  - name: container_state_alerts
    rules:
      # 健康診断（docker-compose.yml の healthcheck・便D）が unhealthy（ADR-1012 段階3 便E）
      # prod1 の scripts/ops/container_state.py が毎分 textfile に書く。札は処置の付く便G で auto に変える
      - alert: ContainerUnhealthy
        expr: salesanchor_container_unhealthy{service=~"celery-worker|celery-beat|discord-gateway|gemini-egress"} == 1
        for: 1m
        labels:
          severity: critical
          tier: page
        annotations:
          summary: "コンテナ {{ $labels.service }} が不健康です"
          description: "prod1 の {{ $labels.service }} の健康診断が unhealthy です。固まっている可能性があります。"
          runbook_url: "https://github.com/shingo-ops/salesanchor/blob/main/docs/runbooks/alerts.md#containerunhealthy"

      # 状態書き係が 5 分書いていない（cron の停止・docker が読めない・ファイルが無い）
      - alert: ContainerStateStale
        expr: (time() - salesanchor_container_state_last_run_timestamp_seconds{instance="app-vps"}) > 300 or absent(salesanchor_container_state_last_run_timestamp_seconds{instance="app-vps"})
        for: 2m
        labels:
          severity: critical
          tier: page
        annotations:
          summary: "コンテナの状態書き係が 5 分以上動いていません"
          description: "prod1 の scripts/ops/container_state.py が 5 分以上 textfile を書いていません。コンテナの不健康を知らせられない状態です。"
          runbook_url: "https://github.com/shingo-ops/salesanchor/blob/main/docs/runbooks/alerts.md#containerstatestale"

      # 動いているのに健康診断（healthcheck）が無い。この間 ContainerUnhealthy は鳴らない（ADR-1012 段階3 定着便 T1）
      - alert: ContainerHealthcheckMissing
        expr: salesanchor_container_healthcheck_missing{service=~"celery-worker|celery-beat|discord-gateway|gemini-egress"} == 1
        for: 10m
        labels:
          severity: warning
          tier: ticket
        annotations:
          summary: "コンテナ {{ $labels.service }} に健康診断がありません"
          description: "prod1 の {{ $labels.service }} は動いていますが、健康診断（healthcheck）がありません。固まっても ContainerUnhealthy が鳴りません。"
          runbook_url: "https://github.com/shingo-ops/salesanchor/blob/main/docs/runbooks/alerts.md#containerhealthcheckmissing"

  - name: clock_alerts
    rules:
      # 各機体の時計と、Prometheus（prod2）が値を読み取った時刻の差が 60 秒超（tokens.yml: clock_skew_sec=60）
      # 2026-10-22 のさくらメンテの後、prod1 が約 40 分遅れて時刻を比べる警報が誤って鳴った（outage-recovery-watch 便1）
      # この警報が鳴っている間、時刻を比べる 7 本は alertmanager.yml の inhibit_rules で止める
      - alert: ClockSkew
        expr: abs(node_time_seconds{job="node-exporter"} - timestamp(node_time_seconds{job="node-exporter"})) > 60
        for: 2m
        keep_firing_for: 5m
        labels:
          severity: critical
          tier: page
        annotations:
          summary: "サーバー {{ $labels.instance }} の時計が 60 秒以上ずれています"
          description: "{{ $labels.instance }} の時計と監視サーバーの時計の差が {{ $value | humanizeDuration }} です。この間、時刻を比べる警報（裏方の処理が止まった等）は止めています。"
          runbook_url: "https://github.com/shingo-ops/salesanchor/blob/main/docs/runbooks/alerts.md#clockskew"

      # 時刻合わせ（NTP）が止まった。ずれる前の兆候
      - alert: ClockSyncStopped
        expr: node_timex_sync_status{job="node-exporter"} == 0
        for: 10m
        labels:
          severity: warning
          tier: ticket
        annotations:
          summary: "サーバー {{ $labels.instance }} の時刻合わせが止まっています"
          description: "{{ $labels.instance }} で時刻合わせ（NTP）が 10 分以上同期していません。このままだと時計がずれ、時刻を比べる警報が誤って鳴ります。"
          runbook_url: "https://github.com/shingo-ops/salesanchor/blob/main/docs/runbooks/alerts.md#clocksyncstopped"

  - name: recovery_check_alerts
    rules:
      # 復旧後の点検で、6 分たっても直らない項目がある（outage-recovery-watch 便2・monitoring/recovery-check）
      # 同時に NG の項目は group_by（alertname, job, instance）で 1 件の通知にまとまる。全部直ると Discord に「解決」が届く
      - alert: RecoveryCheckFailed
        expr: salesanchor_recovery_check_failed{job="recovery-check"} == 1
        labels:
          severity: critical
          tier: page
        annotations:
          summary: "❌ サーバー復旧後の点検で異常: {{ $labels.item_ja }}"
          description: "本番の API が止まって戻った後の点検で、{{ $labels.item_ja }}（{{ $labels.item }}）が 6 分たっても正常に戻りません。5 分おきに点検を続け、直ればこの警報は解決します。"
          runbook_url: "https://github.com/shingo-ops/salesanchor/blob/main/docs/runbooks/alerts.md#recoverycheckfailed"

      # 復旧後の点検がすべて正常（✅）。10 分だけ鳴り、Discord にだけ届く（alertmanager.yml の子ルート。解決の通知は出さない）
      - alert: RecoveryCheckPassed
        expr: salesanchor_recovery_check_passed_until_timestamp_seconds{job="recovery-check"} > time()
        labels:
          severity: info
          tier: ticket
        annotations:
          summary: "✅ サーバー復旧後の点検: すべて正常です"
          description: "本番の API が止まって戻った後の点検で、アプリ画面・API・データベース・Redis・裏方の処理の受け手・紹介ページ・監視の読み取り・本番サーバーの時計・裏方の処理・コンテナの状態記録がすべて正常でした。対応は不要です。"
          runbook_url: "https://github.com/shingo-ops/salesanchor/blob/main/docs/runbooks/alerts.md#recoverycheckpassed"

      # 点検係の繰り返しが 5 分以上止まっている（tokens.yml: recovery_check_stale_sec=300）
      - alert: RecoveryCheckStale
        expr: (time() - salesanchor_recovery_check_last_poll_timestamp_seconds{job="recovery-check"}) > 300
        for: 5m
        labels:
          severity: warning
          tier: ticket
        annotations:
          summary: "復旧後の点検係が止まっています"
          description: "点検係（recovery-check）が {{ $value | humanizeDuration }} の間、点検を回していません。この間、サーバーが戻っても ✅/❌ は届きません。"
          runbook_url: "https://github.com/shingo-ops/salesanchor/blob/main/docs/runbooks/alerts.md#recoverycheckstale"
