# monitoring/tokens.yml
# ============================================================
# 監視スタック Design Tokens — Single Source of Truth
#
# 【このファイルの役割】
#   監視設定の「唯一の正」として、全ての値をここに定義する。
#   閾値・バージョンを変更するときはこのファイルだけ修正すればよい。
#
# 【スコープ】
#   - バージョン（docker-compose.yml のイメージタグと一致させる）
#   - スクレイプ間隔・データ保持期間
#   - アラート閾値（Prometheus alert_rules.yml / Loki alerts.yml）
#   - アラート継続時間（for: の値）
#   ※ スクレイプ対象のポート番号・リソース制限はスコープ外
#
# 【バージョン更新手順】
#   1. このファイルの versions: を新しい値に変更
#   2. docker-compose.yml の対応 image: タグを同じ値に変更
#   3. VPS で docker compose pull && docker compose up -d を実行
#   ロールバック: git revert でこのファイルを前のコミットに戻し、同手順を実行
# ============================================================

# --- バージョン固定 ---
# 対応ファイル: docker-compose.yml の各 image: タグ
# 最終更新: 2026-05-27
versions:
  # インフラ
  nginx:             "1.31.1"
  certbot:           "v5.6.0"
  # 監視スタック
  prometheus:        "v3.11.3"
  grafana:           "13.0.1"
  loki:              "3.7.2"
  promtail:          "3.6.11"
  node_exporter:     "v1.11.1"
  postgres_exporter: "v0.19.1"
  nginx_exporter:    "1.5.1"
  uptime_kuma:       "1.23.16"
  # gha-exporter は build: 方式のため image タグではなく GitHub Releases バージョンを記録
  # 対応ファイル: monitoring/gha-exporter/Dockerfile ARG GHA_EXPORTER_VERSION
  gha_exporter:      "v0.0.15"
  # ドリルダウン監視（ADR-079）
  # cadvisor: VPS cgroup 名前空間制限により無効化
  redis_exporter:    "v1.67.0"

# --- スクレイプ・評価間隔 ---
# 対応ファイル: monitoring/prometheus/prometheus.yml
intervals:
  scrape:     "15s"
  evaluation: "15s"

# --- データ保持期間 ---
# 対応ファイル:
#   prometheus: docker-compose.yml --storage.tsdb.retention.time
#   loki:       monitoring/loki/loki-config.yaml retention_period
retention:
  prometheus: "30d"
  loki:       "30d"

# --- アラート閾値 ---
# 対応ファイル: monitoring/prometheus/alert_rules.yml
#              monitoring/loki/rules/jarvis/alerts.yml
thresholds:
  # システムリソース（alert_rules.yml: system_alerts）
  cpu_warning_pct:        80    # HighCpuUsage: > 80 (5分間平均)
  memory_warning_pct:     85    # HighMemoryUsage: > 85
  disk_warning_pct:       80    # HighDiskUsage: > 80

  # Uptime Kuma
  kuma_cert_days_warning: 14    # CertExpiringSoon: monitor_cert_days_remaining < 14

  # FastAPI バックエンド API（alert_rules.yml: backend_alerts）
  # backend/app/metrics.py が出力する http_requests_total を使用
  backend_5xx_per_1m:      5    # BackendHighErrorRate: rate(...[1m]) > 5 (5xx)
  backend_slow_request_sec: 2.5  # BackendHighLatency: 2.5 秒を超えたリクエストを「遅い」と数える（/api/health を除く）
  backend_slow_ratio:       0.05 # BackendHighLatency: 遅いリクエストの割合 > 0.05 が 5 分続いたら鳴らす
  backend_inflight_warning: 1    # BackendWorkerSaturated: http_requests_in_flight > 1
  backend_sse_warning:      8    # BackendSseConnectionsHigh: sum(sse_connections_active) > 8

  # celery（alert_rules.yml: celery_alerts）
  # backend/app/metrics.py が Redis から読んで出す celery_* を使用
  celery_heartbeat_stale_sec:   600  # CeleryHeartbeatStale: time() - heartbeat > 600
  celery_task_failures_per_1h:    3  # CeleryTaskFailuresHigh: 同じタスクの increase([1h]) >= 3
  celery_queue_length_max:      100  # CeleryQueueBacklog: celery_queue_length > 100
  viewer_inventory_stale_sec:   600  # ViewerInventoryStale / ViewerInventoryStaleOnHold: time() - 作り置きの更新時刻 > 600
  viewer_inventory_hold_recent_sec: 120  # 上の 2 本の振り分け: time() - 保留の確認時刻 が 120 以下なら保留中

  # バックアップの鮮度（alert_rules.yml: backup_alerts）
  # scripts/backup.sh・scripts/backup_to_s3.sh が prod1 の textfile に書く *_last_success_timestamp を使用
  backup_stale_sec:         93600  # BackupLocalStale / BackupS3Stale: time() - 成功時刻 > 93600（26h）

  # 監視設定のずれ（alert_rules.yml: config_drift_alerts）
  # .github/workflows/monitoring-config-drift.yml が prod2 の pushgateway に送る値を使用
  config_drift_files:          0  # MonitoringConfigDrift: monitoring_config_drift_files > 0
  config_check_stale_sec: 180000  # MonitoringConfigCheckStale: time() - 送った時刻 > 180000（50h）

  # 時計ずれ（alert_rules.yml: clock_alerts）
  clock_skew_sec: 60  # ClockSkew: abs(node_time_seconds - timestamp(node_time_seconds)) > 60

  # 復旧後の点検係（alert_rules.yml: recovery_check_alerts）
  recovery_check_stale_sec: 300  # RecoveryCheckStale: time() - salesanchor_recovery_check_last_poll_timestamp_seconds > 300

  # 運用の受け箱（alert_rules.yml: ops_mail_alerts）
  ops_mail_silent_sec:     3456000  # OpsMailSilent: time() - salesanchor_ops_mail_last_sakura_mail_timestamp_seconds > 3456000（40 日）
  ops_mail_poll_stale_sec:   10800  # OpsMailPollStale: time() - salesanchor_ops_mail_last_poll_success_timestamp_seconds > 10800（3 時間）

  # ログ異常検知（loki/rules/jarvis/alerts.yml）
  brute_force_per_5m:     20    # BruteForceAttempt: > 20
  auth_failure_per_1h:    50    # SustainedAuthFailure: > 50
  backend_error_per_5m:   30    # BackendErrorSpike: > 30
  db_error_per_5m:         5    # DatabaseError: > 5

# --- アラート継続時間（for: の値）---
# 対応ファイル: monitoring/prometheus/alert_rules.yml
#              monitoring/loki/rules/jarvis/alerts.yml
for_durations:
  resource_warning:  "5m"   # HighCpuUsage / HighMemoryUsage / HighDiskUsage
  service_down:      "2m"   # ServiceDown
  kuma_monitor_down: "2m"   # KumaMonitorDown: monitor_status == 0
  kuma_cert_expiring: "1h"  # CertExpiringSoon
  kuma_cert_invalid: "10m"  # CertInvalid: monitor_cert_is_valid == 0
  brute_force:       "1m"   # BruteForceAttempt
  auth_failure:      "5m"   # SustainedAuthFailure
  backend_error:     "2m"   # BackendErrorSpike
  backend_worker:    "2m"   # BackendWorkerSaturated
  backend_sse:       "5m"   # BackendSseConnectionsHigh
  db_log_error:      "1m"   # DatabaseError
  celery_heartbeat:  "2m"   # CeleryHeartbeatStale
  celery_failures:   "0m"   # CeleryTaskFailuresHigh
  celery_queue:      "10m"  # CeleryQueueBacklog
  viewer_inventory:  "2m"   # ViewerInventoryStale / ViewerInventoryStaleOnHold
  backup_stale:      "10m"  # BackupLocalStale / BackupS3Stale
  backup_absent:     "30h"  # BackupTimestampAbsent
  config_drift:       "5m"  # MonitoringConfigDrift
  config_check_stale: "1h"  # MonitoringConfigCheckStale
  clock_skew:         "2m"   # ClockSkew
  clock_sync_stopped: "10m"  # ClockSyncStopped
  recovery_check_stale: "5m"   # RecoveryCheckStale
  ops_mail_silent:      "1h"   # OpsMailSilent
  ops_mail_poll_stale:  "10m"  # OpsMailPollStale
