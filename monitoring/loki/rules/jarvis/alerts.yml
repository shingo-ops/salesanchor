# Loki 異常検知アラートルール
# 認証失敗の連続検知、エラーログ急増検知

groups:
  - name: auth_anomaly
    rules:
      # ログインの入口6つの失敗(401)と締め出し(429)が5分間に10件超（攻撃の可能性）
      # 数えるのはバックエンド(uvicorn)の行だけ。入口(nginx)の行は "401 <数字>" の形なので当たらない
      # 10件 = アプリが1つのIPを締め出す回数（backend/app/cache.py の AUTH_FAIL_MAX）。設計: docs/handoff/ai-ops-247/login-alert-design.md
      - alert: BruteForceAttempt
        expr: |
          sum(count_over_time({job="containerlogs"} |~ "\"POST /api/v1/(auth/login|auth/passkey/login/verify|auth/password-reset/confirm|auth/login-requests/recovery|viewer/login|viewer/password-reset/confirm) HTTP/[0-9.]+\" (401 Unauthorized|429 Too Many Requests)" [5m])) > 10
        for: 1m
        labels:
          severity: critical
          tier: page
        annotations:
          summary: "ログインの失敗が急に増えています（攻撃の可能性）"
          description: "直近5分間にログインの失敗(401)と締め出し(429)が10件を超えました。即時確認してください。"
          runbook_url: "https://github.com/shingo-ops/salesanchor/blob/main/docs/runbooks/alerts.md#bruteforceattempt"

      # 同じ数え方で1時間に20件超（5分に10件未満でゆっくり続く失敗）
      - alert: SustainedAuthFailure
        expr: |
          sum(count_over_time({job="containerlogs"} |~ "\"POST /api/v1/(auth/login|auth/passkey/login/verify|auth/password-reset/confirm|auth/login-requests/recovery|viewer/login|viewer/password-reset/confirm) HTTP/[0-9.]+\" (401 Unauthorized|429 Too Many Requests)" [1h])) > 20
        for: 5m
        labels:
          severity: warning
          tier: ticket
        annotations:
          summary: "ログインの失敗が続いています"
          description: "直近1時間にログインの失敗(401)と締め出し(429)が20件を超えました。"
          runbook_url: "https://github.com/shingo-ops/salesanchor/blob/main/docs/runbooks/alerts.md#sustainedauthfailure"

  - name: error_anomaly
    rules:
      # バックエンドのエラーログ急増（5分間に30件以上）
      - alert: BackendErrorSpike
        expr: |
          sum(count_over_time({job="containerlogs", container_name=~".*backend.*"} |~ "ERROR|Exception|Traceback" [5m])) > 30
        for: 2m
        labels:
          severity: warning
          tier: page
        annotations:
          summary: "バックエンドのエラーログが急増しています"
          description: "直近5分間にERROR/Exceptionが30件以上検出されました。"
          runbook_url: "https://github.com/shingo-ops/salesanchor/blob/main/docs/runbooks/alerts.md#backenderrorspike"

      # PostgreSQLエラーログ検知
      - alert: DatabaseError
        expr: |
          sum(count_over_time({job="containerlogs", container_name=~".*postgres.*"} |~ "ERROR|FATAL|PANIC" [5m])) > 5
        for: 1m
        labels:
          severity: critical
          tier: page
        annotations:
          summary: "PostgreSQLでエラーが発生しています"
          description: "直近5分間にDB ERROR/FATAL/PANICログを検出しました。"
          runbook_url: "https://github.com/shingo-ops/salesanchor/blob/main/docs/runbooks/alerts.md#databaseerror"

  - name: discord_gateway
    rules:
      # Discord Gateway 切断 / 再接続失敗（DM 受信箱に影響）
      - alert: DiscordGatewayReconnectFailure
        expr: |
          sum(count_over_time({job="containerlogs", container_name=~".*discord.*"} |~ "reconnect|LoginFailure|RuntimeError|接続失敗" [10m])) > 3
        for: 2m
        labels:
          severity: warning
          tier: page
        annotations:
          summary: "Discord Gateway が再接続に繰り返し失敗しています"
          description: "直近10分間に reconnect/LoginFailure ログが3件以上。DM 受信が停止している可能性があります。"
          runbook_url: "https://github.com/shingo-ops/salesanchor/blob/main/docs/runbooks/alerts.md#discordgatewayreconnectfailure"

      # dm_writer DB 書き込みエラー（lead 取得失敗）
      - alert: DiscordDmWriterError
        expr: |
          sum(count_over_time({job="containerlogs", container_name=~".*discord.*"} |= "[dm_writer]" |~ "失敗|ERROR|error" [5m])) > 5
        for: 1m
        labels:
          severity: warning
          tier: ticket
        annotations:
          summary: "Discord DM 受信箱への書き込みエラーが発生しています"
          description: "dm_writer が5分間に5件以上のエラーを出力しました。DB 接続またはスキーマを確認してください。"
          runbook_url: "https://github.com/shingo-ops/salesanchor/blob/main/docs/runbooks/alerts.md#discorddmwritererror"
