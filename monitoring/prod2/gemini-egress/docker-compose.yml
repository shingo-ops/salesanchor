services:
  tinyproxy:
    build: ./tinyproxy
    network_mode: host
    restart: unless-stopped
    volumes:
      - ./tinyproxy/tinyproxy.conf:/etc/tinyproxy/tinyproxy.conf:ro
      - ./tinyproxy/filter:/etc/tinyproxy/filter:ro
    command: tinyproxy -d -c /etc/tinyproxy/tinyproxy.conf

  tunnel:
    build: ./tunnel
    network_mode: host
    restart: unless-stopped
    environment:
      - AUTOSSH_GATETIME=0
    volumes:
      - /opt/salesanchor-monitoring/secrets/tunnel-key:/run/secrets/tunnel-key:ro
    command: >
      autossh -M 0 -N
      -o StrictHostKeyChecking=no
      -o UserKnownHostsFile=/dev/null
      -o ServerAliveInterval=30
      -o ServerAliveCountMax=3
      -o ExitOnForwardFailure=yes
      -i /run/secrets/tunnel-key
      -R 172.17.0.1:18888:127.0.0.1:8888
      ubuntu@49.212.137.46
