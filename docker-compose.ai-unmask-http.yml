# ADR-1052 段2: 相談係専用の「値を1回だけ返す」HTTP 口 ai-unmask-http（ai_unmask で ops_case.unmask_fetch を呼ぶ）。
# 本体の docker-compose.yml・docker-compose.ai-reader-cloud-http.yml は変えない（別ファイル・別プロジェクト）。
# 起動（deploy.yml が行う）: docker compose -p astro-webapp-unmask -f docker-compose.ai-unmask-http.yml up -d --build=false --force-recreate
# 止める: docker stop ai-unmask-http（止め続けるには GitHub secret CASE_AGENT_TOKEN も消す。空なら全員 401）
# 接続情報の正本は VPS の /home/ubuntu/.config/salesanchor/ai-unmask.env の1か所（値はここに写さない。接続の変数名は AI_UNMASK_DATABASE_URL）。
# 口の鍵は deploy が .env に書く CASE_AGENT_TOKEN（ai-reader-cloud-http と同じ値）。空なら全員 401。
# 受けるヘッダは Authorization: Bearer <鍵> と X-Case-Ticket（件の札）。記録の印 via は https-case-unmask。
# AUDIT は /dev/log → auth.log → Loki。結果は残さない（logging none）。ports は公開しない（nginx からだけ）。
# name は astro-webapp-unmask：deploy の --remove-orphans に消されないよう本体と別プロジェクトにする。
# .env の COMPOSE_PROJECT_NAME が top-level の name: より優先されるため、起動は必ず -p astro-webapp-unmask を付ける。
name: astro-webapp-unmask

services:
  ai-unmask-http:
    # backend と同じイメージ（astro-webapp-backend）。deploy の docker compose build で作られる。
    image: astro-webapp-backend
    container_name: ai-unmask-http
    command:
      - uvicorn
      - app.ops.unmask_http:app
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --workers
      - "1"
      - --no-access-log
    env_file:
      - /home/ubuntu/.config/salesanchor/ai-unmask.env
    environment:
      CASE_AGENT_TOKEN: ${CASE_AGENT_TOKEN:-}
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    restart: unless-stopped
    logging:
      driver: "none"
    volumes:
      - type: bind
        source: /dev/log
        target: /dev/log
        bind:
          create_host_path: false
    networks:
      - frontnet
      - backnet

networks:
  frontnet:
    external: true
    name: astro-webapp_frontnet
  backnet:
    external: true
    name: astro-webapp_backnet
