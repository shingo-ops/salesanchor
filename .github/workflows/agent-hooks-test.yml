name: Agent Hooks Test

# scripts/agent-hooks/ の受入試験（review-gate: ADR-1029・商品登録の見張り: doc-agenda-nav design §32 D2・mac-test-guard・install-guard・install-form-guard: ADR-1072・同意の見張り: ADR-1033 conversation-consent design §16-3(c)）。
# 偽の gh・一時ディレクトリだけを使う。本物の ~/.claude には触れない。
# ※ 必須チェック（Branch Protection）には登録しない。

on:
  pull_request:
    paths:
      - 'scripts/agent-hooks/**'
      - '.github/workflows/agent-hooks-test.yml'
      - '.claude/agents/reviewer.md'
      - 'docs/specs/product-master/registration-rules.md'
      - 'scripts/dev/consent-audit.py'
      - 'scripts/dev/consent-unit-tests.py'
      - 'docs/handoff/conversation-consent/hooks/**'
      - 'docs/handoff/browser-operation-delegation/**'
      - 'scripts/dev/chrome-guard-tests.py'
      - '.claude/hooks/requirement-*'
      - '.claude/hooks/test_requirement_*'
      - 'scripts/ci/feature_index_lib.py'
      - 'docs/adr/FEATURE-INDEX.md'

jobs:
  review-gate:
    name: review-gate hook test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Run review-gate tests
        run: bash scripts/agent-hooks/review-gate/test_review_gate.sh

  master-register-guard:
    name: master-register guard test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Run master-register guard tests
        run: bash scripts/agent-hooks/test_master_register_rules_guard.sh

  mac-test-guard:
    name: mac-test-guard test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Run mac-test-guard tests
        run: python3 scripts/agent-hooks/mac-test-guard/test_guard.py

  install-guard:
    name: install-guard test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Run install-guard tests
        run: python3 scripts/agent-hooks/test_install_guard.py

  install-form-guard:
    name: install-form-guard test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Run install-form-guard tests
        run: python3 scripts/agent-hooks/install-form-guard/test_guard.py

  go-identity-guard:
    name: go-identity-guard test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Run go-identity-guard tests
        run: python3 scripts/agent-hooks/go-identity-guard/test_guard.py

  go-comment-guard:
    name: go-comment-guard test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Run go-comment-guard tests
        run: python3 scripts/agent-hooks/cloud/test_go_comment_guard.py

  consent-unit-tests:
    name: consent hook unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Run consent hook unit tests and judge by output lines
        run: |
          # 試験の台本は FAIL でも終了コード 0 を返す（design §16-2(h)）。出力の行で判定する。
          judge_consent_out() {
            if grep -q '^FAIL' "$1"; then return 1; fi
            if ! grep -q '^PASS' "$1"; then return 1; fi
            if ! grep -qx 'DONE' "$1"; then return 1; fi
            return 0
          }
          # 手順1: 判定の関数そのものを作り物の出力4通りで確かめる（条件を1つだけ破る形）
          judge_selftest() {
            exp="$1"; shift
            printf '%s\n' "$@" > "$RUNNER_TEMP/judge-selftest.txt"
            if judge_consent_out "$RUNNER_TEMP/judge-selftest.txt"; then rc=0; else rc=$?; fi
            echo "SELFTEST expect=$exp got=$rc input=[$*]"
            if [ "$rc" != "$exp" ]; then
              echo "judge_consent_out self-test failed"
              exit 1
            fi
          }
          judge_selftest 1 'PASS a' 'FAIL b' 'DONE'
          judge_selftest 1 'DONE'
          judge_selftest 1 'PASS a'
          judge_selftest 0 'PASS a' 'DONE'
          # 手順2: 本物の試験を流す
          if python3 -I -B scripts/dev/consent-unit-tests.py docs/handoff/conversation-consent/hooks "$RUNNER_TEMP/consent" "$GITHUB_WORKSPACE" > "$RUNNER_TEMP/consent.out"; then prc=0; else prc=$?; fi
          # 手順3: 出力をそのまま表示する
          cat "$RUNNER_TEMP/consent.out"
          if [ "$prc" != "0" ]; then
            echo "consent-unit-tests.py exited with $prc"
            exit 1
          fi
          # 手順4: 本物の出力を判定する
          if judge_consent_out "$RUNNER_TEMP/consent.out"; then
            echo "consent unit tests: all PASS"
          else
            echo "consent unit tests: FAIL line found, or PASS/DONE missing"
            exit 1
          fi

  chrome-guard-tests:
    name: chrome-op-guard unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Run chrome-op-guard tests and judge by output lines
        run: |
          # 出力の行で判定する（FAIL 行が無く、DONE 行がある）
          if python3 -I -B scripts/dev/chrome-guard-tests.py docs/handoff/browser-operation-delegation/hooks docs/handoff/conversation-consent/hooks "$RUNNER_TEMP/chrome" > "$RUNNER_TEMP/chrome.out"; then prc=0; else prc=$?; fi
          cat "$RUNNER_TEMP/chrome.out"
          if [ "$prc" != "0" ]; then
            echo "chrome-guard-tests.py exited with $prc"
            exit 1
          fi
          if grep -q '^FAIL' "$RUNNER_TEMP/chrome.out"; then
            echo "chrome-guard tests: FAIL line found"
            exit 1
          fi
          if ! grep -q '^DONE' "$RUNNER_TEMP/chrome.out"; then
            echo "chrome-guard tests: DONE line missing"
            exit 1
          fi
          echo "chrome-guard tests: all PASS"

  requirement-hooks:
    name: requirement hooks test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run requirement-bug-claim tests
        run: python3 -I .claude/hooks/test_requirement_bug_claim.py
      - name: Run requirement-context tests
        run: python3 -I .claude/hooks/test_requirement_context.py
