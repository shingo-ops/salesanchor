name: weekly deploy lock count

# 本番反映（deploy.yml）がロック待ちの上限などで止まった回を、毎週機械が数えて知らせる。
# 設計: docs/handoff/deploy-db-stall/design.md §19-4。数えるだけで、本番のサーバーと DB には触らない。

on:
  schedule:
    - cron: '0 1 * * 1'  # 毎週月曜 01:00 UTC = 10:00 JST
    - cron: '17 3 * * 2'  # 火曜 12:17 JST。月曜の回が来なかったときの拾い直し
  workflow_dispatch:
    inputs:
      since:
        description: '数え始めの日 YYYY-MM-DD（日本時間 00:00 以上）。空なら直近7日'
        required: false
        default: ''
      until:
        description: '数え終わりの日 YYYY-MM-DD（日本時間 00:00 未満）。空なら直近7日'
        required: false
        default: ''

permissions:
  actions: read
  contents: read

concurrency:
  group: weekly-deploy-lock-count
  cancel-in-progress: false

jobs:
  count:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Count deploy lock-wait failures
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          DISCORD_WEBHOOK_OWNER_PING: ${{ secrets.DISCORD_WEBHOOK_SCHEDULED_REPORT }}
          INPUT_SINCE: ${{ github.event.inputs.since }}
          INPUT_UNTIL: ${{ github.event.inputs.until }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          LATE=0
          if [ "${EVENT_NAME}" = "schedule" ]; then
            # 定時の実行は遅れも抜けもある。週は plan の台本が決め、数え済みの週は数えない
            bash scripts/ops/weekly-deploy-lock-plan.sh > "${RUNNER_TEMP}/plan.txt"
            cat "${RUNNER_TEMP}/plan.txt"
            PLAN_SINCE="$(sed -n 's/^since=//p' "${RUNNER_TEMP}/plan.txt")"
            PLAN_UNTIL="$(sed -n 's/^until=//p' "${RUNNER_TEMP}/plan.txt")"
            PLAN_DECISION="$(sed -n 's/^decision=//p' "${RUNNER_TEMP}/plan.txt")"
            LATE="$(sed -n 's/^late=//p' "${RUNNER_TEMP}/plan.txt")"
            if [ "${PLAN_DECISION}" = "skip" ]; then
              echo "この週（${PLAN_SINCE}〜${PLAN_UNTIL}）は数え済みのため数えません"
              exit 0
            fi
            RANGE_ARGS=(--since "${PLAN_SINCE}" --until "${PLAN_UNTIL}")
          elif [ -n "${INPUT_SINCE}" ] && [ -n "${INPUT_UNTIL}" ]; then
            RANGE_ARGS=(--since "${INPUT_SINCE}" --until "${INPUT_UNTIL}")
          elif [ -z "${INPUT_SINCE}" ] && [ -z "${INPUT_UNTIL}" ]; then
            RANGE_ARGS=(--days 7)
          else
            echo "since と until は両方入れるか、両方空にしてください" >&2
            exit 1
          fi

          # 実行機は毎回新しいので、この場所には何も無い。台本は知らせが要るときだけ書く
          NOTIFY_FILE="${RUNNER_TEMP}/deploy-lock-notify.txt"

          set +e
          bash scripts/ops/count-deploy-lock-failures.sh "${RANGE_ARGS[@]}" --notify-file "${NOTIFY_FILE}"
          COUNT_RC=$?
          set -e

          if [ "${LATE}" = "1" ]; then
            LATE_LINE="月曜のうちに定時の実行が来なかったため、$(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M') JST に数えました（${PLAN_SINCE}〜${PLAN_UNTIL}）"
            if [ -f "${NOTIFY_FILE}" ]; then
              MSG="${LATE_LINE}"$'\n'"$(cat "${NOTIFY_FILE}")"
            else
              MSG="${LATE_LINE}"$'\n'"本番反映の止まり 0 件"
            fi
            if ! bash scripts/notify/discord-owner-ping.sh "${MSG}"; then
              echo "Discord への送信に失敗しました" >&2
              exit 1
            fi
          elif [ -f "${NOTIFY_FILE}" ]; then
            if ! bash scripts/notify/discord-owner-ping.sh "$(cat "${NOTIFY_FILE}")"; then
              echo "Discord への送信に失敗しました" >&2
              exit 1
            fi
          fi

          if [ "${COUNT_RC}" -ne 0 ]; then
            echo "数えの終わりが ${COUNT_RC}（0 でない）ため job を失敗にします" >&2
            exit 1
          fi
