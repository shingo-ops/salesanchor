name: Migration Guard

on:
  pull_request:
    branches: [main, develop]

jobs:
  check:
    name: models.py に新 Column → deploy.yml にマイグレーション追記必須
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # ──────────────────────────────────────────────────────────────────────
      # チェック1（既存）: models.py に新 Column → deploy.yml に migrate_ 追記
      # ──────────────────────────────────────────────────────────────────────
      - name: 新規 Column 追加を検出
        id: detect_columns
        run: |
          BASE=${{ github.event.pull_request.base.sha }}
          HEAD=${{ github.event.pull_request.head.sha }}

          NEW_COLUMNS=$(git diff "$BASE" "$HEAD" -- backend/app/models.py \
            | grep '^+' | grep -v '^+++' | grep 'Column(' || true)

          if [ -z "$NEW_COLUMNS" ]; then
            echo "new_columns=false" >> "$GITHUB_OUTPUT"
            echo "✅ models.py に新規 Column 追加なし — チェック1 スキップ"
          else
            echo "new_columns=true" >> "$GITHUB_OUTPUT"
            echo "🔍 新規 Column を検出:"
            echo "$NEW_COLUMNS"
          fi

      - name: deploy.yml に migrate_ スクリプト追記を確認
        if: steps.detect_columns.outputs.new_columns == 'true'
        run: |
          BASE=${{ github.event.pull_request.base.sha }}
          HEAD=${{ github.event.pull_request.head.sha }}

          DEPLOY_UPDATED=$(git diff "$BASE" "$HEAD" -- .github/workflows/deploy.yml \
            | grep '^+' | grep -v '^+++' | grep 'migrate_' || true)

          if [ -n "$DEPLOY_UPDATED" ]; then
            echo "✅ deploy.yml にマイグレーション追記を確認:"
            echo "$DEPLOY_UPDATED"
            exit 0
          fi

          echo ""
          echo "❌ MIGRATION GUARD FAILED (チェック1)"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "backend/app/models.py に新規 Column が追加されましたが、"
          echo ".github/workflows/deploy.yml への マイグレーションステップ追記が見つかりません。"
          echo ""
          echo "【対応手順】"
          echo "1. migrations/ に SQL ファイルを作成（ADD COLUMN IF NOT EXISTS で冪等に）"
          echo "2. scripts/ に Python 実行スクリプトを作成（必要な場合）"
          echo "3. deploy.yml の「新しいマイグレーションはここに追加」の直前に実行ステップを追記"
          echo ""
          echo "参考: backend/CLAUDE.md「## Migration 適用経路」セクション"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          exit 1

      # ──────────────────────────────────────────────────────────────────────
      # チェック2（新規）: migrations/NNN.sql 追加 → deploy.yml に psql 実行行必須
      #
      # 背景: ADR-045（migration 055）と PR #1277（migration 083）で
      #       2回連続して同一バグ（migrations/*.sql を追加したが deploy.yml 未登録）が
      #       発生した。チェック1は models.py 経由のみ検知するため、
      #       SQL ファイル単独追加の経路を検知できなかった。
      # ──────────────────────────────────────────────────────────────────────
      - name: 新規 migrations/*.sql を検出
        id: detect_sql
        run: |
          BASE=${{ github.event.pull_request.base.sha }}
          HEAD=${{ github.event.pull_request.head.sha }}

          NEW_SQL=$(git diff "$BASE" "$HEAD" --name-only --diff-filter=A \
            | grep '^migrations/[0-9].*\.sql$' || true)

          if [ -z "$NEW_SQL" ]; then
            echo "new_sql=false" >> "$GITHUB_OUTPUT"
            echo "✅ 新規 migrations/*.sql なし — チェック2 スキップ"
          else
            echo "new_sql=true" >> "$GITHUB_OUTPUT"
            NEW_SQL_JOINED=$(echo "$NEW_SQL" | tr '\n' '|' | sed 's/|$//')
            echo "new_sql_files=$NEW_SQL_JOINED" >> "$GITHUB_OUTPUT"
            echo "🔍 新規 SQL ファイルを検出:"
            echo "$NEW_SQL"
          fi

      - name: migration ファイル名フォーマット検証（タイムスタンプ形式強制）
        if: steps.detect_sql.outputs.new_sql == 'true'
        run: |
          FAILED=0
          IFS='|' read -ra SQL_FILES <<< "${{ steps.detect_sql.outputs.new_sql_files }}"
          for sql_path in "${SQL_FILES[@]}"; do
            fname=$(basename "$sql_path")
            # 001〜099 の連番形式（廃止済み）は旧ファイルなので除外
            if echo "$fname" | grep -qE '^[0-9]{3}_'; then
              echo "⚠️  旧連番形式のファイルが追加されています: $fname"
              echo "   100番以降はタイムスタンプ形式 YYYYMMDD_HHMMSS_description.sql を使用してください"
              FAILED=1
            elif echo "$fname" | grep -qE '^[0-9]{8}_[0-9]{6}_.*\.sql$'; then
              echo "✅ $fname — タイムスタンプ形式 OK"
            else
              echo "❌ $fname — ファイル名が不正です"
              echo "   正しい形式: YYYYMMDD_HHMMSS_description.sql（例: 20260601_082000_add_foo.sql）"
              FAILED=1
            fi
          done
          if [ "$FAILED" -ne 0 ]; then
            exit 1
          fi

      - name: deploy.yml または run_all_migrations.sh に登録を確認
        if: steps.detect_sql.outputs.new_sql == 'true'
        run: |
          FAILED=0
          MISSING_FILES=""

          IFS='|' read -ra SQL_FILES <<< "${{ steps.detect_sql.outputs.new_sql_files }}"
          for sql_path in "${SQL_FILES[@]}"; do
            fname=$(basename "$sql_path")

            # deploy.yml（旧スタイル: < migrations/$fname）または
            # scripts/run_all_migrations.sh（新スタイル: run_sql migrations/$fname）のどちらかに登録済みか確認
            if grep -q "< migrations/$fname" .github/workflows/deploy.yml || \
               grep -q "migrations/$fname" scripts/run_all_migrations.sh; then
              echo "✅ $fname → 登録済み"
            else
              echo "❌ $fname → deploy.yml / run_all_migrations.sh のいずれにも未登録"
              FAILED=1
              MISSING_FILES="$MISSING_FILES $fname"
            fi
          done

          if [ "$FAILED" -eq 0 ]; then
            echo ""
            echo "✅ チェック2 通過: 全 migrations/*.sql が登録されています"
            exit 0
          fi

          echo ""
          echo "❌ MIGRATION GUARD FAILED (チェック2)"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "以下の migrations/*.sql が登録されていません:"
          echo "$MISSING_FILES"
          echo ""
          echo "【対応手順】scripts/run_all_migrations.sh の末尾に以下を追記してください:"
          echo ""
          for fname in $MISSING_FILES; do
            echo "  # <変更内容を記述>"
            echo "  run_sql migrations/$fname"
            echo ""
          done
          echo "参考: backend/CLAUDE.md「## Migration 適用経路」セクション"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          exit 1

      # ──────────────────────────────────────────────────────────────────────
      # チェック3（新規）: migrations/NNN.sql に {schema} テンプレートリテラル禁止
      #
      # 背景: PR #1345 で {schema} プレースホルダをそのまま psql に渡し、
      #       本番デプロイが約1.5時間停止した（2026-06-01）。
      #       全テナント対応の正しい形式は DO $$ pg_namespace 走査ループ。
      # ──────────────────────────────────────────────────────────────────────
      - name: migration に {schema} テンプレートリテラルが含まれていないか確認
        if: steps.detect_sql.outputs.new_sql == 'true'
        run: |
          FAILED=0
          IFS='|' read -ra SQL_FILES <<< "${{ steps.detect_sql.outputs.new_sql_files }}"
          for sql_path in "${SQL_FILES[@]}"; do
            if grep -q '{schema}' "$sql_path"; then
              echo "❌ $sql_path に {schema} テンプレートリテラルが含まれています"
              FAILED=1
            else
              echo "✅ $(basename $sql_path) — {schema} なし"
            fi
          done

          if [ "$FAILED" -ne 0 ]; then
            echo ""
            echo "❌ MIGRATION GUARD FAILED (チェック3)"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "{schema} プレースホルダは psql に渡すと構文エラーになります。"
            echo "全テナントへの適用は DO \$\$ pg_namespace 走査形式で書いてください:"
            echo ""
            echo "  DO \$\$"
            echo "  DECLARE schema_record RECORD;"
            echo "  BEGIN"
            echo "    FOR schema_record IN"
            echo "      SELECT nspname AS schema_name FROM pg_namespace"
            echo "      WHERE nspname LIKE 'tenant_%' ORDER BY nspname"
            echo "    LOOP"
            echo "      EXECUTE format("
            echo "        'ALTER TABLE %I.your_table ADD COLUMN IF NOT EXISTS ...',"
            echo "        schema_record.schema_name"
            echo "      );"
            echo "    END LOOP;"
            echo "  END \$\$;"
            echo ""
            echo "参考: migrations/090_add_lead_contact_links.sql"
            echo "前例: PR #1345（migration 100）で本番デプロイ1.5h停止"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            exit 1
          fi

      # ──────────────────────────────────────────────────────────────────────
      # チェック4（新規）: REFERENCES public.X — FK参照先が public スキーマに実在するか
      #
      # 背景: 2026-06-03 PR #1532 で REFERENCES public.staff(id) を書いてしまい
      #       本番デプロイがブロックされた。staff は tenant_NNN スキーマにのみ存在し
      #       public.staff は存在しない。静的解析で PR 段階でブロックする。
      # ──────────────────────────────────────────────────────────────────────
      - name: REFERENCES public.X — FK 参照先が public スキーマに実在するか確認
        if: steps.detect_sql.outputs.new_sql == 'true'
        run: |
          # public スキーマに実際に存在するテーブルの許可リスト
          # 新しいテーブルを public に追加した場合はここを更新すること（SSoT）
          PUBLIC_TABLES="tenants users permissions products suppliers supplier_aliases inventory inventory_movements tcg_series_master tcg_type_master pokemon_dex trainer_dex supplier_prompts meta_page_routing tenant_settings tenant_llm_budgets discord_inbound_messages data_access_events data_deletion_logs auth_events tenant_discord_config tenant_discord_ticket_config knowledge_rules supplier_discord_routing discord_webhook_idempotency user_inventory_filters ingestion_jobs parse_logs link_templates registration_tokens"

          FAILED=0
          IFS='|' read -ra SQL_FILES <<< "${{ steps.detect_sql.outputs.new_sql_files }}"
          for sql_path in "${SQL_FILES[@]}"; do
            # REFERENCES public.テーブル名 のパターンを抽出（コメント行を除く）
            REFS=$(grep -v '^\s*--' "$sql_path" \
              | grep -oE 'REFERENCES[[:space:]]+public\.[a-zA-Z_]+' \
              | grep -oE 'public\.[a-zA-Z_]+' \
              | sed 's/public\.//' \
              | tr '[:upper:]' '[:lower:]' \
              | sort -u || true)

            if [ -z "$REFS" ]; then
              echo "✅ $(basename $sql_path) — public FK 参照なし"
              continue
            fi

            for ref in $REFS; do
              if echo " $PUBLIC_TABLES " | grep -q " $ref "; then
                echo "✅ $(basename $sql_path) → REFERENCES public.$ref — 許可リストに存在"
              else
                echo "❌ $(basename $sql_path) → REFERENCES public.$ref — public スキーマに存在しません"
                FAILED=1
              fi
            done
          done

          if [ "$FAILED" -ne 0 ]; then
            echo ""
            echo "❌ MIGRATION GUARD FAILED (チェック4)"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "REFERENCES public.X の X が public スキーマに存在しないテーブルです。"
            echo ""
            echo "よくある間違い:"
            echo "  ❌ REFERENCES public.staff(id)   → staff は tenant_NNN.staff にあります"
            echo "  ❌ REFERENCES public.leads(id)   → leads は tenant_NNN.leads にあります"
            echo "  ❌ REFERENCES public.deals(id)   → deals は tenant_NNN.deals にあります"
            echo "  ❌ REFERENCES public.orders(id)  → orders は tenant_NNN.orders にあります"
            echo "  ❌ REFERENCES public.companies(id) → companies は tenant_NNN.companies にあります"
            echo ""
            echo "対処方法:"
            echo "  テナント個別テーブルへの参照は FK 制約を設けず plain INTEGER で記録してください"
            echo "  例: connected_by_staff_id INTEGER  -- tenant_NNN.staff(id) 参照（FK不使用）"
            echo ""
            echo "public スキーマの許可テーブル一覧:"
            echo "  $PUBLIC_TABLES"
            echo ""
            echo "新テーブルを public に追加した場合は migration-guard.yml の PUBLIC_TABLES を更新してください"
            echo "前例: PR #1532（connected_by_staff_id で本番デプロイ停止）"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            exit 1
          fi

      # ──────────────────────────────────────────────────────────────────────
      # チェック5（新規）: タイムスタンプ重複チェック（新規 vs main既存／PR内同士）
      #
      # 背景: 並行エージェント・並行作業で同一 YYYYMMDD_HHMMSS を付けた migration が
      #       複数 PR から同時に develop/main に流れ込むと、run_all_migrations.sh の
      #       手書き登録でしか順序が担保されないため管理コストが増大する。
      #       PR段階で差分ベースに捕捉し、HHMMSS を変えて一意化させる。
      # 設計: docs/handoff/migration-timestamp-dup-guard/design.md
      # ──────────────────────────────────────────────────────────────────────
      - name: タイムスタンプ重複チェック（新規 vs main既存／PR内同士）
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"

          # PRで新規追加された migrations/*.sql（:81-82 と同じ抽出条件）
          NEW_SQL=$(git diff "$BASE" "$HEAD" --name-only --diff-filter=A \
            | grep -E '^migrations/[0-9]{8}_[0-9]{6}_.*\.sql$' || true)

          if [ -z "$NEW_SQL" ]; then
            echo "✅ 新規追加の timestamp 形式 migration なし。重複チェックskip。"
            exit 0
          fi

          # base(main)時点に存在した全 migration の刻印集合（重複は一意化）
          EXISTING_STAMPS=$(git ls-tree -r --name-only "$BASE" migrations/ \
            | grep -oE '[0-9]{8}_[0-9]{6}' | sort -u || true)

          DUP_FOUND=0

          # (A) 新規 vs main既存
          for f in $NEW_SQL; do
            stamp=$(basename "$f" | grep -oE '^[0-9]{8}_[0-9]{6}' || true)
            [ -z "$stamp" ] && continue
            if echo "$EXISTING_STAMPS" | grep -qx "$stamp"; then
              echo "❌ $f の刻印 $stamp は既存 migration と重複しています"
              DUP_FOUND=1
            fi
          done

          # (B) PR内の新規同士で刻印重複
          INTERNAL_DUP=$(echo "$NEW_SQL" | xargs -r -n1 basename \
            | grep -oE '^[0-9]{8}_[0-9]{6}' | sort | uniq -d || true)
          if [ -n "$INTERNAL_DUP" ]; then
            echo "❌ PR内で刻印が重複しています: $INTERNAL_DUP"
            DUP_FOUND=1
          fi

          if [ "$DUP_FOUND" -eq 1 ]; then
            echo ""
            echo "タイムスタンプ(YYYYMMDD_HHMMSS)が重複しています。"
            echo "HHMMSS を変えて一意な刻印にしてから再 push してください。"
            exit 1
          fi
          echo "✅ タイムスタンプ重複なし"

      # ──────────────────────────────────────────────────────────────────────
      # チェック6（新規）: DROP COLUMN / DROP TABLE — ADR 承認必須
      #
      # 背景: backend/CLAUDE.md「Migration は additive-only（追加専用）」ルールにより
      #       カラム削除・テーブル削除は原則禁止、ADR 承認が必須。
      #       しかし機械的に止める仕組みがなく、ルールを知らない AI が
      #       DROP を含む migration を出しても CI は素通りしていた。
      #       ADR-1002 Phase C 振り返りで対策として特定。
      # ──────────────────────────────────────────────────────────────────────
      - name: DROP COLUMN / DROP TABLE — ADR 承認必須チェック
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"

          # PR差分から追加行のみ抽出（削除行・SQLコメント行・Pythonコメント行を除外）
          # 対象: migrations/*.sql と scripts/migrate_*.py
          DESTRUCTIVE=$(git diff "$BASE" "$HEAD" -- 'migrations/*.sql' 'scripts/migrate_*.py' \
            | grep '^+' | grep -v '^+++' \
            | grep -v '^\+[[:space:]]*--' \
            | grep -v '^\+[[:space:]]*#' \
            | grep -iE 'DROP[[:space:]]+(COLUMN|TABLE)' || true)

          if [ -z "$DESTRUCTIVE" ]; then
            echo "✅ DROP COLUMN / DROP TABLE なし — チェック6 スキップ"
            exit 0
          fi

          echo "🔍 破壊的変更を検出:"
          echo "$DESTRUCTIVE"
          echo ""

          # PR本文からADR参照を確認
          PR_BODY=$(gh pr view "${{ github.event.pull_request.number }}" --json body --jq '.body')
          ADR_REF=$(echo "$PR_BODY" | grep -oiE 'ADR-[0-9]+' | head -1 || true)

          if [ -n "$ADR_REF" ]; then
            echo "✅ PR本文に ADR 参照を確認: $ADR_REF"
            echo "   ⚠️  ADR の承認状態は人間が確認してください"
            exit 0
          fi

          echo "❌ MIGRATION GUARD FAILED (チェック6)"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "DROP COLUMN / DROP TABLE は破壊的変更です。"
          echo "backend/CLAUDE.md の「Migration は additive-only」ルールにより"
          echo "ADR 承認が必須です。"
          echo ""
          echo "【対応手順】"
          echo "1. docs/adr/ に ADR を起案して PO 承認を得る"
          echo "2. PR 本文に ADR-NNN を明記する"
          echo ""
          echo "参考: backend/CLAUDE.md「## Migration は additive-only（追加専用）」"
          echo "前例: ADR-089（DROP customers）、ADR-1002（DROP tcg_uuid）"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          exit 1

      # ──────────────────────────────────────────────────────────────────────
      # チェック7: 共用マスタテーブルへのデータ操作禁止（ADR-155）
      #
      # 背景: マスタデータの更新手段は CSV 取り込みとアプリ画面に一本化する。
      #       マイグレーションで INSERT/UPDATE/DELETE すると、CSV/アプリ経由の
      #       データと重複・競合が発生する（ムニキスゼロ 3件重複の教訓）。
      #       構造変更（ALTER TABLE, CREATE INDEX 等）は許可する。
      # 保護対象（14テーブル）:
      #   商品系: products, tcg_products, product_search_keywords,
      #           product_exclude_keywords, product_attribute_masters
      #   マスタ系: permissions, tcg_type_master, meta_page_routing,
      #            countries, link_templates, inventory_aggregation_rules,
      #            suppliers, tenant_settings, tenant_llm_budgets
      # ──────────────────────────────────────────────────────────────────────
      - name: 共用マスタテーブルへのデータ操作禁止チェック（ADR-155）
        if: steps.detect_sql.outputs.new_sql == 'true'
        run: |
          set -euo pipefail

          FAILED=0
          VIOLATIONS=""

          # 保護対象テーブル（スキーマ修飾の有無・テナントスキーマ名を問わず検出）
          PROTECTED_TABLES="products|tcg_products|product_search_keywords|product_exclude_keywords|product_attribute_masters|permissions|tcg_type_master|meta_page_routing|countries|link_templates|inventory_aggregation_rules|suppliers|tenant_settings|tenant_llm_budgets"

          IFS='|' read -ra SQL_FILES <<< "${{ steps.detect_sql.outputs.new_sql_files }}"
          for sql_path in "${SQL_FILES[@]}"; do
            # 追加行のみ抽出（SQL コメント行を除外）
            ADDED_LINES=$(git diff "${{ github.event.pull_request.base.sha }}" \
              "${{ github.event.pull_request.head.sha }}" -- "$sql_path" \
              | grep '^+' | grep -v '^+++' \
              | grep -v '^\+[[:space:]]*--' || true)

            if [ -z "$ADDED_LINES" ]; then
              continue
            fi

            # INSERT INTO ... 保護テーブル
            INSERT_HIT=$(echo "$ADDED_LINES" \
              | grep -iE "INSERT[[:space:]]+INTO[[:space:]]+(public\.|tenant_[0-9]+\.)?($PROTECTED_TABLES)" || true)

            # UPDATE ... 保護テーブル（SET が後続する行）
            UPDATE_HIT=$(echo "$ADDED_LINES" \
              | grep -iE "UPDATE[[:space:]]+(public\.|tenant_[0-9]+\.)?($PROTECTED_TABLES)" || true)

            # DELETE FROM ... 保護テーブル
            DELETE_HIT=$(echo "$ADDED_LINES" \
              | grep -iE "DELETE[[:space:]]+FROM[[:space:]]+(public\.|tenant_[0-9]+\.)?($PROTECTED_TABLES)" || true)

            HITS="${INSERT_HIT}${UPDATE_HIT}${DELETE_HIT}"
            if [ -n "$HITS" ]; then
              FAILED=1
              VIOLATIONS="${VIOLATIONS}\n--- $(basename $sql_path) ---\n${HITS}"
            fi
          done

          if [ "$FAILED" -eq 0 ]; then
            echo "✅ 共用マスタテーブルへのデータ操作なし — チェック7 通過"
            exit 0
          fi

          echo "❌ MIGRATION GUARD FAILED (チェック7)"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "共用マスタテーブルへの INSERT / UPDATE / DELETE が検出されました。"
          echo ""
          echo -e "検出箇所:$VIOLATIONS"
          echo ""
          echo "マスタデータの更新は CSV 取り込みまたはアプリ画面からのみ行えます。"
          echo "マイグレーションで値を操作することは禁止されています（ADR-155）。"
          echo ""
          echo "【許可される操作】"
          echo "  ALTER TABLE ... ADD COLUMN（列の追加）"
          echo "  ALTER TABLE ... ALTER COLUMN（型の変更）"
          echo "  CREATE INDEX（索引の追加）"
          echo ""
          echo "【禁止される操作】"
          echo "  INSERT INTO 保護対象テーブル"
          echo "  UPDATE 保護対象テーブル"
          echo "  DELETE FROM 保護対象テーブル"
          echo ""
          echo "保護対象テーブル（14個）:"
          echo "  商品系: products, tcg_products, product_search_keywords,"
          echo "          product_exclude_keywords, product_attribute_masters"
          echo "  マスタ系: permissions, tcg_type_master, meta_page_routing,"
          echo "           countries, link_templates, inventory_aggregation_rules,"
          echo "           suppliers, tenant_settings, tenant_llm_budgets"
          echo ""
          echo "参考: ADR-155-product-master-ssot-csv-app.md"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          exit 1

      # ──────────────────────────────────────────────────────────────────────
      # チェック8: 共用マスタテーブルへのデータ参照禁止（ADR-155）
      #
      # 背景: チェック7は INSERT/UPDATE/DELETE を検出するが、SELECT（データ存在前提
      #       の読み取り）を見逃す。20260913_210000_tcg_cardset_bundle_registration.sql
      #       が SELECT ... FROM public.products WHERE product_code = $1 で商品データの
      #       存在を前提とし、本番デプロイがブロックされた。
      #       マスタテーブルへの参照は構造変更（ALTER TABLE, CREATE INDEX 等）の
      #       みを許可し、データの読み書きを含む全参照をブロックする。
      # 詳細: docs/adr/ADR-155-product-master-ssot-csv-app.md
      # ──────────────────────────────────────────────────────────────────────
      - name: 共用マスタテーブルへのデータ参照禁止チェック（ADR-155）
        if: steps.detect_sql.outputs.new_sql == 'true'
        run: |
          set -euo pipefail

          FAILED=0

          # 保護対象テーブル（チェック7と同じリスト・14テーブル）
          PROTECTED_TABLES="products|tcg_products|product_search_keywords|product_exclude_keywords|product_attribute_masters|permissions|tcg_type_master|meta_page_routing|countries|link_templates|inventory_aggregation_rules|suppliers|tenant_settings|tenant_llm_budgets"

          IFS='|' read -ra SQL_FILES <<< "${{ steps.detect_sql.outputs.new_sql_files }}"
          for sql_path in "${SQL_FILES[@]}"; do
            fname=$(basename "$sql_path")

            # コメント行（-- で始まる行）を除外してファイル全体を処理
            # 保護対象テーブル名が出現する行を検出
            MATCHED_LINES=$(grep -v '^\s*--' "$sql_path" \
              | grep -nE "(${PROTECTED_TABLES})" || true)

            if [ -z "$MATCHED_LINES" ]; then
              echo "✅ $fname — マスタテーブルへの参照なし"
              continue
            fi

            # 許可パターンに該当する行を除外して違反行を絞り込む
            # 許可: ALTER TABLE, CREATE [UNIQUE] INDEX ... ON, DROP INDEX, COMMENT ON,
            #       ADD COLUMN, DROP COLUMN, ALTER COLUMN, information_schema 参照,
            #       pg_namespace / pg_class / to_regclass での存在チェック
            VIOLATIONS=""
            while IFS= read -r line; do
              line_num=$(echo "$line" | cut -d: -f1)
              line_content=$(echo "$line" | cut -d: -f2-)

              # 許可パターンチェック（いずれかに該当すれば許可）
              if echo "$line_content" | grep -qiE \
                'ALTER[[:space:]]+TABLE|CREATE[[:space:]]+(UNIQUE[[:space:]]+)?INDEX|DROP[[:space:]]+INDEX|COMMENT[[:space:]]+ON|ADD[[:space:]]+COLUMN|DROP[[:space:]]+COLUMN|ALTER[[:space:]]+COLUMN|information_schema|pg_namespace|pg_class|to_regclass'; then
                continue
              fi

              # 許可パターン非該当 = 違反
              VIOLATIONS="${VIOLATIONS}   行 ${line_num}: ${line_content}\n"
            done <<< "$MATCHED_LINES"

            if [ -n "$VIOLATIONS" ]; then
              FAILED=1
              echo "❌ Check 8 FAIL: migration がマスタテーブルデータに依存しています (ADR-155 違反)"
              echo "   ファイル: $fname"
              echo ""
              printf "%b" "$VIOLATIONS"
              echo ""
              echo "   マスタテーブルへの参照は構造変更 (ALTER TABLE, CREATE INDEX) のみ許可。"
              echo "   データの読み書き (SELECT/INSERT/UPDATE/DELETE) は禁止です。"
              echo "   詳細: docs/adr/ADR-155-product-master-ssot-csv-app.md"
              echo ""
            else
              echo "✅ $fname — マスタテーブルへの参照はすべて構造変更のみ（許可）"
            fi
          done

          if [ "$FAILED" -ne 0 ]; then
            echo "❌ MIGRATION GUARD FAILED (チェック8)"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "共用マスタテーブルへのデータ参照が検出されました（ADR-155 違反）。"
            echo ""
            echo "【許可される操作】"
            echo "  ALTER TABLE ... ADD COLUMN / DROP COLUMN / ALTER COLUMN"
            echo "  CREATE [UNIQUE] INDEX ... ON マスタテーブル"
            echo "  DROP INDEX"
            echo "  COMMENT ON TABLE / COLUMN"
            echo "  information_schema / pg_namespace / pg_class / to_regclass での存在チェック"
            echo ""
            echo "【禁止される操作】"
            echo "  SELECT ... FROM マスタテーブル（データ存在前提の参照）"
            echo "  INSERT INTO / UPDATE / DELETE FROM（チェック7でも検出）"
            echo "  上記テーブルを参照する EXECUTE format(...) 内の動的 SQL"
            echo ""
            echo "保護対象テーブル（14個）:"
            echo "  商品系: products, tcg_products, product_search_keywords,"
            echo "          product_exclude_keywords, product_attribute_masters"
            echo "  マスタ系: permissions, tcg_type_master, meta_page_routing,"
            echo "           countries, link_templates, inventory_aggregation_rules,"
            echo "           suppliers, tenant_settings, tenant_llm_budgets"
            echo ""
            echo "詳細: docs/adr/ADR-155-product-master-ssot-csv-app.md"
            echo "前例: 20260913_210000_tcg_cardset_bundle_registration.sql（本番デプロイブロック）"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            exit 1
          fi

      # ──────────────────────────────────────────────────────────────────────
      # チェック 9: supplier_channels.supplier_id 保護（SSOT ガード）
      #
      # 背景: supplier SSOT 移行により supplier_channels.supplier_id は
      #        INTEGER (→ public.suppliers FK) に統一済み。
      #        この列の削除・型変更はシステム全体のエラーを引き起こす。
      # ──────────────────────────────────────────────────────────────────────
      - name: supplier_channels.supplier_id 保護チェック（SSOT ガード）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"

          # PR差分から追加行のみ抽出（コメント行除外）
          DIFF_LINES=$(git diff "$BASE" "$HEAD" -- 'migrations/*.sql' \
            | grep '^+' | grep -v '^+++' \
            | grep -v '^\+[[:space:]]*--' \
            | grep -v '^\+[[:space:]]*#' || true)

          if [ -z "$DIFF_LINES" ]; then
            echo "✅ migration 変更なし — チェック9 スキップ"
            exit 0
          fi

          # supplier_channels を含むか確認
          HAS_TABLE=$(echo "$DIFF_LINES" | grep -i 'supplier_channels' || true)
          if [ -z "$HAS_TABLE" ]; then
            echo "✅ supplier_channels への変更なし — チェック9 スキップ"
            exit 0
          fi

          # 危険パターン検出
          DANGEROUS=$(echo "$DIFF_LINES" | grep -iE 'DROP[[:space:]]+COLUMN[[:space:]]+(IF[[:space:]]+EXISTS[[:space:]]+)?supplier_id|ALTER[[:space:]]+COLUMN[[:space:]]+supplier_id[[:space:]]+TYPE' || true)

          if [ -z "$DANGEROUS" ]; then
            echo "✅ supplier_channels.supplier_id への破壊的変更なし — チェック9 通過"
            exit 0
          fi

          echo "🔍 supplier_channels.supplier_id への破壊的変更を検出:"
          echo "$DANGEROUS"
          echo ""

          # PR本文からADR参照を確認
          PR_BODY=$(gh pr view "${{ github.event.pull_request.number }}" --json body --jq '.body')
          ADR_REF=$(echo "$PR_BODY" | grep -oiE 'ADR-[0-9]+' | head -1 || true)

          if [ -n "$ADR_REF" ]; then
            echo "✅ PR本文に ADR 参照を確認: $ADR_REF"
            echo "   ⚠️  ADR の承認状態は人間が確認してください"
            exit 0
          fi

          echo "❌ MIGRATION GUARD FAILED (チェック9)"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "supplier_channels.supplier_id は SSOT 移行により"
          echo "INTEGER 型 (→ public.suppliers FK) に統一済みです。"
          echo "この列の削除・型変更はシステム全体のエラーを引き起こします。"
          echo ""
          echo "【対応手順】"
          echo "1. docs/adr/ に ADR を起案して PO 承認を得る"
          echo "2. PR 本文に ADR-NNN を明記する"
          echo ""
          echo "背景: PR #3539 (supplier SSOT migration)"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          exit 1

          echo "✅ チェック8 通過: 共用マスタテーブルへのデータ参照なし"
