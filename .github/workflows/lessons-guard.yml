name: Lessons Guard
# 教訓の直接追記検知: 全PRで起動し、design-partner.md §6本文への追記PRのみ停止する（非接触PRは緑・lessons-cleanupラベルで清書便は例外・2026-07-22全PR起動化）
# 設計: docs/specs/lessons-guard/design.md §1（KGI-L5の実体）
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
permissions:
  pull-requests: write
jobs:
  warn-direct-lesson-edit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect §6 body additions
        id: detect
        run: |
          git fetch origin ${{ github.base_ref }} --quiet
          ADDED=$(git diff "origin/${{ github.base_ref }}...HEAD" -- docs/ai-agents/design-partner.md | awk '/^@@/{h=$0} /^\+[^+]/{print h"\t"$0}' | grep -c "## 6\." || true)
          SEC6_TOUCH=$(git diff "origin/${{ github.base_ref }}...HEAD" --unified=0 -- docs/ai-agents/design-partner.md | grep -c "^+- " || true)
          echo "sec6_added=${SEC6_TOUCH}" >> "$GITHUB_OUTPUT"
      - name: Enforce (block direct §6 edits unless cleanup-labeled)
        if: steps.detect.outputs.sec6_added != '0' && !contains(github.event.pull_request.labels.*.name, 'lessons-cleanup')
        uses: actions/github-script@v7
        with:
          script: |
            core.setFailed('❌ Lessons Guard: design-partner.md §6本文への直接追記は禁止です。教訓は docs/ai-agents/lessons.d/ へ1便1ファイルのポストで追加してください（docs/specs/lessons-guard/design.md）。§6本文への正当な移植（清書便）の場合のみ、このPRに lessons-cleanup ラベルを付けてください。');
      - name: Note cleanup-labeled pass
        if: steps.detect.outputs.sec6_added != '0' && contains(github.event.pull_request.labels.*.name, 'lessons-cleanup')
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '✅ Lessons Guard: lessons-cleanup ラベルを確認。清書便として§6本文追記を許可します。'
            })
