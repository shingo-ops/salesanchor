name: Migration Runner Coverage

on:
  pull_request:
    branches: [main, develop]

jobs:
  check:
    name: new migrations must be registered in run_all_migrations.sh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify migration runner coverage
        run: |
          bash scripts/check-migration-runner-coverage.sh \
            --mode diff \
            --base "${{ github.event.pull_request.base.sha }}" \
            --head "${{ github.event.pull_request.head.sha }}"
