name: Backup Script Test

# scripts/backup.sh の試験（pg_dump のロック待ちの上限・書き途中を残さない・本物の PostgreSQL 16 での確認）。
# 偽の docker と、使い捨ての PostgreSQL 16 のコンテナだけを使う。本番には触れない。
# docs/handoff/deploy-db-stall/design.md §15-4。
# ※ 必須チェック（Branch Protection）には登録しない。

on:
  pull_request:
    paths:
      - 'scripts/backup.sh'
      - 'scripts/tests/test-backup-*.sh'
      - 'scripts/lib/db-app-names.sh'
      - 'scripts/deploy-db-orphan-cleanup.sh'
      - 'scripts/migration_py_entry.py'
      - 'scripts/run_all_migrations.sh'
      - 'scripts/tests/test-deploy-orphan-cleanup.sh'
      - '.github/workflows/deploy.yml'
      - '.github/workflows/backup-script-test.yml'
  push:
    paths:
      - 'scripts/backup.sh'
      - 'scripts/tests/test-backup-*.sh'
      - 'scripts/lib/db-app-names.sh'
      - 'scripts/deploy-db-orphan-cleanup.sh'
      - 'scripts/migration_py_entry.py'
      - 'scripts/run_all_migrations.sh'
      - 'scripts/tests/test-deploy-orphan-cleanup.sh'
      - '.github/workflows/deploy.yml'
      - '.github/workflows/backup-script-test.yml'
  workflow_dispatch:

jobs:
  test:
    name: backup.sh test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      # B3 既存の2本（今まで CI で動いていなかった）
      - name: Run test-backup-retention.sh
        run: bash scripts/tests/test-backup-retention.sh

      - name: Run test-backup-timestamp.sh
        run: bash scripts/tests/test-backup-timestamp.sh

      # B2（偽の docker）・B1（実物の PostgreSQL 16 で pg_dump の上限）・B4（本物の backup.sh）
      - name: Run test-backup-lock-wait.sh (B1, B2, B4)
        env:
          REQUIRE_DOCKER: '1'
        run: bash scripts/tests/test-backup-lock-wait.sh

  orphan-cleanup:
    name: deploy orphan cleanup test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      # C9 が deploy.yml を読むのに使う
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pyyaml
        run: pip install pyyaml

      # C1〜C9（design §16-6）。入れ物の名前を本番と同じ astro-webapp-postgres-1 にする
      - name: Run test-deploy-orphan-cleanup.sh (C1-C9)
        env:
          REQUIRE_DOCKER: '1'
        run: bash scripts/tests/test-deploy-orphan-cleanup.sh
