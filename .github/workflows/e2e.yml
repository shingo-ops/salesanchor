name: Frontend E2E (Playwright)

# Phase 1-E F2-S3: 撮影台本 docs/META_APP_REVIEW_SCREENCAST_SCRIPT.md の 7 シーン +
# Data Deletion Status Page を Playwright で自動化する。CI 時間を抑えるため
# chromium のみで実行し、artifact として playwright-report と失敗時の
# trace / screenshot / video を upload する。
#
# 実機 Meta OAuth は通さず、frontend が叩く /api/v1/* を Playwright route で
# mock する設計（tests-e2e/utils/api-mock.ts）。Firebase Auth は
# tests-e2e/utils/auth.ts で IndexedDB persistence + identitytoolkit endpoint
# 経由で bypass する。

on:
  pull_request:
    branches:
      - main
      - develop
# NOTE: push トリガーを削除（2026-05-27）。PR 時点で E2E が通っていれば
# squash merge 後の push で再実行する意味はなく、デプロイ待ち時間を
# 10 分以上短縮できる。main/develop への直 push は Branch Protection で禁止済み。
#
# NOTE (2026-05-22): paths フィルタ削除。Required check 設定 (Lint & Dark Mode
# Check ADR-067) が paths にマッチしない PR で "Expected — Waiting for status
# to be reported" のまま pending → merge blocked デッドロックが PR #534 で発生。
# Issue #523 ② で migration-guard と同じく「paths 条件なし常時実行 + 不要時即
# pass」パターンに統一。
#
# NOTE (2026-06-01): detect-changes → lint-run → lint(aggregator) パターンに移行。
# test.yml・schema-check.yml・migration-test.yml と同じ設計に統一。
# frontend 未変更時は lint-run が skipped → aggregator が success を報告。
# デッドロック問題（PR #534）の根本解消: aggregator の if: always() により
# paths フィルタなしでも Required Check が常に報告される。

# 同一 PR への再プッシュ時に古い実行をキャンセルして無駄な消費を防ぐ。
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # フロントエンド関連ファイルの変更有無を判定
  detect-changes:
    name: フロントエンド変更検出
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'

  # ─── ADR-067: ダークモード色規約チェック ───────────────────────────────────
  lint-run:
    name: Lint & Dark Mode Check（内部）
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: 全チェック統合 — ADR-067 デザイントークン・レイアウト・アイコン・ページ規約
        run: npm run check:all

  # ADR-1020 便4d: 画面の試験（vitest）を必須チェックの集約に入れる（frontend-check.yml から移した）
  unit-run:
    name: Frontend unit tests（内部）
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate API types
        run: npm run generate:api-types

      - name: Unit tests with coverage gate
        run: |
          TEST_COUNT=$(find src -name "*.test.ts" -o -name "*.test.tsx" 2>/dev/null | wc -l | tr -d ' ')
          if [ "$TEST_COUNT" -gt "0" ]; then
            echo "▶ ${TEST_COUNT} test file(s) found. Running coverage gate..."
            npm run test:coverage
          else
            echo "⚠️  No unit test files found. Coverage gate skipped (Phase 0)."
          fi

  # ルールセット必須 Check の名前と一致させる。always() で常に実行し、
  # - frontend 変更あり: lint-run の結果を報告
  # - frontend 変更なし: lint-run が skipped → 成功として報告（デッドロック解消）
  lint:
    name: Lint & Dark Mode Check (ADR-067)
    needs: [detect-changes, lint-run, unit-run]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Report results
        run: |
          r="${{ needs.lint-run.result }}"
          u="${{ needs.unit-run.result }}"
          echo "lint-run: $r"
          echo "unit-run: $u"
          ok() { [[ "$1" == "success" || "$1" == "skipped" ]]; }
          if ok "$r" && ok "$u"; then
            echo "OK: lint and unit tests passed or no frontend changes"
            exit 0
          else
            echo "FAIL: lint-run=$r unit-run=$u"
            exit 1
          fi

  # ─── 画面検査（3幅のみ・恒久） ──────────────────────────────────────────────
  # PR #4165 でスマホの「一覧へ戻る」が効かない状態を本番に出し #4168 で撤回した。
  # arm64 端末では Playwright の chromium が動かず、開く→戻るをマージ前に確認できない。
  # 全 E2E の再開は 2026-06-01 に止めた CI ボトルネックが戻るため、
  # visual-language の 3 幅（vl-mobile-390 / vl-tablet-768 / vl-desktop-1280）だけを走らせる。
  # 対象 spec: frontend/tests-e2e/visual-language/*.spec.ts（現状 2 本・テスト 8 件）
  visual-language-run:
    name: 画面検査（内部）
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true'
    # ubuntu-26.04 では Playwright 1.59.1 が依存を入れられず「1件も走らない」赤になるため固定
    # （karte-gate.yml:38 と同じ理由・同じ直し方。2026-10-26 run 40274501029）
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Get Playwright version
        id: pw
        run: |
          PW_VERSION=$(node -p "require('@playwright/test/package.json').version")
          echo "version=$PW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install system deps (chromium)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run visual-language screen check (3 widths)
        env:
          CI: 'true'
          VITE_FIREBASE_API_KEY: AIzaSyE2E-dummy-api-key
          VITE_FIREBASE_AUTH_DOMAIN: e2e-fixture.firebaseapp.com
          VITE_GCP_PROJECT_ID: e2e-fixture
        run: npm run test:e2e:vl

      - name: Upload screen check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-language-report
          path: frontend/playwright-report
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload failures (trace / video / screenshot)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-language-test-results
          path: frontend/test-results
          retention-days: 14
          if-no-files-found: ignore

  # lint と同じ集約の型（detect-changes → *-run → aggregator）。
  # フロント未変更の PR では visual-language-run が skipped になるため、
  # そのまま必須チェックにすると「報告が来ない」デッドロック（Issue #523 / PR #534）
  # が再発する。if: always() の集約が skipped を成功として報告することで防ぐ。
  # 必須チェックに入れる場合はこのジョブ名を指定する（手順は
  # docs/handoff/app-visual-language/card-stage4b-inbox-mobile.md §13）。
  visual-language:
    name: 画面検査（受信箱 3幅 Playwright）
    needs: [detect-changes, visual-language-run]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Report results
        run: |
          r="${{ needs.visual-language-run.result }}"
          echo "visual-language-run: $r"
          if [[ "$r" == "success" || "$r" == "skipped" ]]; then
            echo "OK: 画面検査が通過、またはフロントエンド変更なし"
            exit 0
          else
            echo "FAIL: visual-language-run=$r"
            exit 1
          fi

  # ─── E2E テスト ────────────────────────────────────────────────────────────
  playwright:
    name: Playwright E2E (chromium)
    if: false # 一時停止 2026-06-01 — CI ボトルネック解消まで停止（再開時はこの行を削除）
    # ubuntu-26.04 では Playwright 1.59.1 が依存を入れられず「1件も走らない」赤になるため固定
    # （karte-gate.yml:38 と同じ理由・同じ直し方。2026-10-26 run 40274501029）
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    # NOTE: needs: lint を削除し lint と並列実行（2026-05-28）。
    # lint と playwright は完全独立（DB共有なし・API mock済み）のため並列化可能。
    # lint 失敗時も playwright は走るが、lint ジョブ自体が Required Check のため PR はブロックされる。

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Playwright のブラウザは別キャッシュ。OS 依存の system deps は --with-deps で入る。
      # actions/cache で node_modules ごと cache すると Playwright バイナリも入るが、
      # 公式推奨は browsers を別 cache key にする（version 固定で hit 率高い）。
      - name: Get Playwright version
        id: pw
        run: |
          PW_VERSION=$(node -p "require('@playwright/test/package.json').version")
          echo "version=$PW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install system deps (chromium)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        # cache hit でも system deps は image によって不足するため最小限を入れる
        run: npx playwright install-deps chromium

      - name: Run Playwright E2E
        env:
          # CI 上で webServer の reuseExistingServer=false が走る
          CI: 'true'
          # Vite dev server に渡す Firebase 用ダミー値（mock 経由で bypass）
          VITE_FIREBASE_API_KEY: AIzaSyE2E-dummy-api-key
          VITE_FIREBASE_AUTH_DOMAIN: e2e-fixture.firebaseapp.com
          VITE_GCP_PROJECT_ID: e2e-fixture
        run: npm run test:e2e

      # 失敗時 / 常時 artifact upload
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload test results (trace / video / screenshot)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: frontend/test-results
          retention-days: 14
          if-no-files-found: ignore
