name: Deploy to VPS

on:
  push:
    branches:
      - main

# 連続リリースで deploy.yml が並行実行されると、Docker コンテナ名衝突
# （Conflict. The container name "/astro-webapp-backend-1" is already in use）で
# backend が起動できず 502 になる（2026-06-02 #1390/1395/1396 の 9 分間連続マージで実発生）。
# 同一グループで直列化し、並行実行を防ぐ。
# cancel-in-progress: false — migration 実行中に後続がキャンセルすると DB が
# 中途半端な状態になる危険があるため、キャンセルせずキュー待ちにする（ADR-092）。
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # ============================================
      # LP (lp/) build + rsync to VPS
      # 静的サイト salesanchor.jp の本体（Astro 4 で 4 ページ生成）
      # ============================================
      - name: Checkout
        uses: actions/checkout@v5

      # ADR-082: フロントのみのデプロイでは DB マイグレーション（冪等・約60ステップ）を
      # スキップして所要時間を短縮する。backend/migrations/scripts/compose/deploy.yml の
      # いずれかが変わった場合のみ migrations を実行（保守的ゲート・判定不能時は安全側=実行）。
      - name: Detect backend / migration changes
        uses: dorny/paths-filter@v4
        id: changes
        with:
          filters: |
            migrations:
              - 'migrations/**'
              - 'scripts/**'
              - 'backend/**'
              - 'docker-compose.yml'
              - '.github/workflows/deploy.yml'
            nginx:
              - 'nginx/**'
              - 'docker-compose.yml'
            # PO承認（2026-10-03）: Pre-deploy DB backup 専用フィルタ。
            # 上の `migrations` は backend/** 等も含み広すぎる（2026-10-02 JST の
            # merge では 25件中16件が該当、うち実際に migrations/ を含むのは3件のみ
            # — docs/handoff/predeploy-backup-db-filter/recon.md）。
            # backup は「実際に DB スキーマ/データを変更しうる」パスのみで判定する:
            #   - migrations/**            : run_sql で直接実行される .sql
            #   - scripts/run_all_migrations.sh : マイグレーションの唯一の実行経路（SSoT）
            #   - scripts/migrate_*.py     : run_all_migrations.sh から run_py で呼ばれる
            #                                個別マイグレーションスクリプト本体
            #   - scripts/migration_py_entry.py : run_py が全 Python 移行を動かす入口（ADR-1037 拡張）
            db_migrations:
              - 'migrations/**'
              - 'scripts/run_all_migrations.sh'
              - 'scripts/migrate_*.py'
              - 'scripts/migration_py_entry.py'

      - name: Check previous deploy completed
        id: gate
        env:
          GH_TOKEN: ${{ secrets.PIPELINE_PAT }}
          BEFORE: ${{ github.event.before }}
          C_MIG: ${{ steps.changes.outputs.migrations }}
          C_NGX: ${{ steps.changes.outputs.nginx }}
          C_DB: ${{ steps.changes.outputs.db_migrations }}
        run: |
          last=$(gh api "repos/${{ github.repository }}/actions/workflows/deploy.yml/runs?branch=main&event=push&status=success&per_page=1" --jq '.workflow_runs[0].head_sha // ""' 2>/dev/null || echo "")
          if [ -n "$last" ] && [ "$last" = "$BEFORE" ]; then
            echo "前回デプロイは成功（${last:0:7}）→ 差分どおり"
            { echo "migrations=$C_MIG"; echo "nginx=$C_NGX"; echo "db_migrations=$C_DB"; } >> "$GITHUB_OUTPUT"
          else
            echo "::warning::前回の成功デプロイ(${last:0:7})が push 直前(${BEFORE:0:7})と違う／取れない → 全部実行"
            { echo "migrations=true"; echo "nginx=true"; echo "db_migrations=true"; } >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          # Node.js 22 LTS（2027-04 EOL）。Astro 4.x は Node 18+ 対応のため互換。
          # 他ワークフロー（e2e/frontend-check）と統一。
          # GHA Node.js 20 廃止対応 2026-06-16（ADR-n/a）。
          node-version: '22'
          cache: npm
          cache-dependency-path: lp/package-lock.json

      - name: Build LP
        run: |
          cd lp
          npm ci
          npm run build

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add VPS to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Rsync LP build to VPS
        run: |
          rsync -avz --delete \
            lp/dist/ \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/home/ubuntu/salesanchor/www/salesanchor/

      # ============================================================
      # SA設計図書サイト デプロイ（ADR-134）
      # ① 進捗表 → progress.json 変換（失敗=デプロイ停止）
      # ② htpasswd 自動セットアップ（idempotent・2ユーザー）
      # ③ docs/design-site/ を www/design-site/ に同期
      # ============================================================
      - name: Generate progress.json from SA-OVERVIEW
        run: |
          python3 scripts/design-site/generate-progress-json.py \
            docs/plans/sa-progress/00-SA-OVERVIEW.md \
            /tmp/design-site-progress.json

      - name: Setup design-site htpasswd (idempotent)
        uses: appleboy/ssh-action@v1
        env:
          VIEWER_CRED: ${{ secrets.DESIGN_SITE_VIEWER_CRED }}
          SMOKE_CRED: ${{ secrets.DESIGN_SITE_SMOKE_CRED }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: VIEWER_CRED,SMOKE_CRED
          script: |
            set -e
            HTPASSWD=/home/ubuntu/salesanchor/nginx/htpasswd.d/design-site
            mkdir -p "$(dirname "${HTPASSWD}")"
            IFS=: read -r v_user v_pass <<< "${VIEWER_CRED}"
            IFS=: read -r s_user s_pass <<< "${SMOKE_CRED}"
            # openssl passwd -apr1 を使用（apache2-utils 不要、sudo 不要）
            printf '%s:%s\n' "${v_user}" "$(openssl passwd -apr1 "${v_pass}")" >  "${HTPASSWD}"
            printf '%s:%s\n' "${s_user}" "$(openssl passwd -apr1 "${s_pass}")" >> "${HTPASSWD}"
            echo "htpasswd users: $(cut -d: -f1 "${HTPASSWD}" | tr '\n' ' ')"

      - name: Rsync design-site to VPS
        run: |
          rsync -avz --delete \
            docs/design-site/ \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/home/ubuntu/salesanchor/www/design-site/
          rsync -avz \
            /tmp/design-site-progress.json \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/home/ubuntu/salesanchor/www/design-site/progress.json

      # ============================================
      # 空き容量チェック（ADR-135/136）
      # 2026-10-02 prod1 ディスクフル事故の再発防止。
      # DBマイグレーションの有無に関わらず、デプロイのたびに毎回実行する
      # （Pre-deploy DB backup が migrations なしでスキップされても抜けないようにする）。
      # ============================================
      - name: Check free disk space
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            echo "============================================"
            echo "Check free disk space..."
            echo "============================================"
            cd /home/ubuntu/salesanchor

            # 2026-10-02 prod1 ディスクフル事故の再発防止（ADR-135/136）:
            # バックアップ書き込み前に空き容量を確認し、閾値未満ならここで止める。
            MIN_FREE_GB=5
            FREE_GB=$(df --output=avail -B1G / | tail -1 | tr -d '[:space:]')
            echo "Free space on /: ${FREE_GB}GB (threshold: ${MIN_FREE_GB}GB)"
            if [ "${FREE_GB}" -lt "${MIN_FREE_GB}" ]; then
              echo "❌ 空き容量不足のためデプロイを中止します: ${FREE_GB}GB < ${MIN_FREE_GB}GB"
              echo "--- backups/postgres 使用量 ---"
              du -sh /home/ubuntu/backups/postgres 2>/dev/null || true
              echo "--- docker system df ---"
              docker system df || true
              exit 1
            fi

      # ============================================
      # デプロイ前 DB バックアップ
      # git pull / docker compose の前に取得して万一のロールバック保険とする。
      # scripts/backup.sh が /home/ubuntu/backups/postgres/ に .sql.gz を生成。
      # PO承認（2026-10-03）: DBマイグレーションを含むデプロイのみ実行する
      # （steps.gate.outputs.db_migrations が 'true' の場合のみ。
      #   `migrations` フィルタは backend/** 等も含み広すぎるため、
      #   実際に DB を変更しうるパスだけの `db_migrations` フィルタを使う）。
      # ============================================
      - name: Pre-deploy DB backup
        id: backup
        if: steps.gate.outputs.db_migrations == 'true'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 10m
          script: |
            set -e
            echo "============================================"
            echo "Pre-deploy DB backup..."
            echo "============================================"
            cd /home/ubuntu/salesanchor

            if [ -f scripts/deploy-db-orphan-cleanup.sh ]; then bash scripts/deploy-db-orphan-cleanup.sh; else echo ">>> [cleanup] skipped: script not present (old checkout)"; fi
            bash scripts/backup.sh deploy
            LATEST=$(ls -t /home/ubuntu/backups/postgres/salesanchor_db_*.sql.gz 2>/dev/null | head -1)
            if [ -z "${LATEST}" ]; then
              echo "❌ Backup file not found after backup.sh"
              exit 1
            fi
            SIZE=$(du -h "${LATEST}" | cut -f1)
            echo "✅ Backup: ${LATEST} (${SIZE})"

      # ============================================
      # 既存: VPS 上で git pull + docker compose up + migrations
      #
      # 2026-05-22 hotfix: 旧 migration ステップを part 1 / part 2 に分割（expression length 上限回避）
      # 2026-06-02 改善: part 1 / part 2 を scripts/run_all_migrations.sh に統合
      #   - 新マイグレーション追加時は deploy.yml ではなく run_all_migrations.sh に追記する
      #   - deploy.yml の肥大化防止 + ADR-045 パターン（追記漏れ）の根本解消
      #   ステップ構成:
      #     1. Deploy to VPS (code + env + docker compose)
      #     2. Run database migrations  ← scripts/run_all_migrations.sh を呼ぶだけ
      #     3. Finalize (health check + cleanup)
      # ============================================
      - name: Deploy to VPS (code + env + docker compose)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            echo "============================================"
            echo "Starting deployment (code + env + docker compose)..."
            echo "============================================"

            cd /home/ubuntu/salesanchor

            echo "Step 0: 自動ロールバック用 PREV_SHA 保存..."
            # git pull 前の HEAD SHA を保存（ロールバック時の復帰先）
            # .deploy_prev_sha は Finalize ステップ（別 SSH セッション）で読み取る
            PREV_SHA=$(git rev-parse HEAD 2>/dev/null || echo "")
            echo "${PREV_SHA}" > .deploy_prev_sha
            echo "  PREV_SHA=${PREV_SHA:0:7}"

            echo "Step 1: Pulling latest code from GitHub..."
            # divergent branches エラー防止: fetch + reset --hard で常に remote main に合わせる
            git fetch origin main
            git reset --hard origin/main

            echo "Step 2: Syncing Meta Webhook environment variables from GitHub Secrets..."
            # ADR-025: GitHub Secrets を更新したら必ず VPS .env に反映する。
            # 旧パターン `grep -q "^K=" .env || echo "K=V" >> .env` は
            # "既存値があれば上書きしない" 設計のため、Secret を更新しても
            # VPS の .env が古い値のまま残った（2026-05-01 の METADATA_FERNET_KEY
            # ローテーションが反映されず、毎日の token refresh が失敗した直接原因）。
            #
            # 新パターン: 対象キーの既存行を anchored 削除 → 最新値を append。
            #   - `^KEY=` anchor によりコメント行 (`#KEY=...`) や部分一致
            #     (`META_APP_ID_OLD=...`) を誤って削除しない
            #   - .env 内の他のキー（DB_PASSWORD 等 VPS で手動設定したもの）には触れない
            #   - 冪等: 同じ値で再実行しても最終状態は同じ
            #   - quoted heredoc (`<<'ENV_EOF'`) でシェル変数展開を抑止し、
            #     Secret 値をそのまま literal text として書き込む。
            #     `${{ secrets.X }}` 自体は GitHub Actions が SSH 送信前に展開する。
            #   - 値は単一引用符で囲む（compose も source も文字どおり読む。件1 design）
            #   - Phase 1-D Sprint 1: METADATA_FERNET_KEY 紛失は DB token を永久に
            #     復号不能化するリスクが極めて高い。GitHub Secrets と別の安全な
            #     バックアップの二重保管必須。ローテーション手順は
            #     docs/operations/meta_encryption_key_rotation.md 参照。
            touch .env
            sed -i.bak \
              -e '/^META_VERIFY_TOKEN=/d' \
              -e '/^META_APP_SECRET=/d' \
              -e '/^META_APP_ID=/d' \
              -e '/^META_OAUTH_REDIRECT_URI=/d' \
              -e '/^METADATA_FERNET_KEY=/d' \
              -e '/^GEMINI_API_KEY=/d' \
              -e '/^ADMIN_NOTIFICATION_DISCORD_WEBHOOK=/d' \
              -e '/^ANALYSIS_ERROR_REPORT_DISCORD_WEBHOOK=/d' \
              -e '/^GOOGLE_CALENDAR_CLIENT_ID=/d' \
              -e '/^GOOGLE_CALENDAR_CLIENT_SECRET=/d' \
              -e '/^GOOGLE_CALENDAR_REDIRECT_URI=/d' \
              -e '/^DISCORD_BOT_TOKEN=/d' \
              -e '/^GOOGLE_DRIVE_CLIENT_ID=/d' \
              -e '/^GOOGLE_DRIVE_CLIENT_SECRET=/d' \
              -e '/^GOOGLE_DRIVE_REDIRECT_URI=/d' \
              -e '/^SMOKE_SERVICE_TOKEN=/d' \
              -e '/^SMOKE_SERVICE_EMAIL=/d' \
              -e '/^REVIEW_MAIL_IMAP_HOST=/d' \
              -e '/^REVIEW_MAIL_IMAP_PORT=/d' \
              -e '/^REVIEW_MAIL_IMAP_USER=/d' \
              -e '/^REVIEW_MAIL_IMAP_PASSWORD=/d' \
              -e '/^REVIEW_MAIL_WEBMAIL_URL=/d' \
              -e '/^REVIEW_MAIL_DISCORD_WEBHOOK=/d' \
              -e '/^OPS_MAIL_IMAP_USER=/d' \
              -e '/^OPS_MAIL_IMAP_PASSWORD=/d' \
              -e '/^OPS_MAIL_DISCORD_WEBHOOK=/d' \
              -e '/^VITE_FUNNEL_DASHBOARD=/d' \
              -e '/^SMTP_HOST=/d' \
              -e '/^SMTP_PORT=/d' \
              -e '/^SMTP_USER=/d' \
              -e '/^SMTP_PASSWORD=/d' \
              -e '/^MAIL_FROM=/d' \
              -e '/^CONTACT_NOTIFY_EMAIL=/d' \
              -e '/^AUTH_PASSWORD_RESET_ALLOWLIST=/d' \
              -e '/^AUTH_VIEWER_JWT_SECRET=/d' \
              -e '/^AUTH_PROVIDER=/d' \
              -e '/^AUTH_JWT_SECRET=/d' \
              -e '/^VITE_AUTH_PROVIDER=/d' \
              -e '/^OPS_API_TOKEN=/d' \
              -e '/^OPS_INGEST_TOKEN=/d' \
              -e '/^ERROR_REPORT_AGENT_TOKEN=/d' \
              -e '/^READ_WINDOW_TOKEN=/d' \
              -e '/^CASE_AGENT_TOKEN=/d' \
              -e '/^CASE_ADMIN_TOKEN=/d' \
              -e '/^WEBPUSH_VAPID_PRIVATE_KEY=/d' \
              -e '/^WEBPUSH_VAPID_PUBLIC_KEY=/d' \
              -e '/^WEBPUSH_VAPID_SUBJECT=/d' \
              -e '/^COMPOSE_FILE=/d' \
              .env
            # YAML `|` ブロックの共通インデント (12 スペース) はパース時に自動除去される。
            # したがって heredoc 本文の各行は実行時に行頭スペースなしで届く。
            # Sprint 4 (F4): GEMINI_API_KEY / ADMIN_NOTIFICATION_DISCORD_WEBHOOK は
            #   ADR-025 trap 回避のため同じ「sed 削除 → append」パターンに合流。
            #   secret 未設定でも空値で append される（後段 LLM サービスは空判定して
            #   parsed_rule_only に graceful degrade、AC4.5）。
            # ADR-1013 便3: メール送信（mail_config.py が読む）と再設定の送信許可。未登録の Secret は空文字＝送らない
            # ADR-1019 段2: 閲覧者のトークンの鍵（viewer_tokens.py が読む）。アプリの鍵 AUTH_JWT_SECRET とは別の値
            cat > .env.secrets.new <<'ENV_EOF'
            META_VERIFY_TOKEN='${{ secrets.META_VERIFY_TOKEN }}'
            META_APP_SECRET='${{ secrets.META_APP_SECRET }}'
            META_APP_ID='${{ secrets.META_APP_ID }}'
            META_OAUTH_REDIRECT_URI='${{ secrets.META_OAUTH_REDIRECT_URI }}'
            METADATA_FERNET_KEY='${{ secrets.METADATA_FERNET_KEY }}'
            GEMINI_API_KEY='${{ secrets.GEMINI_API_KEY }}'
            ADMIN_NOTIFICATION_DISCORD_WEBHOOK='${{ secrets.ADMIN_NOTIFICATION_DISCORD_WEBHOOK }}'
            ANALYSIS_ERROR_REPORT_DISCORD_WEBHOOK='${{ secrets.ANALYSIS_ERROR_REPORT_DISCORD_WEBHOOK }}'
            GOOGLE_CALENDAR_CLIENT_ID='${{ secrets.GOOGLE_CALENDAR_CLIENT_ID }}'
            GOOGLE_CALENDAR_CLIENT_SECRET='${{ secrets.GOOGLE_CALENDAR_CLIENT_SECRET }}'
            GOOGLE_CALENDAR_REDIRECT_URI='${{ secrets.GOOGLE_CALENDAR_REDIRECT_URI }}'
            DISCORD_BOT_TOKEN='${{ secrets.DISCORD_BOT_TOKEN }}'
            GOOGLE_DRIVE_CLIENT_ID='${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}'
            GOOGLE_DRIVE_CLIENT_SECRET='${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}'
            GOOGLE_DRIVE_REDIRECT_URI='${{ secrets.GOOGLE_DRIVE_REDIRECT_URI }}'
            SMOKE_SERVICE_TOKEN='${{ secrets.FEDEX_SMOKE_API_TOKEN }}'
            SMOKE_SERVICE_EMAIL='${{ secrets.FEDEX_SMOKE_USER_EMAIL }}'
            REVIEW_MAIL_IMAP_HOST='${{ secrets.REVIEW_MAIL_IMAP_HOST }}'
            REVIEW_MAIL_IMAP_PORT='${{ secrets.REVIEW_MAIL_IMAP_PORT }}'
            REVIEW_MAIL_IMAP_USER='${{ secrets.REVIEW_MAIL_IMAP_USER }}'
            REVIEW_MAIL_IMAP_PASSWORD='${{ secrets.REVIEW_MAIL_IMAP_PASSWORD }}'
            REVIEW_MAIL_WEBMAIL_URL='${{ secrets.REVIEW_MAIL_WEBMAIL_URL }}'
            REVIEW_MAIL_DISCORD_WEBHOOK='${{ secrets.REVIEW_MAIL_DISCORD_WEBHOOK }}'
            OPS_MAIL_IMAP_USER='${{ secrets.OPS_MAIL_IMAP_USER }}'
            OPS_MAIL_IMAP_PASSWORD='${{ secrets.OPS_MAIL_IMAP_PASSWORD }}'
            OPS_MAIL_DISCORD_WEBHOOK='${{ secrets.OPS_MAIL_DISCORD_WEBHOOK }}'
            VITE_FUNNEL_DASHBOARD='${{ secrets.VITE_FUNNEL_DASHBOARD }}'
            SMTP_HOST='${{ secrets.SMTP_HOST }}'
            SMTP_PORT='${{ secrets.SMTP_PORT }}'
            SMTP_USER='${{ secrets.SMTP_USER }}'
            SMTP_PASSWORD='${{ secrets.SMTP_PASSWORD }}'
            MAIL_FROM='${{ secrets.MAIL_FROM }}'
            CONTACT_NOTIFY_EMAIL='${{ secrets.CONTACT_NOTIFY_EMAIL }}'
            AUTH_VIEWER_JWT_SECRET='${{ secrets.AUTH_VIEWER_JWT_SECRET }}'
            AUTH_PROVIDER='self'
            AUTH_JWT_SECRET='${{ secrets.AUTH_JWT_SECRET }}'
            VITE_AUTH_PROVIDER='self'
            OPS_API_TOKEN='${{ secrets.OPS_API_TOKEN }}'
            OPS_INGEST_TOKEN='${{ secrets.OPS_INGEST_TOKEN }}'
            ERROR_REPORT_AGENT_TOKEN='${{ secrets.ERROR_REPORT_AGENT_TOKEN }}'
            READ_WINDOW_TOKEN='${{ secrets.READ_WINDOW_TOKEN }}'
            CASE_AGENT_TOKEN='${{ secrets.CASE_AGENT_TOKEN }}'
            CASE_ADMIN_TOKEN='${{ secrets.CASE_ADMIN_TOKEN }}'
            WEBPUSH_VAPID_PRIVATE_KEY='${{ secrets.WEBPUSH_VAPID_PRIVATE_KEY }}'
            WEBPUSH_VAPID_PUBLIC_KEY='${{ secrets.WEBPUSH_VAPID_PUBLIC_KEY }}'
            WEBPUSH_VAPID_SUBJECT='${{ secrets.WEBPUSH_VAPID_SUBJECT }}'
            COMPOSE_FILE=docker-compose.yml:docker-compose.exporters.yml
            ENV_EOF
            # 件1（docs/handoff/deploy-secrets-dollar-quote/design.md）: 値に ' か改行があると単一引用符が壊れる。
            # 壊れた行があれば .env を書き換える前の状態に戻して止める。出すのは heredoc 内の行番号だけ（値は出さない）。
            _bad_lines=$(grep -nvE "^[A-Z0-9_]+='[^']*'$|^COMPOSE_FILE=" .env.secrets.new | cut -d: -f1 | tr '\n' ' ')
            if [ -n "${_bad_lines}" ]; then
              echo "❌ secrets の値に単一引用符か改行がある（heredoc の行: ${_bad_lines}）。.env は変更前に戻した"
              mv .env.bak .env
              rm -f .env.secrets.new
              exit 1
            fi
            cat .env.secrets.new >> .env
            rm -f .env.secrets.new .env.bak

            echo "Step 2b: DATABASE_URL ホスト修正 + Phase2 フラグ確認..."
            # SA-18: localhost:5432 は必ずコンテナ内到達可能な postgres:5432 に修正する。
            # Phase2 フラグ（SA18_PHASE2_ENABLED=1）が .env に立っている場合は
            # salesanchor_app URL を保持する（ユーザー意図を尊重）。
            # フラグがない場合は jarvis@postgres:5432 に戻す（従来動作・冪等）。

            # [Step 2b-i] localhost:5432 は無条件で postgres:5432 に修正
            if grep -q 'localhost:5432' .env 2>/dev/null; then
              sed -i 's|@localhost:5432/|@postgres:5432/|g' .env
              echo "ℹ️  localhost:5432 → postgres:5432 に修正しました"
            fi

            # [Step 2b-ii] Phase2 フラグで jarvis 復元を判定
            if grep -q '^SA18_PHASE2_ENABLED=1' .env 2>/dev/null; then
              echo "ℹ️  SA18_PHASE2_ENABLED=1 を検出 — salesanchor_app URL を保持します（Phase2 意図的切替）"
            elif grep -q 'salesanchor_app' .env 2>/dev/null; then
              # Phase2 フラグなしで salesanchor_app が残っている → jarvis に戻す
              _pguser=$(grep '^POSTGRES_USER=' .env | cut -d= -f2- | head -1 | tr -d '[:space:]')
              _pgpass=$(grep '^POSTGRES_PASSWORD=' .env | cut -d= -f2- | head -1 | tr -d '\r\n')
              _pgdb=$(grep '^POSTGRES_DB=' .env | cut -d= -f2- | head -1 | tr -d '[:space:]')
              # Python で URL-safe エンコード（パスワードに特殊文字があっても安全）
              # 注意: python3 -c の継続行は YAML リテラルブロックの最低インデントを下回るため単行化必須
              _durl=$(python3 -c "import urllib.parse,sys;u,p,d=sys.argv[1],sys.argv[2],sys.argv[3];print('postgresql+asyncpg://{}:{}@postgres:5432/{}'.format(urllib.parse.quote(u,safe=''),urllib.parse.quote(p,safe=''),d))" "${_pguser}" "${_pgpass}" "${_pgdb}")
              sed -i '/^DATABASE_URL=/d' .env
              echo "DATABASE_URL=${_durl}" >> .env
              echo "ℹ️  DATABASE_URL を jarvis@postgres:5432 に復元しました（SA18_PHASE2_ENABLED 未設定）"
            else
              echo "ℹ️  DATABASE_URL は既に jarvis モード — スキップ"
            fi

            echo "Step 3: Rebuilding and restarting containers..."
            # build と up を分離してダウンタイムを最小化する。
            # --build を up と一体で実行すると旧コンテナ停止後にビルドが走り（最大2分程度）
            # その間 nginx が 502 を返す問題があった（2026-05-30 障害）。
            # build を先に完了させてから up（切り替えのみ）を実行することで
            # ダウンタイムをコンテナ再起動の数秒に短縮する。
            #
            # Docker bridge 一時エラー対策（2026-06-02 調査）:
            # VPS カーネルが "adding interface veth to bridge docker0 failed: Device does not exist"
            # を返す場合がある（一時的な netns 状態異常）。15秒待ってリトライすると解消する。
            BUILD_OK=false
            for _build_attempt in 1 2 3; do
              if docker compose build; then
                BUILD_OK=true
                break
              fi
              echo "Build attempt ${_build_attempt} failed. 15秒後にリトライ..."
              sleep 15
            done
            if [ "$BUILD_OK" != "true" ]; then
              echo "docker compose build が3回失敗しました"
              exit 1
            fi
            # blue-green: backend を無停止で切替（scripts/blue-green-cutover.sh）
            #   旧コンテナを先に削除しないことで、Python 初期化 (~22s) 中の 502 を排除する。
            #   [before] docker rm -f backend → up → 22s 502 → healthy
            #   [after]  green 起動 → health 確認 → nginx 切替 → 旧停止 → 502 ゼロ
            echo "Step 3b: Blue-green backend cutover..."
            bash scripts/blue-green-cutover.sh

            # backend 以外（frontend/celery-beat/discord）は従来の force-rm + up で切替。
            # これらは nginx 経由の同期 API のリクエストパスに関与しないため
            # 数秒のダウンは発生しない（frontend は静的配信、celery-beat/discord は非同期）。
            # discord-gateway: 重複起動による Discord 再接続storm→token reset を防ぐため
            # 旧コンテナを先に削除してから起動する（従来動作を維持）。
            #
            # celery-worker だけは別扱い（docs/handoff/extraction-job-recovery/design.md §B-3）:
            # task_acks_late=True で実行中タスクを抱えている場合があるため、
            # 強制削除（docker rm -f）の前に `docker compose stop -t 60` で
            # warm shutdown（SIGTERM→最大60秒待って実行中タスクを終える）してから止める。
            echo "Step 3c: Updating non-backend services (frontend/celery/discord)..."
            # 段階1（観測のみ。動きは変えない）：docs/handoff/deploy-selective-recreate/design.md
            bash scripts/deploy/app-services-plan.sh --observe frontend celery-worker celery-beat discord-gateway gemini-egress || true
            docker compose up -d --no-deps --dry-run frontend celery-worker celery-beat discord-gateway gemini-egress 2>&1 | sed 's/^/DRYRUN /' || true
            docker compose stop -t 60 celery-worker 2>/dev/null || true
            # oneoff=False のみ消す（compose run の一時コンテナを消さない。docs/handoff/deploy-keep-oneoff/recon.md）
            for _svc in frontend celery-beat discord-gateway; do
              docker ps -a --filter "name=astro-webapp-${_svc}" --filter "label=com.docker.compose.oneoff=False" --format "{{.ID}}" | xargs -r docker rm -f 2>/dev/null || true
            done
            docker ps -a --filter "name=astro-webapp-celery-worker" --filter "label=com.docker.compose.oneoff=False" --format "{{.ID}}" | xargs -r docker rm -f 2>/dev/null || true
            docker compose up -d --no-deps --remove-orphans frontend celery-worker celery-beat discord-gateway gemini-egress
            bash scripts/deploy/app-services-plan.sh --verify || true
            echo "Step 3d: Ensuring monitoring collectors are up..."
            docker compose up -d --no-deps node-exporter promtail

            echo "Step 4: Backend is already healthy (confirmed by blue-green cutover)."
            echo "Step 4b: nginx reload already done inside blue-green-cutover.sh."

            echo "============================================"
            echo "Code + env + docker compose phase done."
            echo "============================================"

      # ============================================
      # ADR-137: nginx inode ズレ対策 — nginx 設定変更時の force-recreate
      #
      # 問題: git reset --hard は nginx.conf を新 inode で置換するが、
      # Docker bind mount はコンテナ起動時の inode に束縛されるため、
      # コンテナを再作成しないと新設定（location追加・volume追加等）が反映されない。
      # nginx -s reload では旧 inode の設定を再読み込みするだけで解消しない。
      #
      # 対策: nginx/** または docker-compose.yml が変更されたデプロイで
      # nginx コンテナを force-recreate して bind mount を最新 inode に再束縛する。
      # blue-green による backend 切替完了後に実行するため backend 可用性に影響しない。
      # nginx 再起動中（~2-3s）に brief な 502 窓が生じるが、nginx 設定を変えない
      # 通常デプロイ（backend/frontend のみ）ではこのステップは実行されない。
      # ============================================
      #
      # ADR-1052 段2 #9 の 1: 作り直しの前に本番と同じ取り付けで nginx -t を通し、通らなければ作り直さない。
      # 作り直しの後に起きているかと 443 の応答を確かめ、だめなら戻り先の nginx.conf に自動で戻す。
      #   .deploy_nginx_good.conf = 最後に後の確認まで通った設定 / .deploy_prev_nginx.conf = 今回の戻り先
      #   （どちらも /home/ubuntu/salesanchor の直下・git に入れない。.deploy_prev_sha と同じ扱い）
      # continue-on-error: この手順が失敗しても後ろの手順は今と同じに流れ、Finalize の後の
      # 「Fail if nginx recreate failed」でデプロイ全体が失敗の表示になる。
      - name: Recreate nginx (apply config/volume changes)
        id: nginx_recreate
        continue-on-error: true
        if: ${{ success() && steps.gate.outputs.nginx == 'true' }}
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /home/ubuntu/salesanchor

            # 作り直しの後の確認: 最大 15 秒・1 秒ごとに「起きている」かつ「443 の応答が 000 でない」。
            # curl の終了コードが 0 でなくても止まらずに次の秒へ（呼ぶ側は set +e の中）。
            _nginx_confirm() {
              _c_i=1
              while [ "${_c_i}" -le 15 ]; do
                _running=$(docker inspect --format='{{.State.Running}}' astro-webapp-nginx-1 2>/dev/null)
                _code=$(curl -sk -o /dev/null -w '%{http_code}' --max-time 5 --resolve app.salesanchor.jp:443:127.0.0.1 https://app.salesanchor.jp/ 2>/dev/null)
                echo "  確認 ${_c_i}/15: running=${_running} http=${_code}"
                if [ "${_running}" = "true" ] && [ -n "${_code}" ] && [ "${_code}" != "000" ]; then
                  return 0
                fi
                sleep 1
                _c_i=$((_c_i + 1))
              done
              return 1
            }

            # 1. 戻り先の用意
            PREV=$(cat .deploy_prev_sha 2>/dev/null || true)
            rm -f .deploy_prev_nginx.conf
            if [ -s .deploy_nginx_good.conf ]; then
              # 最後に起きた設定を正とする（PREV の設定は、前のデプロイで点検に落ちていれば壊れている）
              cp .deploy_nginx_good.conf .deploy_prev_nginx.conf || true
            elif [ -n "${PREV}" ] && git cat-file -e "${PREV}:nginx/nginx.conf" 2>/dev/null; then
              git show "${PREV}:nginx/nginx.conf" > .deploy_prev_nginx.conf || true
            fi
            if [ ! -s .deploy_prev_nginx.conf ]; then
              echo "::error::戻り先の nginx.conf を用意できません"
              exit 1
            fi

            # 2. 戻り先の点検（本番と同じ取り付けで）。通らなければ作り直さない
            if ! docker compose run --rm --no-deps -T -v /home/ubuntu/salesanchor/.deploy_prev_nginx.conf:/etc/nginx/conf.d/default.conf:ro nginx nginx -t; then
              echo "::error::戻り先の nginx.conf が nginx -t に通りません。作り直しません"
              exit 1
            fi

            # 3. 新しい設定の点検（本番の取り付け＝証明書・htpasswd.d・/var/www をそのまま使う）
            if ! docker compose run --rm --no-deps -T nginx nginx -t; then
              # 後ろで nginx を作り直す手順が起きても壊れた設定を読まないよう、作業の写しを戻り先に替える
              cp .deploy_prev_nginx.conf nginx/nginx.conf
              echo "::error::新しい nginx.conf が nginx -t に通りません。作り直しません（今の nginx は前の設定のまま動き続けます）"
              exit 1
            fi

            # 4〜6. 作り直し・後の確認・自動で戻す。途中の失敗で戻す部分まで届かなくならないよう set +e で囲む
            set +e
            echo "nginx config/volume change detected — force-recreating nginx container..."
            docker compose up -d --no-deps --force-recreate nginx
            _up_rc=$?
            _confirmed=1
            if [ "${_up_rc}" -eq 0 ]; then
              echo "nginx recreated. Confirming (max 15s)..."
              _nginx_confirm
              _confirmed=$?
            else
              echo "::error::docker compose up が終了コード ${_up_rc} で終わりました"
            fi

            if [ "${_confirmed}" -eq 0 ]; then
              # 5. 通った設定を最後に起きた設定として残す（途中で切れた good を残さない）
              if cp nginx/nginx.conf .deploy_nginx_good.conf.tmp && mv .deploy_nginx_good.conf.tmp .deploy_nginx_good.conf; then
                echo "ℹ️  最後に起きた nginx の設定を .deploy_nginx_good.conf に残しました"
              else
                # 動いている設定より古い good を残さない（1c がそれで作り直さないため）
                rm -f .deploy_nginx_good.conf .deploy_nginx_good.conf.tmp
                echo "::warning::最後に起きた nginx の設定を残せませんでした"
              fi
              echo "nginx force-recreate done."
              exit 0
            fi

            # 6. 戻り先に自動で戻して作り直す（.deploy_nginx_good.conf は書き換えない）
            echo "::error::nginx が作り直しの後に起きていません — 戻り先の nginx.conf に戻して作り直します"
            cp .deploy_prev_nginx.conf nginx/nginx.conf
            docker compose up -d --no-deps --force-recreate nginx
            _nginx_confirm
            echo "戻した後の確認の結果: $?（0 = 起きている）"
            exit 1

      # ADR-1042: AI 読み取り窓口（ai-reader-http）を起こす。付け足しの機能なので、
      # 失敗してもアプリの反映は止めない（警告だけ出す）。image は backend と同じ astro-webapp-backend。
      - name: Start ai-reader-http (read window)
        if: ${{ success() }}
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/ubuntu/salesanchor
            if [ ! -r /home/ubuntu/.config/salesanchor/ai-reader.env ]; then
              echo "::warning::ai-reader.env が読めないため ai-reader-http を起こしません"
              exit 0
            fi
            docker compose -p astro-webapp-readwindow -f docker-compose.ai-reader-http.yml up -d --build=false --force-recreate \
              || echo "::warning::ai-reader-http を起こせませんでした（アプリの反映には影響しません）"

      # ADR-1052 段1: 相談係専用の読む窓口（ai-reader-cloud-http）を起こす。今の窓口とは別の容器・別の鍵（CASE_AGENT_TOKEN）。
      # 付け足しの機能なので、失敗してもアプリの反映は止めない（警告だけ出す）。
      - name: Start ai-reader-cloud-http (case agent read window)
        if: ${{ success() }}
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/ubuntu/salesanchor
            if [ ! -r /home/ubuntu/.config/salesanchor/ai-reader-cloud.env ]; then
              echo "::warning::ai-reader-cloud.env が読めないため ai-reader-cloud-http を起こしません"
              exit 0
            fi
            docker compose -p astro-webapp-casewindow -f docker-compose.ai-reader-cloud-http.yml up -d --build=false --force-recreate \
              || echo "::warning::ai-reader-cloud-http を起こせませんでした（アプリの反映には影響しません）"

      # ADR-1052 段2: 値を 1 回だけ返す口（ai-unmask-http）を起こす。相談係の鍵（CASE_AGENT_TOKEN）で守る。
      # 付け足しの機能なので、失敗してもアプリの反映は止めない（警告だけ出す）。
      - name: Start ai-unmask-http (case agent unmask read)
        if: ${{ success() }}
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/ubuntu/salesanchor
            if [ ! -r /home/ubuntu/.config/salesanchor/ai-unmask.env ]; then
              echo "::warning::ai-unmask.env が読めないため ai-unmask-http を起こしません"
              exit 0
            fi
            docker compose -p astro-webapp-unmask -f docker-compose.ai-unmask-http.yml up -d --build=false --force-recreate \
              || echo "::warning::ai-unmask-http を起こせませんでした（アプリの反映には影響しません）"

      # ADR-1056 段2: チャット秘書の容器（secretary-agent）を作って起こす。付け足しの機能なので、どの手順が失敗しても
      # アプリの反映は止めない（警告だけ出して exit 0）。段そのものが打ち切りや ssh の切断で失敗しても、
      # 後ろの移行・smoke・Finalize が流れるよう continue-on-error: true と command_timeout: 10m を付ける。
      # Actions のログに probe の行が無ければ、打ち切りかどうかをログで確かめ、必要なら command_timeout を上げる。
      - name: Start secretary-agent (ADR-1056)
        if: ${{ success() }}
        continue-on-error: true
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 10m
          script: |
            cd /home/ubuntu/salesanchor
            df -h / | tail -1
            if ! docker build -t astro-webapp-secretary-agent ./secretary-agent; then
              echo "::warning::secretary-agent のイメージを作れませんでした（アプリの反映には影響しません）"
              exit 0
            fi
            probe_rc=0
            docker run --rm --network astro-webapp_frontnet --read-only --cap-drop ALL --security-opt no-new-privileges:true astro-webapp-secretary-agent node /app/probe.mjs || probe_rc=$?
            if [ "$probe_rc" -eq 1 ]; then
              echo "::warning::K4 不合格: secretary-agent から DB か redis に届きました"
            elif [ "$probe_rc" -ne 0 ]; then
              echo "::warning::probe を流せませんでした（終了コード $probe_rc）"
            fi
            if [ ! -r /home/ubuntu/.config/salesanchor/secretary-agent.env ]; then
              echo "::warning::secretary-agent.env が読めないため secretary-agent を起こしません"
              exit 0
            fi
            docker compose -p astro-webapp-secretary -f docker-compose.secretary-agent.yml up -d --force-recreate --no-build \
              || echo "::warning::secretary-agent を起こせませんでした（アプリの反映には影響しません）"
            exit 0

      # SA-18 Phase2: salesanchor_app ロールの bootstrap（冪等）
      # migrations より前に実行する。ADMIN_DATABASE_URL を .env に注入。
      - name: Bootstrap salesanchor_app role (idempotent)
        # SA-18: 全デプロイで実行（冪等・副作用なし）。
        # migration 条件を外した理由: SA18_PHASE2_ENABLED=1 が .env にある場合、
        # stamp のみのデプロイでも Bootstrap が DATABASE_URL を salesanchor_app に更新して
        # --force-recreate でコンテナを切り替える必要があるため。
        if: ${{ success() }}
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: SALESANCHOR_APP_PASSWORD,ADMIN_DATABASE_URL
          script: |
            set -e
            cd /home/ubuntu/salesanchor
            # [1] salesanchor_app パスワード設定（冪等）
            docker exec astro-webapp-postgres-1 \
              psql -U jarvis -d jarvis_db -c \
              "ALTER ROLE salesanchor_app PASSWORD '${SALESANCHOR_APP_PASSWORD}';" \
              || echo "salesanchor_app role not yet created -- will be created in migrations"
            # [2] SA18_PHASE2_ENABLED=1 が .env に在れば DATABASE_URL を自動組み立て
            # 目的: PO が SALESANCHOR_APP_PASSWORD の値を VPS で直接打つ必要をなくす。
            # パスワードは GitHub Secret から inject するため .env / ログに平文で出ない。
            # set -x は無効（GitHub Actions はデフォルト off）。URL 自体も echo しない。
            # 冪等: フラグが無ければ何もしない（jarvis 接続のまま）。
            if grep -q '^SA18_PHASE2_ENABLED=1' .env 2>/dev/null; then
              _pgdb=$(grep '^POSTGRES_DB=' .env | cut -d= -f2- | head -1 | tr -d '[:space:]')
              _sa_url=$(python3 -c \
                "import urllib.parse,sys;p,d=sys.argv[1],sys.argv[2];print('postgresql+asyncpg://salesanchor_app:{}@postgres:5432/{}'.format(urllib.parse.quote(p,safe=''),urllib.parse.quote(d,safe='')))" \
                "${SALESANCHOR_APP_PASSWORD}" "${_pgdb}")
              # SA-18: 二重 blue-green 排除 — URL が実際に変わった場合のみ実行
              _old_url=$(grep '^DATABASE_URL=' .env | head -1 | cut -d= -f2-)
              sed -i '/^DATABASE_URL=/d' .env
              echo "DATABASE_URL=${_sa_url}" >> .env
              echo "ℹ️  SA18_PHASE2_ENABLED=1 → DATABASE_URL を salesanchor_app@postgres:5432 に設定しました"
              _url_changed="false"
              [ "${_old_url}" != "${_sa_url}" ] && _url_changed="true"
              unset _sa_url _old_url  # URL(パスワード含)を環境変数から即削除
              if [ "${_url_changed}" = "true" ]; then
                # DATABASE_URL が変更 → backend/celery/discord を再起動する。
                # --force-recreate ではなく blue-green で無停止切替する（ダウンタイム排除）。
                # celery/discord は非同期・非ユーザー向けのため従来の force-recreate を維持。
                echo "ℹ️  SA18: DATABASE_URL が変更 → blue-green で backend を再起動します..."
                BG_HEALTH_TIMEOUT=90 bash scripts/blue-green-cutover.sh
                echo "ℹ️  SA18: celery/discord を --force-recreate で切替..."
                docker compose up -d --force-recreate celery-worker celery-beat discord-gateway
              else
                echo "ℹ️  SA18: DATABASE_URL 変更なし → blue-green をスキップ（切替1回のみ）"
              fi
            fi
            # [2b] ADMIN_DATABASE_URL を .env に注入（migration の run_py 用）
            case "${ADMIN_DATABASE_URL}" in
              *"'"*|*$'\n'*) echo "❌ ADMIN_DATABASE_URL に単一引用符か改行がある（値は出さない）"; exit 1 ;;
            esac
            sed -i '/^ADMIN_DATABASE_URL=/d' .env
            echo "ADMIN_DATABASE_URL='${ADMIN_DATABASE_URL}'" >> .env
            # ADR-130: Bootstrap 完了後に nginx reload（belt-and-suspenders）
            # blue-green cutover 内で既に reload 済みだが、将来の Bootstrap 変更でも
            # 確実に nginx DNS キャッシュがリフレッシュされるよう明示的に追加する。
            docker exec astro-webapp-nginx-1 nginx -s reload
            echo "nginx reload done (bootstrap post, ADR-130)."
        env:
          SALESANCHOR_APP_PASSWORD: ${{ secrets.SALESANCHOR_APP_PASSWORD }}
          ADMIN_DATABASE_URL: ${{ secrets.ADMIN_DATABASE_URL }}

      - name: Run database migrations
        id: migrate
        if: ${{ success() && steps.gate.outputs.migrations == 'true' }}
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 10m
          script: |
            set -e
            echo "============================================"
            echo "Running database migrations..."
            echo "============================================"

            cd /home/ubuntu/salesanchor
            if [ -f scripts/deploy-db-orphan-cleanup.sh ]; then bash scripts/deploy-db-orphan-cleanup.sh; else echo ">>> [cleanup] skipped: script not present (old checkout)"; fi
            bash scripts/run_all_migrations.sh

            echo "============================================"
            echo "Migrations done."
            echo "============================================"

      # deploy-db-stall §16-5: 控え・移行の段が失敗・取り消し（時間切れ・手で止めた回を含む）になったとき、
      # サーバーに残った取り残しをすぐ片付ける。手で止めた回の outcome は cancelled（failure() は偽）。
      - name: Clean up DB orphans after failure
        if: ${{ always() && (steps.backup.outcome == 'failure' || steps.backup.outcome == 'cancelled' || steps.migrate.outcome == 'failure' || steps.migrate.outcome == 'cancelled') }}
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 5m
          script: |
            set -e
            cd /home/ubuntu/salesanchor
            if [ -f scripts/deploy-db-orphan-cleanup.sh ]; then bash scripts/deploy-db-orphan-cleanup.sh; else echo ">>> [cleanup] skipped: script not present (old checkout)"; fi

      # SA-19: Post-deploy smoke tests (SA-18 Phase2)
      - name: Post-deploy smoke tests (SA-19)
        if: ${{ success() && steps.gate.outputs.migrations == 'true' }}
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: SALESANCHOR_APP_PASSWORD
          script: |
            cd /home/ubuntu/salesanchor
            bash scripts/smoke_test_post_deploy.sh
        env:
          SALESANCHOR_APP_PASSWORD: ${{ secrets.SALESANCHOR_APP_PASSWORD }}

      # ADR-124: FedEx Rates live smoke（第1段完了条件）
      # FEDEX_SMOKE_ENABLED=true になるまで休眠（スイッチOFF = 常時 skip）。
      # 失敗はジョブ失敗（continue-on-error: false）だがロールバック非連動。
      # FedEx障害／credential未登録は自動ロールバック対象外（R4判断）。
      # FedEx live smoke が壊れた版を本番に残さない保証は:
      #   ①コードバグ → /api/health が落ちる → 既存ロールバックが捕捉
      #   ②FedEx側障害・credential未登録 → Discord 即時通知 → 人が確認
      - name: FedEx Rates live smoke (ADR-124 D2)
        if: ${{ success() }}
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: SALESANCHOR_API_TOKEN,SALESANCHOR_API_URL,ROLLBACK_DISCORD_WEBHOOK,PO_LIVE_OK,FEDEX_SMOKE_ENABLED
          script: |
            set -e
            cd /home/ubuntu/salesanchor

            if [ "${FEDEX_SMOKE_ENABLED:-false}" != "true" ]; then
              echo "ℹ️  FEDEX_SMOKE_ENABLED が 'true' でないため FedEx live smoke をスキップ（ADR-124 D2）"
              exit 0
            fi

            set +e
            bash scripts/smoke/external-fedex.sh --live
            _fedex_exit=$?
            set -e

            if [ "${_fedex_exit}" -ne 0 ]; then
              _webhook="${ROLLBACK_DISCORD_WEBHOOK:-}"
              if [ -n "${_webhook}" ]; then
                curl -s -X POST "${_webhook}" \
                  -H "Content-Type: application/json" \
                  -d '{"content":"🚨 **FedEx live smoke 失敗** — アプリ稼働中ですが本番 FedEx ライブ見積もりが取得できません。FedEx 障害／認証情報未登録／コードバグを確認してください（ADR-124 D2）。","username":"Deploy Bot"}' \
                  || true
              fi
              exit 1
            fi

            echo "✅ FedEx live smoke passed"
        env:
          SALESANCHOR_API_TOKEN: ${{ secrets.FEDEX_SMOKE_API_TOKEN }}
          SALESANCHOR_API_URL: https://api.salesanchor.jp
          ROLLBACK_DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_OWNER_PING }}
          PO_LIVE_OK: "yes"
          FEDEX_SMOKE_ENABLED: ${{ secrets.FEDEX_SMOKE_ENABLED }}

      # ADR-082: ヘルスチェック・監視確認・イメージ prune はマイグレーション skip 時も
      # 必ず走らせる必要があるため、マイグレーションから分離して常時実行する。
      # （フロントのみのデプロイでも本番の健全性検証が抜けない）
      - name: Finalize (health check + cleanup)
        if: always()
        uses: appleboy/ssh-action@v1
        env:
          # ADR-115: ロールバック Discord 通知用 webhook
          # DISCORD_WEBHOOK_OWNER_PING を使用（ADMIN_NOTIFICATION_DISCORD_WEBHOOK は未登録のため）
          ROLLBACK_DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_OWNER_PING }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: ROLLBACK_DISCORD_WEBHOOK
          script: |
            set -e
            cd /home/ubuntu/salesanchor

            if [ "${{ steps.gate.outputs.migrations }}" != "true" ]; then
              echo "ℹ️  ADR-082: backend/migration 変更なし → DB マイグレーションは skip しました（フロントのみのデプロイ）。"
            fi

            echo "Step 6: Health check (with auto-rollback)..."
            # ADR-115: ヘルスチェック失敗時は PREV_SHA に自動ロールバックする。
            # set -e を一時解除してヘルスチェックの非0 exit を捕捉する。
            # backend は起動まで最大 ~120s かかるため 36×5s=180s でリトライする（単発チェック廃止）。
            set +e
            _health_exit=1
            for _hc_i in $(seq 1 36); do
              docker exec astro-webapp-backend-1 python -c "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')" 2>/dev/null
              _health_exit=$?
              [ "${_health_exit}" -eq 0 ] && break
              echo "  ...waiting (${_hc_i}/36)..."
              sleep 5
            done
            set -e

            if [ "${_health_exit}" -ne 0 ]; then
              echo "❌ Health check failed — starting auto-rollback..."
              PREV_SHA=$(cat .deploy_prev_sha 2>/dev/null || echo "")
              _rollback_result="failed"

              if [ -n "${PREV_SHA}" ]; then
                echo "→ Rolling back to ${PREV_SHA:0:7}..."
                git reset --hard "${PREV_SHA}"

                # SA-18: ロールバック時は DATABASE_URL を jarvis に戻し Phase2 フラグを削除する。
                # .env は gitignore されているため git reset --hard では変更されない → 手動復元必須。
                # これにより旧コード（Phase2 非対応）が salesanchor_app で繋いで RLS に詰まる誤りを防ぐ。
                _pguser_rb=$(grep '^POSTGRES_USER=' .env | cut -d= -f2- | head -1 | tr -d '[:space:]')
                _pgpass_rb=$(grep '^POSTGRES_PASSWORD=' .env | cut -d= -f2- | head -1 | tr -d '\r\n')
                _pgdb_rb=$(grep '^POSTGRES_DB=' .env | cut -d= -f2- | head -1 | tr -d '[:space:]')
                _rb_durl=$(python3 -c "import urllib.parse,sys;u,p,d=sys.argv[1],sys.argv[2],sys.argv[3];print('postgresql+asyncpg://{}:{}@postgres:5432/{}'.format(urllib.parse.quote(u,safe=''),urllib.parse.quote(p,safe=''),d))" "${_pguser_rb}" "${_pgpass_rb}" "${_pgdb_rb}")
                sed -i '/^DATABASE_URL=/d' .env
                echo "DATABASE_URL=${_rb_durl}" >> .env
                sed -i '/^SA18_PHASE2_ENABLED=/d' .env
                echo "ℹ️  ロールバック: DATABASE_URL を jarvis@postgres:5432 に復元、SA18_PHASE2_ENABLED を削除"

                # 旧コードでビルド（最大3回リトライ）
                _rb_build=false
                for _attempt in 1 2 3; do
                  if docker compose build 2>&1; then
                    _rb_build=true
                    break
                  fi
                  echo "Rollback build attempt ${_attempt} failed. 15秒後にリトライ..."
                  sleep 15
                done

                if [ "${_rb_build}" = "true" ]; then
                  # コンテナ差し替え（通常デプロイと同じパターン）
                  # oneoff=False のみ消す（compose run の一時コンテナを消さない。docs/handoff/deploy-keep-oneoff/recon.md）
                  for _svc in backend frontend celery-worker celery-beat discord-gateway; do
                    docker ps -a --filter "name=astro-webapp-${_svc}" --filter "label=com.docker.compose.oneoff=False" --format "{{.ID}}" | xargs -r docker rm -f 2>/dev/null || true
                  done
                  docker compose up -d --remove-orphans

                  # 旧コンテナが healthy になるまで最大 180s 待つ（backend 起動 ~120s + 60s margin）
                  echo "Waiting for rollback to stabilize (max 180s)..."
                  for _i in $(seq 1 36); do
                    sleep 5
                    if docker exec astro-webapp-backend-1 \
                        python -c "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')" \
                        2>/dev/null; then
                      _rollback_result="success"
                      break
                    fi
                    echo "  ...waiting (${_i}/36)..."
                  done
                fi
              fi

              # Discord 通知（GitHub Secrets 経由の env var → .env フォールバック）
              _webhook="${ROLLBACK_DISCORD_WEBHOOK:-$(grep '^ADMIN_NOTIFICATION_DISCORD_WEBHOOK=' .env 2>/dev/null | cut -d= -f2- | tr -d "'")}"
              if [ -n "${_webhook}" ]; then
                if [ "${_rollback_result}" = "success" ]; then
                  curl -s -X POST "${_webhook}" \
                    -H "Content-Type: application/json" \
                    -d "{\"content\":\"⚠️ **デプロイ失敗→自動ロールバック成功**\\nコミット \`${PREV_SHA:0:7}\` に自動復帰。本番は UP。手動確認をお願いします。\",\"username\":\"Deploy Bot\"}" \
                    || true
                  echo "✅ 自動ロールバック成功: ${PREV_SHA:0:7} に復帰（deploy job は失敗扱い）"
                else
                  curl -s -X POST "${_webhook}" \
                    -H "Content-Type: application/json" \
                    -d "{\"content\":\"🚨 **自動ロールバック失敗・手動対応要** 🚨\\nデプロイも復帰も失敗しました。本番が DOWN の可能性があります。即時確認をお願いします。\",\"username\":\"Deploy Bot\"}" \
                    || true
                  echo "❌ 自動ロールバック失敗 — 手動対応が必要"
                fi
              fi

              # ロールバック成功でも失敗でも deploy job は非0 exit（本番は UP でも問題を通知）
              exit 1
            fi
            echo "✅ Step 6: Health check passed"

            echo "Step 7: Checking container status..."
            docker compose ps

            echo "Step 7b: Monitoring stack health check..."
            # prometheus が起動しているか確認
            if docker ps --format '{{.Names}}' | grep -q 'prometheus'; then
              echo "  ✅ Prometheus container running"
              # backend /metrics エンドポイントが有効か（コンテナ内から確認）
              docker exec astro-webapp-backend-1 python -c \
                "import urllib.request; r=urllib.request.urlopen('http://localhost:8000/metrics'); print('  ✅ /metrics status:', r.status)" \
                || echo "  ⚠️  /metrics not yet available (will be scraped after first request)"
            else
              echo "  ℹ️  Prometheus not running in this stack (monitoring stack may be separate)"
            fi
            # grafana が起動しているか確認
            if docker ps --format '{{.Names}}' | grep -q 'grafana'; then
              echo "  ✅ Grafana container running"
            else
              echo "  ℹ️  Grafana not running in this stack"
            fi

            echo "Step 8: Cleaning up old Docker images..."
            docker image prune -f

            echo "Step 8b: Cleaning up Docker build cache (keep 3GB)..."
            # 2026-10-02 prod1 ディスクフル事故の再発防止（ADR-135/136）:
            # build cache が無制限に溜まるのを防ぐ。
            # 本番 docker 29.4.0 で --help に記載のある --max-used-space を使用、2026-10-02 確認。
            docker builder prune -f --max-used-space 3GB || true

            echo "============================================"
            echo "Deployment completed successfully!"
            echo "============================================"

      # ADR-1052 段2 #9 の 1b: Recreate nginx は continue-on-error で後ろの手順（Bootstrap・移行・smoke・Finalize）を
      # 今と同じに流す。その代わり、Finalize の後ここで止めて、デプロイ全体を失敗の表示にする（Verify は動かない）。
      # 失敗の知らせは GitHub の既定のものだけ（PO と Opus への知らせは段4）。
      - name: Fail if nginx recreate failed
        if: ${{ always() && steps.nginx_recreate.outcome == 'failure' }}
        run: |
          echo "::error::nginx の作り直しの手順が失敗しました（戻り先の用意・点検・後の確認のどれか）"
          exit 1

      - name: Verify deployment
        if: success()
        uses: appleboy/ssh-action@v1
        env:
          DESIGN_SITE_SMOKE_CRED: ${{ secrets.DESIGN_SITE_SMOKE_CRED }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: DESIGN_SITE_SMOKE_CRED
          script: |
            set -e
            curl -sf https://jarvis-claude.uk/api/health || echo "External health check warning"

            # ADR-045: migration 055 (granted_scopes) 適用検証
            #   全 active テナントスキーマで tenant_meta_config.granted_scopes 列が
            #   存在し、かつ NULL のレコードが残っていないことを確認する。
            #   missing/NULL が 1 件でもあれば RAISE EXCEPTION で本ステップを失敗させる。
            echo "Verifying ADR-045 migration 055 (granted_scopes)..."
            docker exec -i astro-webapp-postgres-1 \
              psql -U jarvis -d jarvis_db -v ON_ERROR_STOP=1 <<'VERIFY_EOF'
            DO $$
            DECLARE
                r RECORD;
                missing_col_count INT := 0;
                null_rows_total INT := 0;
                cnt INT;
            BEGIN
                FOR r IN
                    SELECT
                        id,
                        tenant_code,
                        format('tenant_%s', lpad(id::text, 3, '0')) AS schema
                    FROM public.tenants
                    WHERE is_active = true
                    ORDER BY id
                LOOP
                    IF NOT EXISTS (
                        SELECT 1 FROM information_schema.tables
                        WHERE table_schema = r.schema
                          AND table_name = 'tenant_meta_config'
                    ) THEN
                        CONTINUE;
                    END IF;

                    IF NOT EXISTS (
                        SELECT 1 FROM information_schema.columns
                        WHERE table_schema = r.schema
                          AND table_name = 'tenant_meta_config'
                          AND column_name = 'granted_scopes'
                    ) THEN
                        RAISE WARNING 'Missing granted_scopes column: schema=% tenant_code=%',
                            r.schema, r.tenant_code;
                        missing_col_count := missing_col_count + 1;
                        CONTINUE;
                    END IF;

                    EXECUTE format(
                        'SELECT COUNT(*) FROM %I.tenant_meta_config WHERE granted_scopes IS NULL',
                        r.schema
                    ) INTO cnt;
                    IF cnt > 0 THEN
                        RAISE WARNING 'NULL granted_scopes rows: schema=% tenant_code=% count=%',
                            r.schema, r.tenant_code, cnt;
                        null_rows_total := null_rows_total + cnt;
                    END IF;
                END LOOP;

                IF missing_col_count > 0 OR null_rows_total > 0 THEN
                    RAISE EXCEPTION
                        'ADR-045 verification failed: missing_col=% null_rows=%',
                        missing_col_count, null_rows_total;
                END IF;

                RAISE NOTICE 'ADR-045 verification OK';
            END
            $$;
            VERIFY_EOF

            # ── SA設計図書サイト smoke（ADR-134）────────────────────
            echo "Design-site smoke: 認証なし=401 チェック..."
            _ds_401=$(curl -s -o /dev/null -w "%{http_code}" \
              --max-time 10 https://app.salesanchor.jp/design/ 2>/dev/null || echo "FAIL")
            if [ "$_ds_401" != "401" ]; then
              echo "❌ Design-site smoke FAIL: expected 401 without auth, got ${_ds_401}"
              exit 1
            fi
            echo "✅ Design-site: 認証なし → 401 確認"

            echo "Design-site smoke: 認証あり=200 + progress.json チェック..."
            DESIGN_SMOKE_CRED="${DESIGN_SITE_SMOKE_CRED}" \
              bash /home/ubuntu/salesanchor/scripts/smoke/design-site-smoke.sh

      # ADR-116: main デプロイ成功スタンプ（manifest 対象 PR のみ）
      # smoke/health 200 + Verify deployment が全通過した"成功側"のみ実行する。
      # manifest が取れない場合は全件スタンプしない（warningのみ）。
      - name: Stamp main deploy date in active-work.md
        if: success()
        continue-on-error: true
        env:
          PIPELINE_PAT: ${{ secrets.PIPELINE_PAT }}
          GH_TOKEN: ${{ secrets.PIPELINE_PAT }}
          DEPLOY_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          DEPLOY_DATE=$(date -u +%Y-%m-%d)
          export DEPLOY_DATE

          # ── release PR 番号を merge commit から取得 ──────────────────────
          git fetch origin develop main

          # main の最新 merge commit から PR 番号を探す
          RELEASE_PR_NUM=$(git log origin/main -1 --merges --format="%s %b" \
            | grep -oE '#[0-9]+' | tr -d '#' | head -1 || true)

          if [ -z "$RELEASE_PR_NUM" ]; then
            # fallback: gh で develop→main の最新マージ済み PR を探す
            RELEASE_PR_NUM=$(gh pr list \
              --base main --head develop --state merged \
              --json number --jq '.[0].number' 2>/dev/null || true)
          fi

          if [ -z "$RELEASE_PR_NUM" ]; then
            echo "⚠️ release PR 番号が取得できませんでした — stamp をスキップします（全件stamp禁止）"
            exit 0
          fi

          echo "release PR: #${RELEASE_PR_NUM}"

          # ── release PR 本文から manifest を抽出 ─────────────────────────
          PR_BODY=$(gh pr view "$RELEASE_PR_NUM" --json body -q '.body' 2>/dev/null || true)

          # 注意: python3 -c の継続行は YAML リテラルブロックの最低インデント（10sp）を
          # 下回ってはならない。YAML パーサーがブロックスカラーを早期終了させるため。
          MANIFEST_PR_NUMS=$(echo "$PR_BODY" \
            | python3 -c "
          import sys, re
          body = sys.stdin.read()
          m = re.search(r'<!-- active-work-release-manifest\s+prs:\s+(.*?)(?:branches:|-->)', body, re.DOTALL)
          if not m:
              sys.exit(0)
          for line in m.group(1).splitlines():
              line = line.strip()
              if re.match(r'^- \d+\$', line):
                  print(line.lstrip('- ').strip())
          " 2>/dev/null || true)

          if [ -z "$MANIFEST_PR_NUMS" ]; then
            echo "⚠️ release PR #${RELEASE_PR_NUM} に manifest ブロックが見つかりません — stamp をスキップします"
            exit 0
          fi

          echo "manifest PR 一覧:"
          echo "${MANIFEST_PR_NUMS}"

          # manifest の PR 番号からブランチ名を収集
          MANIFEST_BRANCHES=""
          for num in $MANIFEST_PR_NUMS; do
            branch=$(gh pr view "$num" --json headRefName -q '.headRefName' 2>/dev/null || true)
            if [ -n "$branch" ]; then
              MANIFEST_BRANCHES="${MANIFEST_BRANCHES}${branch}"$'\n'
            fi
          done

          export MANIFEST_BRANCHES
          export DEPLOY_RUN_URL

          # ── develop ブランチで stamp を実行 ──────────────────────────────
          git checkout -b "stamp-develop-${{ github.run_id }}" origin/develop

          python3 - <<'PYEOF'
          import os
          deploy_date = os.environ["DEPLOY_DATE"]
          manifest_branches = set(
              b.strip() for b in os.environ.get("MANIFEST_BRANCHES", "").splitlines()
              if b.strip()
          )
          deploy_run_url = os.environ.get("DEPLOY_RUN_URL", "")
          filepath = ".claude-pipeline/active-work.md"

          print(f"manifest branches: {manifest_branches}")

          with open(filepath, encoding="utf-8") as f:
              content = f.read()

          lines = content.splitlines(keepends=True)
          new_lines = []
          updated = 0

          for line in lines:
              if line.strip().startswith("|"):
                  parts = line.rstrip("\n").split("|")
                  cols = parts[1:-1]
                  is_sep = all(c.strip().replace("-", "") == "" for c in cols if c.strip())
                  branch = cols[0].strip() if cols else ""
                  if (len(cols) == 7 and not is_sep and
                          "DONE" in cols[3] and cols[5].strip() == "" and
                          branch in manifest_branches):
                      cols[5] = f" {deploy_date} "
                      # 備考に deploy run URL を追記
                      existing_note = cols[6].strip()
                      run_note = f"deploy:{deploy_run_url}"
                      if run_note not in existing_note:
                          cols[6] = f" {(existing_note + ' ') if existing_note else ''}{run_note} "
                      eol = "\n" if line.endswith("\n") else ""
                      line = "|".join([""] + cols + [""]) + eol
                      updated += 1
              new_lines.append(line)

          if updated:
              with open(filepath, "w", encoding="utf-8") as f:
                  f.write("".join(new_lines))
              print(f"STAMPED {updated} rows with main:{deploy_date}")
          else:
              print(f"No rows to stamp (manifest has {len(manifest_branches)} branches, none matched DONE+main空欄)")
          PYEOF

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet .claude-pipeline/active-work.md; then
            echo "No changes to commit"
            exit 0
          fi
          git add .claude-pipeline/active-work.md
          git commit -m "chore: active-work.md — main deploy stamp ${DEPLOY_DATE}（自動）"
          git pull --rebase origin develop
          git push \
            "https://x-access-token:${PIPELINE_PAT}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:refs/heads/develop

      # ============================================
      # ADR-134 D: smoke④ FAIL 時の自動 /design/ 遮断
      # Verify deployment（design-site smoke を含む）が失敗した場合、
      # htpasswd ファイルを削除して nginx を再作成する。
      # nginx は auth_basic_user_file が存在しない場合 500 を返す（fail-closed）。
      # 次回 deploy 成功時に htpasswd が再生成されて自動復旧する。
      # ============================================
      - name: Emergency block /design/ on smoke FAIL (ADR-134 D)
        if: failure()
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            HTPASSWD=/home/ubuntu/salesanchor/nginx/htpasswd.d/design-site
            echo "🚨 Smoke FAIL検出 — /design/ を緊急遮断します"
            rm -f "${HTPASSWD}"
            cd /home/ubuntu/salesanchor
            # ADR-1052 段2 #9 の 1c: 点検に通らない設定で作り直さない（第3版の審査 H1）。
            # 作業の写しの設定は nginx -t しか通っていない、または点検もしていない回がある
            # （Recreate が飛んだ回・Finalize の自動ロールバックの後・good が無い回）。
            # 最後に後の確認まで通った設定（.deploy_nginx_good.conf）があれば、作業の写しをそれに替えてから点検する。
            # 作業の写しは次のデプロイの reset で戻る。
            if [ -s .deploy_nginx_good.conf ]; then
              cp .deploy_nginx_good.conf nginx/nginx.conf
              echo "ℹ️  作業の写しの nginx.conf を最後に起きた設定（.deploy_nginx_good.conf）に替えました"
            else
              echo "ℹ️  .deploy_nginx_good.conf が無いため、作業の写しの nginx.conf のまま点検します（点検だけ通った設定で作り直すことになります）"
            fi
            if ! docker compose run --rm --no-deps -T nginx nginx -t; then
              echo "::warning::nginx の設定が点検に通らないため作り直しません"
            else
              docker compose up -d --no-deps --force-recreate nginx
              # 作り直しの後の確認（#9 の 1 の 5 と同じ形）。この手順は失敗の中なので、落ちても戻す先は無い。結果は記録に残すだけ
              _c_i=1
              while [ "${_c_i}" -le 15 ]; do
                _running=$(docker inspect --format='{{.State.Running}}' astro-webapp-nginx-1 2>/dev/null)
                _code=$(curl -sk -o /dev/null -w '%{http_code}' --max-time 5 --resolve app.salesanchor.jp:443:127.0.0.1 https://app.salesanchor.jp/ 2>/dev/null)
                echo "  確認 ${_c_i}/15: running=${_running} http=${_code}"
                if [ "${_running}" = "true" ] && [ -n "${_code}" ] && [ "${_code}" != "000" ]; then
                  echo "✅ nginx の確認が通りました（http=${_code}）"
                  break
                fi
                sleep 1
                _c_i=$((_c_i + 1))
              done
              if [ "${_c_i}" -gt 15 ]; then
                echo "::warning::nginx の作り直しの後の確認が 15 秒の間に通りませんでした（戻す先はありません。結果の記録のみ）"
              fi
            fi
            sleep 3
            _block=$(curl -s -o /dev/null -w "%{http_code}" \
              --max-time 10 https://app.salesanchor.jp/design/ 2>/dev/null || echo "FAIL")
            echo "✅ /design/ 遮断後ステータス: ${_block}（期待値: 500 または 401）"

      - name: Deployment Failure Notification
        if: failure()
        run: |
          echo "Deployment failed!"
          echo "Please check the logs above for details."
          exit 1
