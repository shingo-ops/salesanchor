name: Monitoring Stack Check

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
# NOTE: paths フィルタ削除（e2e.yml #534 と同じデッドロック回避）。
# Required check として Ruleset に登録した場合、paths フィルタがあると
# 関係ないファイルしか変更しない PR で "Expected" のまま pending → merge 不可になる。
# detect-changes step で変更ファイルを判定し、不要時はスキップ（即 pass）する。

jobs:
  monitoring-check:
    name: 監視スタック整合性チェック
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 監視関連ファイル変更検出
        id: changes
        run: |
          BASE="${{ github.event.pull_request.base.sha || 'HEAD~1' }}"
          CHANGED=$(git diff --name-only "$BASE"...HEAD 2>/dev/null || git diff --name-only HEAD~1 HEAD)
          if echo "$CHANGED" | grep -qE "^(monitoring/|docker-compose(\.monitoring|\.exporters)?\.yml|\.env(\.monitoring)?\.example|\.github/workflows/monitoring-check\.yml|docs/runbooks/alerts\.md|scripts/ops/container_state\.py|scripts/tests/test_container_state\.py)"; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
            echo "監視関連ファイルの変更なし — チェックをスキップして即 pass"
          fi

      - name: Setup Python
        if: steps.changes.outputs.relevant == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyYAML
        if: steps.changes.outputs.relevant == 'true'
        run: pip install pyyaml

      - name: tokens.yml 構文チェック
        if: steps.changes.outputs.relevant == 'true'
        run: python3 -c "import yaml; yaml.safe_load(open('monitoring/tokens.yml'))"

      - name: SSoT整合性・バージョン固定・healthcheckチェック
        if: steps.changes.outputs.relevant == 'true'
        run: python3 monitoring/scripts/validate_tokens.py

      - name: Grafana ナビゲーション同期チェック（nav-config.json SSoT）
        if: steps.changes.outputs.relevant == 'true'
        run: node monitoring/grafana/generate-nav.js --check

      - name: アラートルールの札・手順書リンク検査
        if: steps.changes.outputs.relevant == 'true'
        run: python3 monitoring/scripts/check_alert_rules.py

      - name: アプリの健康診断の欠け検査と状態書き係の試験（ADR-1012 段階3 定着便 T1）
        if: steps.changes.outputs.relevant == 'true'
        run: |
          python3 monitoring/scripts/check_app_healthchecks.py
          python3 monitoring/scripts/tests/test_check_app_healthchecks.py -v
          python3 scripts/tests/test_container_state.py -v
          python3 monitoring/recovery-check/tests/test_recovery_check.py -v

      - name: Prometheus ルール構文と単体試験（promtool）
        if: steps.changes.outputs.relevant == 'true'
        run: |
          # docker-compose.monitoring.yml:5 と同じ版
          docker run --rm -v "$PWD/monitoring/prometheus:/r:ro" --entrypoint promtool prom/prometheus:v3.11.3 check rules /r/alert_rules.yml
          docker run --rm -v "$PWD/monitoring/prometheus:/r:ro" --entrypoint promtool prom/prometheus:v3.11.3 test rules /r/tests/alert_rules_test.yml

      - name: Alertmanager 設定検査（amtool）
        if: steps.changes.outputs.relevant == 'true'
        run: |
          # docker-compose.monitoring.yml:177 と同じ版
          docker run --rm -v "$PWD/monitoring/alertmanager:/a:ro" --entrypoint amtool prom/alertmanager:v0.28.1 check-config /a/alertmanager.yml

      - name: Alertmanager 送り先の試験（amtool routes test）
        if: steps.changes.outputs.relevant == 'true'
        run: |
          # どの通知も Discord と保守 API の両方に届くこと（ADR-1012 段階2 便C）
          # ただし RecoveryCheckPassed（復旧後の点検の ✅）だけは Discord にだけ届くこと（outage-recovery-watch 便2）
          docker run --rm -v "$PWD/monitoring/alertmanager:/a:ro" --entrypoint amtool prom/alertmanager:v0.28.1 config routes test --config.file=/a/alertmanager.yml --verify.receivers=discord-server-alerts,ops-api alertname=CiRoutesTest
          docker run --rm -v "$PWD/monitoring/alertmanager:/a:ro" --entrypoint amtool prom/alertmanager:v0.28.1 config routes test --config.file=/a/alertmanager.yml --verify.receivers=discord-server-alerts,ops-api alertname=CiRoutesTest severity=critical job=node
          docker run --rm -v "$PWD/monitoring/alertmanager:/a:ro" --entrypoint amtool prom/alertmanager:v0.28.1 config routes test --config.file=/a/alertmanager.yml --verify.receivers=discord-recovery-info alertname=RecoveryCheckPassed
          docker run --rm -v "$PWD/monitoring/alertmanager:/a:ro" --entrypoint amtool prom/alertmanager:v0.28.1 config routes test --config.file=/a/alertmanager.yml --verify.receivers=discord-server-alerts,ops-api alertname=RecoveryCheckFailed severity=critical

      - name: Loki ルール構文検査（lokitool）
        if: steps.changes.outputs.relevant == 'true'
        run: |
          # docker-compose.monitoring.yml:198 の grafana/loki:3.7.2 と同じ版
          curl -fsSL -o /tmp/lokitool.zip https://github.com/grafana/loki/releases/download/v3.7.2/lokitool-linux-amd64.zip
          echo "572fe8adfc919a12a02a6c9f5b0509a7cd1071156d524777fe73428bc0fcbffc  /tmp/lokitool.zip" | sha256sum -c -
          unzip -o /tmp/lokitool.zip -d /tmp/lokitool
          chmod +x /tmp/lokitool/lokitool-linux-amd64
          /tmp/lokitool/lokitool-linux-amd64 rules check monitoring/loki/rules/jarvis/alerts.yml
