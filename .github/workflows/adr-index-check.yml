name: ADR Index Check

on:
  pull_request:
    branches: [main, develop]
  merge_group:
    types: [checks_requested]
    branches: [main]

jobs:
  check:
    name: ADR index is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check if ADR files changed
        id: adr_changed
        env:
          DIFF_BASE: ${{ github.event_name == 'merge_group' && github.event.merge_group.base_sha || format('origin/{0}', github.base_ref) }}
        run: |
          git diff --name-only "${DIFF_BASE}...HEAD" \
            | grep -qE '^docs/adr/ADR-.*\.md$|^docs/adr/README\.md$|^scripts/generate-adr-index\.js$' \
            && echo "changed=true" >> "$GITHUB_OUTPUT" \
            || echo "changed=false" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v5
        if: steps.adr_changed.outputs.changed == 'true'
        with:
          node-version: '22'

      - name: Check ADR index is up to date
        if: steps.adr_changed.outputs.changed == 'true'
        run: node scripts/generate-adr-index.js --check

      - name: No ADR files changed — skip
        if: steps.adr_changed.outputs.changed == 'false'
        run: echo "✅ ADR ファイルの変更なし — インデックスチェックをスキップ"
