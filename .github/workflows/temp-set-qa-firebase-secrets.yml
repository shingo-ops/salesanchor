name: "[temp] Set QA Firebase UID Secrets"

# 一時ワークフロー: QA Smoke用 Firebase UID を DB から取得してSecretに登録
# 使用後は削除すること（PRマージ前に削除済みであること）
on:
  workflow_dispatch:

jobs:
  set-qa-firebase-secrets:
    runs-on: [self-hosted, salesanchor-vps]
    steps:
      - name: Fetch Firebase UIDs from tenant_006.staff and register as Secrets
        env:
          GH_TOKEN: ${{ secrets.PIPELINE_PAT }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          # SSH 鍵を一時ファイルへ展開
          KEYFILE=$(mktemp)
          chmod 600 "$KEYFILE"
          printf '%s' "$SSH_KEY" > "$KEYFILE"

          SSH="ssh -i $KEYFILE -o StrictHostKeyChecking=no -o BatchMode=yes ${VPS_USER}@${VPS_HOST}"

          _exec_psql() {
            $SSH "cd /home/ubuntu/salesanchor && docker compose exec -T backend bash -c \
              'PSQL_URL=\"\${DATABASE_URL/postgresql+asyncpg:/postgresql:}\" && \
               psql \"\$PSQL_URL\" -Atc \"$1\"'"
          }

          # staff_code で QA ユーザーの firebase_uid を取得
          ADMIN_UID=$(_exec_psql \
            "SELECT firebase_uid FROM tenant_006.staff WHERE staff_code='QA-ADMIN-001' LIMIT 1;")
          STAFF_UID=$(_exec_psql \
            "SELECT firebase_uid FROM tenant_006.staff WHERE staff_code='QA-STAFF-001' LIMIT 1;")
          VIEWER_UID=$(_exec_psql \
            "SELECT firebase_uid FROM tenant_006.staff WHERE staff_code='QA-VIEWER-001' LIMIT 1;")

          # 空値チェック
          if [[ -z "$ADMIN_UID" || -z "$STAFF_UID" || -z "$VIEWER_UID" ]]; then
            echo "ERROR: One or more Firebase UIDs are empty. tenant_006.staff may not be seeded."
            echo "  QA-ADMIN-001 found: $([ -n "$ADMIN_UID" ] && echo yes || echo NO)"
            echo "  QA-STAFF-001 found: $([ -n "$STAFF_UID" ] && echo yes || echo NO)"
            echo "  QA-VIEWER-001 found: $([ -n "$VIEWER_UID" ] && echo yes || echo NO)"
            exit 1
          fi

          # 値をログからマスク（add-mask は値が確定してから）
          echo "::add-mask::$ADMIN_UID"
          echo "::add-mask::$STAFF_UID"
          echo "::add-mask::$VIEWER_UID"

          # Secret 登録（値はマスク済み）
          gh secret set QA_ADMIN_FIREBASE_UID  -b "$ADMIN_UID"  -R shingo-ops/salesanchor
          gh secret set QA_STAFF_FIREBASE_UID  -b "$STAFF_UID"  -R shingo-ops/salesanchor
          gh secret set QA_VIEWER_FIREBASE_UID -b "$VIEWER_UID" -R shingo-ops/salesanchor

          echo "All 3 QA Firebase UID secrets registered (values masked)"

          # SSH 鍵を削除
          rm -f "$KEYFILE"
