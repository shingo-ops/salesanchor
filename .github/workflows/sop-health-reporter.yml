name: SOP Health Reporter

# ADR-124: SOP 遵守指標 5 件を週次収集し Prometheus Pushgateway → Grafana へ push する
# ゼロ許容条件（宿題期限超過）検知時は Discord に即通知する

on:
  schedule:
    - cron: '0 0 * * 1'  # 毎週月曜 00:00 UTC = JST 09:00
  workflow_dispatch:      # 手動実行（KPI テスト用）

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pull-requests: read
      issues: read
      actions: read

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Collect SOP health metrics and push to Prometheus
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUSHGATEWAY_URL: ${{ secrets.PUSHGATEWAY_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_SCHEDULED_REPORT }}
          REPO: ${{ github.repository }}
        run: node scripts/sop-health-collector.js
