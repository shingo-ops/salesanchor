name: Frontend Check

on:
  pull_request:
    paths:
      - 'frontend/**'
  # schedule 削除（2026-05-28）: PR の paths フィルタで十分にカバーされるため冗長。

jobs:
  check:
    name: Frontend lint & custom checks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Generate API types (tsc の前に schema.d.ts を生成)
        run: npm run generate:api-types
        working-directory: frontend

      - name: Viewer bundle check (閲覧ページの JS 300KB 以下・本体の辞書が混ざらない)
        run: |
          npx vite build --manifest
          node scripts/check-viewer-bundle.js
        working-directory: frontend

      - name: Verify check:all uses concurrently (退行防止)
        run: npm run check:concurrently
        working-directory: frontend

      - name: Run check:all (lint + custom scripts including check-page-layout)
        run: npm run check:all
        working-directory: frontend

      - name: TypeScript type check (navKey template literal enforcement)
        run: npx tsc --noEmit
        working-directory: frontend

      - name: 新規トークン追加の承認確認
        if: github.event_name == 'pull_request'
        run: npm run check:new-tokens
        working-directory: frontend
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
          GITHUB_HEAD_REF: ${{ github.head_ref }}
          PR_BODY: ${{ github.event.pull_request.body }}

      - name: Audit unused tokens (informational・非ブロック)
        run: npm run audit:unused-tokens
        working-directory: frontend
        continue-on-error: true

      # 画面の試験は e2e.yml の unit-run（必須チェック Lint & Dark Mode Check (ADR-067) の集約）へ移した（ADR-1020 便4d）

  # Storybook ビルドを check ジョブと並列実行（2026-06-01）。
  # Required Check ではないため分離して並列化しても PR ブロックへの影響なし。
  # frontend-check.yml 自体が on.pull_request.paths: ['frontend/**'] で起動を制限済み。
  storybook-build:
    name: Storybook build check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Storybook build check (story files must compile without errors)
        run: npm run build-storybook
        working-directory: frontend
