name: active-work auto-REVIEW（ADR-114）

# PR が develop に向けてオープンされた瞬間に active-work.md の行を REVIEW に更新する
# 担当: GitHub 側（原則 4: ノートの行を更新するのは GitHub 側）

on:
  pull_request:
    types: [opened, reopened, ready_for_review]
    branches: [develop]

# active-work-update グループで直列化（auto-done と同じグループ）
concurrency:
  group: active-work-update
  cancel-in-progress: false

jobs:
  mark-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: develop
          token: ${{ secrets.PIPELINE_PAT }}
          fetch-depth: 0

      - name: Update row to REVIEW + PR#
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python3 - <<'PYEOF'
          import os, sys
          from datetime import datetime, timezone

          branch = os.environ["BRANCH"]
          pr_number = os.environ["PR_NUMBER"]
          filepath = ".claude-pipeline/active-work.md"

          with open(filepath, encoding="utf-8") as f:
              content = f.read()

          lines = content.splitlines(keepends=True)
          new_lines = []
          found = False
          updated = False

          for line in lines:
              if branch in line and line.strip().startswith("|"):
                  parts = line.rstrip("\n").split("|")
                  cols = parts[1:-1]
                  if len(cols) == 7 and cols[0].strip() == branch:
                      found = True
                      # 状態を REVIEW に更新
                      cols[3] = " REVIEW "
                      # PR# が空なら補完
                      if not cols[4].strip():
                          cols[4] = f" #{pr_number} "
                      eol = "\n" if line.endswith("\n") else ""
                      line = "|".join([""] + cols + [""]) + eol
                      updated = True
              new_lines.append(line)

          if not found:
              # 行が無ければ "---\n\n## 記入例" の直前（テーブル末尾）に挿入
              now = datetime.now(timezone.utc).strftime("%Y-%m-%d %H:%M")
              new_row = f"| {branch} | （自動登録・要補完） | {now} | REVIEW | #{pr_number} | | 自動登録 |\n"
              inserted = False
              for i, l in enumerate(new_lines):
                  if l.rstrip() == "---":
                      # この --- の後（空行を挟んで）## 記入例 があるか確認
                      j = i + 1
                      while j < len(new_lines) and new_lines[j].strip() == "":
                          j += 1
                      if j < len(new_lines) and new_lines[j].startswith("## 記入例"):
                          new_lines.insert(i, new_row)
                          inserted = True
                          break
              if not inserted:
                  print("ERROR: active-work.md に '---' + '## 記入例' パターンが見つかりません。テーブル外への追記を防ぐため中止します。", file=sys.stderr)
                  sys.exit(1)
              updated = True
              print(f"AUTO_ADDED: {branch} as REVIEW #{pr_number}")

          if updated:
              with open(filepath, "w", encoding="utf-8") as f:
                  f.write("".join(new_lines))
              print(f"REVIEW_UPDATED: {branch} #{pr_number}")
          else:
              print(f"SKIP (already REVIEW or not found): {branch}")
          PYEOF

      - name: Commit and push REVIEW update
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --quiet .claude-pipeline/active-work.md; then
            echo "No changes to commit"
            exit 0
          fi

          git add .claude-pipeline/active-work.md
          git commit -m "chore: active-work.md — ${BRANCH} を REVIEW #${PR_NUMBER} に更新（自動）"

          # 並行更新に備えて push 前に pull --rebase
          git pull --rebase origin develop
          git push origin HEAD:refs/heads/develop
