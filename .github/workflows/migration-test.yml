              updated_at  TIMESTAMPTZ NOT NULL DEFAULT NOW()
          );

          -- public.extraction_attempts: 20260921_110000_pipeline_tables_public.sql で本番作成済み。
          --   20260927_130000_add_extraction_token_cost_columns.sql が ALTER TABLE public.extraction_attempts
          --   を実行するため、前提として最小定義を登録する（FK なしでよい）。
          --   input_tokens/output_tokens/cost_usd は 20260927_130000 が本番で既に ADD 済みの列。
          --   response_received_at は 20260921_110000 で本番作成済みの列（型は同ファイルと同一）。
          --   このジョブは「変更 SQL のみ」を旧SQLの再適用なしに検証するため、20260930_160000
          --   （PR #3884, ADR-1004 A2: llm_usage_events バックフィル）のように既存列を SELECT する
          --   migration を追加する場合、ここで列を先に用意しておく必要がある。
          CREATE TABLE IF NOT EXISTS public.extraction_attempts (
              id                   UUID        PRIMARY KEY DEFAULT gen_random_uuid(),
              extraction_job_id    UUID        NOT NULL,
              source_message_id    UUID        NOT NULL,
              started_at           TIMESTAMPTZ NOT NULL DEFAULT clock_timestamp(),
              response_received_at TIMESTAMPTZ,
              finished_at          TIMESTAMPTZ,
              phase                TEXT        NOT NULL DEFAULT 'started',
              input_payload        JSONB,
              input_sha256         TEXT        NOT NULL DEFAULT '',
              input_bytes          BIGINT      NOT NULL DEFAULT 0,
              requested_model      TEXT        NOT NULL DEFAULT '',
              prompt_version       TEXT        NOT NULL DEFAULT '',
              response_text        TEXT,
              parsed_items         JSONB,
              parsed_bytes         BIGINT,
              item_count           INTEGER,
              validation_result    JSONB       NOT NULL DEFAULT '{}',
              error_code           TEXT,
              input_tokens         INTEGER,
              output_tokens        INTEGER,
              cost_usd             NUMERIC(10,6)
          );

          -- public.llm_usage_events: ADR-1004 A1（PR #3889, migrations/20260930_150000_create_llm_usage_events.sql）
          --   で本番作成予定。A1マージ後、このジョブの「変更 SQL のみ」実行方式では
          --   20260930_150000 が再実行されないため、A2（20260930_160000_backfill_llm_usage_events.sql）の
          --   INSERT 先として、A1 と同一定義をここに事前登録する（A1マージ前の現状でも
          --   changed_sql に 150000 が含まれる限り CREATE TABLE IF NOT EXISTS は無害に冪等スキップされる）。
          -- public.payment_fee_settings: PR #3930（migrations/20261002_160000_create_payment_fee_settings.sql）
          --   で本番作成予定。COMMENT ON COLUMN（20261002_180000_comment_payment_fee_settings_columns.sql）の
          --   実行前提としてここに事前登録する。
          CREATE TABLE IF NOT EXISTS public.payment_fee_settings (
              id              INTEGER GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
              tenant_id       INTEGER REFERENCES public.tenants(id),
              service         VARCHAR(30)    NOT NULL,
              fee_type        VARCHAR(50)    NOT NULL,
              rate_pct        NUMERIC(8,4)   NOT NULL DEFAULT 0,
              fixed_amount    NUMERIC(14,2)  NOT NULL DEFAULT 0,
              threshold       NUMERIC(14,2),
              threshold_rule  VARCHAR(10),
              currency        VARCHAR(3)     NOT NULL DEFAULT 'JPY',
              effective_from  DATE           NOT NULL,
              effective_to    DATE,
              source_url      TEXT,
              note            TEXT,
              created_at      TIMESTAMPTZ    NOT NULL DEFAULT NOW(),
              updated_at      TIMESTAMPTZ    NOT NULL DEFAULT NOW(),
              CONSTRAINT uq_fee_setting
                  UNIQUE (tenant_id, service, fee_type, currency, effective_from)
          );
          CREATE TABLE IF NOT EXISTS public.llm_usage_events (
              id                          UUID        PRIMARY KEY DEFAULT gen_random_uuid(),
              occurred_at                 TIMESTAMPTZ NOT NULL DEFAULT now(),
              purpose                     TEXT        NOT NULL,
              tenant_id                   INTEGER,
              model                       TEXT        NOT NULL,
              sdk                         TEXT        NOT NULL,
              prompt_tokens               INTEGER,
              cached_content_tokens       INTEGER,
              candidates_tokens           INTEGER,
              thoughts_tokens             INTEGER,
              tool_use_prompt_tokens      INTEGER,
              total_tokens                INTEGER,
              cost_usd                    NUMERIC(12, 6),
              extraction_attempt_id       UUID        REFERENCES public.extraction_attempts(id) ON DELETE SET NULL,
              extraction_shadow_run_id    UUID,
              discord_inbound_message_id  INTEGER,
              source_ref                  TEXT,
              backfilled                  BOOLEAN     NOT NULL DEFAULT false,
              CONSTRAINT llm_usage_events_purpose_check
                  CHECK (purpose IN (
                      'line_extraction', 'line_extraction_shadow', 'inventory_parse_fallback',
                      'translation_inbound', 'translation_inbound_escalation', 'translation_outbound'
                  )),
              CONSTRAINT llm_usage_events_sdk_check
                  CHECK (sdk IN ('google-genai', 'google-generativeai'))
          );

