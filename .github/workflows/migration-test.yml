          --   20260928_110000_create_extraction_shadow_tables.sql が
          --   INSERT ... ON CONFLICT (prompt_key) DO NOTHING を実行するため、前提として最小定義を登録する。
          CREATE TABLE IF NOT EXISTS public.extraction_prompt_config (
              id          SERIAL PRIMARY KEY,
              prompt_key  VARCHAR(100) NOT NULL UNIQUE,
              prompt_text TEXT NOT NULL DEFAULT '',
              is_active   BOOLEAN NOT NULL DEFAULT TRUE,
