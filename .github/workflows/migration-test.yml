name: Migration SQL Test

# 目的: マイグレーション（Python スクリプト + 生 SQL）を本番適用前に実際の PostgreSQL で検証する
#
# 検証内容:
#   1. 既存データが入った状態でマイグレーションを実行（本番を模擬）
#   2. 同じマイグレーションをもう一度実行（冪等性チェック）
#   3. 追加されたカラムに既存行の値が正しく入っているか確認
#
# 対象:
#   - scripts/migrate_*.py  — Python マイグレーションスクリプト
#   - migrations/[0-9]*.sql — 生 SQL マイグレーション（{schema} テンプレートは除外）
#
# これにより防げること:
#   - SQL 構文エラー（デプロイ前に発覚）
#   - DEFAULT 指定漏れ（既存行が NULL になるバグ）
#   - ADD COLUMN IF NOT EXISTS 書き忘れ（再実行でエラーになるバグ）
#   - PL/pgSQL DO ブロックのロジックエラー（冪等性破壊）
#
# 最適化（2026-06-01）: detect-changes → migration-test-run → aggregator パターンを導入。
#   migration 変更がない PR では PostgreSQL コンテナ起動 + pip install を省略（約2〜3分短縮）。
#   test.yml・schema-check.yml と同じ設計パターン。

on:
  pull_request:
    branches: [main, develop]

jobs:
  # マイグレーション関連ファイルの変更有無を判定
  detect-changes:
    name: マイグレーション変更検出
    runs-on: ubuntu-latest
    outputs:
      migrations: ${{ steps.filter.outputs.migrations }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            migrations:
              - 'migrations/**'
              - 'scripts/migrate_*.py'
              - 'scripts/migration_py_entry.py'
              - 'scripts/check-migration-registration-exists.sh'
              - 'scripts/run_all_migrations.sh'
              - 'scripts/migration-guard/**'
              - 'scripts/migration-dryrun-report.py'
              - '.github/workflows/migration-test.yml'

  # run_all_migrations.sh の登録先ファイルが実在するかを全件点検する。
  # ここでの失敗は workflow 全体を fail-close にする。run_py の既存静的解析は
  # そのまま残し、この新ゲートを正本として追加する。
  migration-registration-exists:
    name: マイグレーション登録ファイル存在点検
    needs: detect-changes
    if: needs.detect-changes.outputs.migrations == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 登録ファイルの実在を全数確認
        run: |
          set -euo pipefail
          bash scripts/check-migration-registration-exists.sh \
            --mode host \
            --repo-root "${GITHUB_WORKSPACE}"

  # チェッカー自体の回帰テスト。欠品で必ず落ちる / 全件揃いで通ることを
  # 恒久的に保証する。手動検証の腐りを防ぐため、PRごとに必ず実行する。
  migration-registration-exists-regression:
    name: マイグレーション登録ファイル存在点検 回帰テスト
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: 回帰テストを実行
        run: node scripts/tests/test-migration-registration-exists.js

  # マイグレーション変更がある場合のみ PostgreSQL を起動して実行
  migration-test-run:
    name: マイグレーションSQL 実行（内部）
    needs: detect-changes
    if: needs.detect-changes.outputs.migrations == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: jarvis
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: jarvis_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jarvis -d jarvis_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://jarvis:testpass@localhost:5432/jarvis_db
      PGPASSWORD: testpass

    steps:
      # fetch-depth: 0 必須。後段の detect step が PR base..head の git diff で
      # 変更 SQL を特定するため、base SHA を含む全履歴が必要（shallow=1 だと
      # `fatal: bad object` で diff が失敗し、変更検出が空＝SQL未実行の偽 green になる）。
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: uv pip install --system -r requirements.txt

      - name: PostgreSQL 待機
        run: |
          for i in $(seq 1 10); do
            pg_isready -h localhost -U jarvis -d jarvis_db && exit 0
            sleep 2
          done
          echo "PostgreSQL が起動しませんでした" && exit 1

      # ── Step 1: 本番を模擬した初期スキーマ（既存データあり）を作る ──────────────
      #
      # 【段階的拡充ルール】
      # 新しい migration が操作するテーブルがここにない場合、その migration の SQL が
      # PostgreSQL 上で正しく実行できるか検証できません。
      #
      # やること: 新規 migration を追加する PR では、そのテーブルの最小定義をここに追加してください。
      #   例) ALTER TABLE public.foo ADD COLUMN bar INTEGER;  を書く場合
      #       → public.foo の CREATE TABLE をここに追加する
      #
      # コスト: 1テーブル追加するだけ。migration 変更がない PR ではこのジョブ自体が起動しないため
      #         テスト速度への影響はゼロです。
      #
      # 現在登録済みのテーブル:
      #   public:    tenants / users / permissions / tenant_discord_config / inventory / line_conditions(VIEW:conditions) / units / line_units / tcg_status_master
      #   tenant_001: role_permissions / staff / leads / deals / message_translations (tenant_id ③-a 適用後)
      #   ※ public.products は migrate_inventory_sprint1.py が作成（Sprint 1 ステップ）
      #   ※ public.inventory は PUBLIC_SQL セクションに最小定義を登録（migration 081 相当）
      #   ※ public.line_conditions は PUBLIC_SQL セクションに最小定義を登録（20260922_080000 リネーム後の本番状態）
      #   ※ public.conditions は VIEW（20260922_080000 で line_conditions の後方互換 VIEW として作成）
      #   ※ tenant_001.own_inventory は 20260604_140000_create_own_inventory.sql が CREATE（移行自体が作成）
      #   ※ public.units は 20260919_020000_master_ssot_public_tables.sql で本番作成済み（最小定義を登録）
      #   ※ public.line_units は 20260922_080000 で units からリネーム済み（本番状態を反映）
      #   ※ public.tcg_status_master は 20260919_020000_master_ssot_public_tables.sql で本番作成済み（最小定義を登録）
      #   ※ public.tcg_note_master は既存テーブル（PARITY-02 で作成済み）（最小定義を登録）
      #   ※ public.extraction_attempts は 20260921_110000_pipeline_tables_public.sql で本番作成済み（最小定義を登録）
      #   ※ public.extraction_jobs は 20260921_110000_pipeline_tables_public.sql で本番作成済み。
      #      20260928_110000_create_extraction_shadow_tables.sql の FK 参照のため最小定義（id のみ）を登録
      #   ※ public.source_messages は 20260921_110000_pipeline_tables_public.sql で本番作成済み。
      #      20260929_120000_fix_source_messages_received_at.sql が UPDATE するため最小定義を登録
      #   ※ public.extraction_items は 20260921_110000_pipeline_tables_public.sql で本番作成済み。
      #      20260929_120000_fix_source_messages_received_at.sql が JOIN するため最小定義を登録
      #   ※ public.extraction_prompt_config は 20260926_080000_create_extraction_prompt_config.sql で本番作成済み。
      #      20260928_110000_create_extraction_shadow_tables.sql の INSERT ON CONFLICT のため最小定義を登録
      #   ※ public.tenant_discord_ticket_config は 20260602_120000_add_discord_ticket_config.sql で本番作成済み。
      #      20260930_130000_set_discord_welcome_template_english.sql の ALTER/UPDATE のため最小定義を登録
      #   ※ public.quantity_units は 20260921_140000 で本番作成済み（最小定義を登録）
      # ──────────────────────────────────────────────────────────────────────
      - name: 既存データ付きの公開スキーマを作成
        run: |
          psql -h localhost -U jarvis -d jarvis_db -v ON_ERROR_STOP=1 <<'SQL'
          -- public.tenants
          CREATE TABLE IF NOT EXISTS public.tenants (
              id          SERIAL PRIMARY KEY,
              tenant_name VARCHAR(255) NOT NULL UNIQUE,
              tenant_code VARCHAR(50)  NOT NULL UNIQUE,
              is_active   BOOLEAN      NOT NULL DEFAULT TRUE,
              settings    JSONB                 DEFAULT '{}',
              created_at  TIMESTAMPTZ           DEFAULT NOW(),
              updated_at  TIMESTAMPTZ           DEFAULT NOW()
          );

          -- public.users（is_super_admin は意図的に含めない = migration 前の状態）
          CREATE TABLE IF NOT EXISTS public.users (
              id            SERIAL PRIMARY KEY,
              tenant_id     INTEGER      NOT NULL REFERENCES public.tenants(id) ON DELETE CASCADE,
              email         VARCHAR(255) NOT NULL UNIQUE,
              password_hash VARCHAR(255) NOT NULL DEFAULT '',
              full_name     VARCHAR(255),
              role          VARCHAR(50)           DEFAULT 'user',
              is_active     BOOLEAN               DEFAULT TRUE,
              locale        VARCHAR(10)  NOT NULL DEFAULT 'ja',
              theme         VARCHAR(10)  NOT NULL DEFAULT 'light',
              created_at    TIMESTAMPTZ           DEFAULT NOW(),
              updated_at    TIMESTAMPTZ           DEFAULT NOW(),
              last_login    TIMESTAMPTZ
          );

          -- public.permissions
          CREATE TABLE IF NOT EXISTS public.permissions (
              id          SERIAL PRIMARY KEY,
              key         VARCHAR(100) NOT NULL UNIQUE,
              resource    VARCHAR(50)  NOT NULL,
              action      VARCHAR(50)  NOT NULL,
              description VARCHAR(255) NOT NULL DEFAULT '',
              category    VARCHAR(50)  NOT NULL DEFAULT ''
          );

          -- テナント削除 中央監査ログ（public.tenant_deletion_audit 新設）
          CREATE TABLE IF NOT EXISTS public.tenant_deletion_audit (
              id            SERIAL PRIMARY KEY,
              tenant_id     INTEGER NOT NULL,
              tenant_code   TEXT NOT NULL,
              tenant_name   TEXT NOT NULL,
              mode          TEXT NOT NULL,
              status        TEXT NOT NULL,
              actor_id      INTEGER REFERENCES public.users(id) ON DELETE SET NULL,
              actor_email   TEXT NOT NULL,
              executed_at   TIMESTAMPTZ NOT NULL DEFAULT NOW(),
              completed_at  TIMESTAMPTZ,
              error_message TEXT,
              meta          JSONB
          );

          -- 既存データを挿入（本番の既存ユーザーを模擬）
          INSERT INTO public.tenants (tenant_name, tenant_code)
          VALUES ('テストテナント', 'test-tenant') ON CONFLICT DO NOTHING;

          INSERT INTO public.users (tenant_id, email, full_name)
          VALUES (1, 'existing@example.com', '既存ユーザー') ON CONFLICT DO NOTHING;
          SQL

          # テナントスキーマ（PL/pgSQL DO ブロック型 SQL 用）
          psql -h localhost -U jarvis -d jarvis_db -v ON_ERROR_STOP=1 <<'TENANT_SQL'
          CREATE SCHEMA IF NOT EXISTS tenant_001;

          -- role_permissions: 078 の DO ブロックがスキーマ判定に使用するテーブル
          CREATE TABLE IF NOT EXISTS tenant_001.role_permissions (
              id         SERIAL PRIMARY KEY,
              role       VARCHAR(50) NOT NULL,
              permission VARCHAR(100) NOT NULL
          );

          -- staff: テナント個別スキーマにのみ存在（public.staff は存在しない）
          -- ここで定義しておくことで「REFERENCES public.staff」を書いた migration が
          -- PostgreSQL のエラーで検出できる（public.staff が見つからない → ERROR）
          CREATE TABLE IF NOT EXISTS tenant_001.staff (
              id         SERIAL PRIMARY KEY,
              tenant_id  INTEGER NOT NULL,
              user_id    INTEGER,
              full_name  VARCHAR(255),
              is_active  BOOLEAN NOT NULL DEFAULT TRUE,
              created_at TIMESTAMPTZ DEFAULT NOW(),
              updated_at TIMESTAMPTZ DEFAULT NOW()
          );

          -- leads: テナント個別スキーマにのみ存在
          -- NOTE: source 列は migration 103 (ADR-138 §D1-3) で廃止済み。
          --       customer_name / discord_user_id は migration 003/091 相当で存在する。
          CREATE TABLE IF NOT EXISTS tenant_001.leads (
              id              SERIAL PRIMARY KEY,
              tenant_id       INTEGER      NOT NULL,
              full_name       VARCHAR(255),
              customer_name   VARCHAR(255),
              status          VARCHAR(50),
              discord_user_id VARCHAR(64),
              created_at      TIMESTAMPTZ  DEFAULT NOW(),
              updated_at      TIMESTAMPTZ  DEFAULT NOW()
          );

          -- lead_channels: ADR-119 で作成（migrate_adr119_lead_channels_backfill.py が INSERT する）
          CREATE TABLE IF NOT EXISTS tenant_001.lead_channels (
              id           SERIAL PRIMARY KEY,
              lead_id      INTEGER      NOT NULL REFERENCES tenant_001.leads(id),
              platform     VARCHAR(50)  NOT NULL,
              external_id  VARCHAR(255) NOT NULL,
              display_name VARCHAR(255),
              created_at   TIMESTAMPTZ  DEFAULT NOW(),
              UNIQUE (platform, external_id)
          );

          -- deals: テナント個別スキーマにのみ存在
          CREATE TABLE IF NOT EXISTS tenant_001.deals (
              id         SERIAL PRIMARY KEY,
              tenant_id  INTEGER NOT NULL,
              title      VARCHAR(255),
              company_id INTEGER,
              created_at TIMESTAMPTZ DEFAULT NOW(),
              updated_at TIMESTAMPTZ DEFAULT NOW()
          );

          -- companies: テナント個別スキーマにのみ存在（v_company_stats ビューの参照先）
          CREATE TABLE IF NOT EXISTS tenant_001.companies (
              id         SERIAL PRIMARY KEY,
              tenant_id  INTEGER NOT NULL,
              name       VARCHAR(255) NOT NULL,
              lead_id    INTEGER REFERENCES tenant_001.leads(id),
              created_at TIMESTAMPTZ DEFAULT NOW(),
              updated_at TIMESTAMPTZ DEFAULT NOW()
          );

          -- conversation_logs (for PR#4 migration test)
          CREATE TABLE IF NOT EXISTS tenant_001.conversation_logs (
              id                  SERIAL PRIMARY KEY,
              tenant_id           INTEGER NOT NULL,
              lead_id             INTEGER,
              contact_id          INTEGER,
              company_id          INTEGER,
              deal_id             INTEGER,
              channel_type        VARCHAR(30) NOT NULL,
              channel_identity    VARCHAR(255),
              direction           VARCHAR(10) NOT NULL CHECK (direction IN ('inbound', 'outbound')),
              sender              VARCHAR(100),
              content_text        TEXT,
              original_language   VARCHAR(10),
              external_message_id VARCHAR(255) UNIQUE,
              raw_payload         JSONB,
              status              VARCHAR(20) DEFAULT 'sent',
              translated_text     TEXT,
              analysis            JSONB,
              occurred_at         TIMESTAMPTZ NOT NULL,
              created_at          TIMESTAMPTZ NOT NULL DEFAULT NOW()
          );

          -- message_translations: ③-a(20260623_040000) で tenant_id INTEGER を ADD COLUMN した後の状態を再現
          -- 本番と同じ nullable（DEFAULT なし）・backfill 済みで既存行は NOT NULL 相当
          CREATE TABLE IF NOT EXISTS tenant_001.message_translations (
              id               SERIAL PRIMARY KEY,
              tenant_id        INTEGER,
              message_id       TEXT NOT NULL,
              target_language  VARCHAR(10) NOT NULL,
              translated_text  TEXT NOT NULL,
              engine           VARCHAR(50) NOT NULL DEFAULT 'gemini-2.5-flash',
              created_at       TIMESTAMPTZ NOT NULL DEFAULT NOW(),
              CONSTRAINT uq_message_translations UNIQUE (message_id, target_language)
          );

          -- quotes: 見積書テーブル（C-6 スナップショット migration が ALTER する）
          CREATE TABLE IF NOT EXISTS tenant_001.quotes (
              id              SERIAL PRIMARY KEY,
              tenant_id       INTEGER NOT NULL,
              quote_code      VARCHAR(50),
              company_id      INTEGER,
              contact_id      INTEGER,
              lead_id         INTEGER REFERENCES tenant_001.leads(id),
              currency        VARCHAR(10) NOT NULL DEFAULT 'JPY',
              subtotal        NUMERIC(15,2),
              shipping_fee    NUMERIC(15,2),
              tax_amount      NUMERIC(15,2),
              total_amount    NUMERIC(15,2),
              status          VARCHAR(30) NOT NULL DEFAULT 'draft',
              validity_date   DATE,
              notes           TEXT,
              created_at      TIMESTAMPTZ DEFAULT NOW(),
              updated_at      TIMESTAMPTZ DEFAULT NOW()
          );

          -- quote_items: 見積明細テーブル（C-6: hs_code 列追加 migration が ALTER する）
          CREATE TABLE IF NOT EXISTS tenant_001.quote_items (
              id              SERIAL PRIMARY KEY,
              quote_id        INTEGER NOT NULL,
              product_id      INTEGER,
              product_name    VARCHAR(255),
              name_en         VARCHAR(255),
              condition       VARCHAR(50),
              unit            VARCHAR(50),
              quantity        INTEGER NOT NULL DEFAULT 1,
              unit_price      NUMERIC(15,2) NOT NULL DEFAULT 0,
              weight          NUMERIC(10,3),
              subtotal        NUMERIC(15,2),
              sort_order      INTEGER NOT NULL DEFAULT 0
          );

          -- invoices: 請求書テーブル（C-6/C-7 スナップショット migration が ALTER する）
          CREATE TABLE IF NOT EXISTS tenant_001.invoices (
              id                  SERIAL PRIMARY KEY,
              tenant_id           INTEGER NOT NULL,
              invoice_number      VARCHAR(50),
              quote_id            INTEGER,
              company_id          INTEGER,
              contact_id          INTEGER,
              currency            VARCHAR(10) NOT NULL DEFAULT 'JPY',
              subtotal            NUMERIC(15,2),
              shipping_fee        NUMERIC(15,2),
              tax_amount          NUMERIC(15,2),
              total_amount        NUMERIC(15,2),
              exchange_rate_jpy   NUMERIC(15,4),
              exchange_rate_usd   NUMERIC(15,4),
              amount_jpy          NUMERIC(15,2),
              amount_usd          NUMERIC(15,2),
              payment_method      VARCHAR(50),
              status              VARCHAR(30) NOT NULL DEFAULT 'draft',
              branch_number       INTEGER NOT NULL DEFAULT 1,
              pdf_url             TEXT,
              erp_key             VARCHAR(20),
              issued_at           TIMESTAMPTZ,
              due_date            DATE,
              paid_at             TIMESTAMPTZ,
              voided_at           TIMESTAMPTZ,
              void_reason         TEXT,
              notes               TEXT,
              created_by          INTEGER,
              created_at          TIMESTAMPTZ DEFAULT NOW(),
              updated_at          TIMESTAMPTZ DEFAULT NOW()
          );

          -- invoice_items: 請求明細テーブル（C-6: hs_code 列追加 migration が ALTER する）
          CREATE TABLE IF NOT EXISTS tenant_001.invoice_items (
              id              SERIAL PRIMARY KEY,
              invoice_id      INTEGER NOT NULL,
              product_id      INTEGER,
              product_name    VARCHAR(255),
              name_en         VARCHAR(255),
              condition       VARCHAR(50),
              unit            VARCHAR(50),
              quantity        INTEGER NOT NULL DEFAULT 1,
              unit_price      NUMERIC(15,2) NOT NULL DEFAULT 0,
              weight          NUMERIC(10,3),
              subtotal        NUMERIC(15,2),
              sort_order      INTEGER NOT NULL DEFAULT 0
          );

          -- ── tenant_002: deals なしテナント（便D-1 以降の新規テナント相当） ──────────────
          -- [146] v_company_stats SSOT / [148][149] funnel migrations のガード検証用。
          -- deals テーブルを意図的に作成しない。
          CREATE SCHEMA IF NOT EXISTS tenant_002;
          CREATE TABLE IF NOT EXISTS tenant_002.leads (
              id              SERIAL PRIMARY KEY,
              tenant_id       INTEGER      NOT NULL,
              full_name       VARCHAR(255),
              status          VARCHAR(50),
              created_at      TIMESTAMPTZ  DEFAULT NOW(),
              updated_at      TIMESTAMPTZ  DEFAULT NOW()
          );
          CREATE TABLE IF NOT EXISTS tenant_002.companies (
              id         SERIAL PRIMARY KEY,
              tenant_id  INTEGER NOT NULL,
              name       VARCHAR(255) NOT NULL,
              lead_id    INTEGER REFERENCES tenant_002.leads(id),
              created_at TIMESTAMPTZ DEFAULT NOW(),
              updated_at TIMESTAMPTZ DEFAULT NOW()
          );
          CREATE TABLE IF NOT EXISTS tenant_002.invoices (
              id           SERIAL PRIMARY KEY,
              tenant_id    INTEGER NOT NULL,
              company_id   INTEGER,
              total_amount NUMERIC(15,2),
              paid_at      TIMESTAMPTZ,
              voided_at    TIMESTAMPTZ,
              created_at   TIMESTAMPTZ DEFAULT NOW(),
              updated_at   TIMESTAMPTZ DEFAULT NOW()
          );
          CREATE TABLE IF NOT EXISTS tenant_002.conversation_logs (
              id           SERIAL PRIMARY KEY,
              tenant_id    INTEGER NOT NULL,
              company_id   INTEGER,
              occurred_at  TIMESTAMPTZ NOT NULL,
              channel_type VARCHAR(30) NOT NULL,
              created_at   TIMESTAMPTZ NOT NULL DEFAULT NOW()
          );
          TENANT_SQL

          # public スキーマの追加テーブル（最近の migration が ALTER/参照するテーブル）
          psql -h localhost -U jarvis -d jarvis_db -v ON_ERROR_STOP=1 <<'PUBLIC_SQL'
          -- tenant_discord_config: discord連携設定（ALTER ADD COLUMN が多い）
          CREATE TABLE IF NOT EXISTS public.tenant_discord_config (
              id         SERIAL PRIMARY KEY,
              tenant_id  INTEGER NOT NULL REFERENCES public.tenants(id) ON DELETE CASCADE,
              guild_id   VARCHAR(32),
              created_at TIMESTAMPTZ DEFAULT NOW(),
              updated_at TIMESTAMPTZ DEFAULT NOW()
          );

          -- public.tenant_discord_ticket_config: 20260602_120000_add_discord_ticket_config.sql で本番作成済み。
          --   20260930_130000_set_discord_welcome_template_english.sql が ALTER COLUMN SET DEFAULT / UPDATE するため
          --   最小定義（welcome_template は旧日本語既定つき）を登録する
          CREATE TABLE IF NOT EXISTS public.tenant_discord_ticket_config (
              tenant_id        INTEGER PRIMARY KEY REFERENCES public.tenants(id) ON DELETE CASCADE,
              welcome_template TEXT NOT NULL DEFAULT 'ご連絡ありがとうございます。こちらのチャンネルでサポートいたします。',
              updated_at       TIMESTAMPTZ NOT NULL DEFAULT NOW()
          );

          -- public.tenant_settings: ADR-106 テナントポリシー列が ALTER ADD COLUMN で操作する
          CREATE TABLE IF NOT EXISTS public.tenant_settings (
              tenant_id         INTEGER PRIMARY KEY REFERENCES public.tenants(id) ON DELETE CASCADE,
              spreadsheet_phase TEXT NOT NULL DEFAULT 'A',
              created_at        TIMESTAMPTZ DEFAULT NOW(),
              updated_at        TIMESTAMPTZ DEFAULT NOW()
          );
          INSERT INTO public.tenant_settings (tenant_id) VALUES (1) ON CONFLICT DO NOTHING;

          -- public.tcg_status_master: 20260919_020000_master_ssot_public_tables.sql で本番作成済み。
          --   20260920_050000_status_master_add_tenant_id.sql が ALTER ADD COLUMN するため前提として登録する。
          CREATE TABLE IF NOT EXISTS public.tcg_status_master (
              id              INTEGER GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
              status_id       VARCHAR NOT NULL,
