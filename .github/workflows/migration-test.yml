        run: |
          if [ -f scripts/migrate_inventory_sprint1.py ]; then
            python scripts/migrate_inventory_sprint1.py
            echo "✅ Sprint 1 完了"
          else
            echo "ℹ️  Sprint 1 スクリプトなし — スキップ"
          fi

      # public.suppliers.tenant_id: migrations/20260918_030000_supplier_ssot_phase2.sql:52 で本番追加済み。
      #   Sprint 1（056-063）の suppliers には tenant_id が無く、20261016_020000_add_suppliers_rls.sql（S1 段階②b）の前提として追加する。
      - name: suppliers.tenant_id を最小定義で追加（本番 phase2 相当）
        run: |
          psql -h localhost -U jarvis -d jarvis_db -v ON_ERROR_STOP=1 -c "DO \$\$ BEGIN IF to_regclass('public.suppliers') IS NOT NULL THEN ALTER TABLE public.suppliers ADD COLUMN IF NOT EXISTS tenant_id INTEGER; END IF; END \$\$;"

      # ── 廃止列前提検出: run_all_migrations.sh に登録された Python スクリプトを静的解析 ──
      # ADR-138 §D1-3 で廃止された leads.source 列を information_schema ガードなしで
      # 参照するスクリプトを検出して即 fail させる。
      #
      # 検出対象パターン:
      #   WHERE source LIKE / source NOT LIKE / SUBSTRING(source / ON leads(source)
      #
      # ガード判定: 同一ファイルに以下があれば OK（ガード済み）
      #   has_source / column_name.*'source' / information_schema.*columns.*source
      #
      # 「修正前のコードで赤になること」の証明: 旧 migrate_adr119_lead_channels_backfill.py は
      # WHERE source LIKE :pattern を has_source ガードなしで記述していたため
      # このステップが VIOLATION を検出して赤くなる。修正後はガードが付くため緑になる。
      - name: 廃止列前提検出（leads.source ガードなし参照を禁止）
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🔍 廃止列前提検出: ADR-138 leads.source 廃止列のガードなし参照を検出"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          VIOLATIONS=false

          while IFS= read -r script; do
            [ -z "$script" ] && continue
            [ ! -f "$script" ] && continue

            # leads.source を直接 SQL で参照するパターンを検出
            #   WHERE source LIKE / source NOT LIKE / SUBSTRING(source FROM / ON leads(source)
            if grep -qP "(WHERE|AND|OR)\s+source\s+(LIKE|NOT\s+LIKE|IS|=)|SUBSTRING\(source(\s+FROM)?|ON\s+\S*leads[^)]*\(\s*source\s*\)" "$script" 2>/dev/null \
               || grep -q "source LIKE\|source NOT LIKE" "$script" 2>/dev/null; then

              # has_source ガード / information_schema カラムチェックがあるか確認
              if ! grep -qP "has_source|column_name\s*=\s*['\"]source['\"]|column_name.*source" "$script" 2>/dev/null; then
                echo "❌ VIOLATION: $script"
                echo "   leads.source を information_schema/has_source ガードなしで参照しています。"
                echo "   ADR-138 §D1-3: leads.source は廃止済み。列の存在チェックを追加してください。"
                VIOLATIONS=true
              fi
            fi
          done < <(grep '^run_py' scripts/run_all_migrations.sh | awk '{print $2}')

          if [ "$VIOLATIONS" = "true" ]; then
            echo ""
            echo "❌ 廃止列前提違反を検出。修正後に再実行してください。"
            exit 1
          fi
          echo "✅ 廃止列前提なし — 全 Python マイグレーションスクリプト OK"

      # ── Python バックフィルスクリプトを source 廃止済みスキーマで実行 ─────────────
      # migrate_adr119_lead_channels_backfill.py が source なし DB で
      # "leads.source column not found (廃止済み per ADR-138), section 1 skipped" を
      # NOTICE して正常完了することを確認する。
      # これは本番 step[119/145] 相当の動作証明。
      - name: ADR-119 バックフィルスクリプトを source 廃止済みスキーマで実行
        env:
          PYTHONPATH: ${{ github.workspace }}/backend
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "▶ [step[119/145] 相当] scripts/migrate_adr119_lead_channels_backfill.py"
          echo "   テスト環境: leads.source 列なし（ADR-138 §D1-3 廃止済み状態）"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          # public.tenants にテナントレコードが必要（backfill は tenants を参照する）
          psql -h localhost -U jarvis -d jarvis_db -v ON_ERROR_STOP=1 <<'SEED_SQL'
          INSERT INTO public.tenants (id, tenant_name, tenant_code, is_active)
          VALUES (1, 'テストテナント', 'test-tenant', true)
          ON CONFLICT DO NOTHING;
          SEED_SQL

          # backfill スクリプト実行（スキップ NOTICE が出ることを確認）
          python scripts/migrate_adr119_lead_channels_backfill.py 2>&1 | tee /tmp/adr119_backfill.log

          # 正常終了を確認
          EXIT_CODE=${PIPESTATUS[0]}
          if [ "$EXIT_CODE" -ne 0 ]; then
            echo "❌ backfill スクリプトが失敗しました (exit=$EXIT_CODE)"
            exit 1
          fi

          # source 列なし → section 1 スキップ NOTICE が出ていることを確認
          if grep -q "leads.source column not found\|section 1.*skipped\|廃止済み" /tmp/adr119_backfill.log; then
            echo "✅ source 列なし → section 1 スキップ NOTICE 確認"
          else
            echo "ℹ️  スキップ NOTICE が見つかりません（テナントデータが空の場合は正常）"
          fi

          echo "✅ ADR-119 バックフィルスクリプト source 廃止済み状態で正常完了"

      - name: 報告用 DB を作る（ここまでの状態のコピー。全件ドライラン（報告のみ）が使う）
        # 1周目を始める直前の状態（ベーススキーマ + 前提）を、別の DB にコピーしておく。
        # 下の「報告のみ」の step がこの DB を使うので、既存の 1周目・2周目（強制）の DB には触れない。
        run: |
          psql -h localhost -U jarvis -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE jarvis_report TEMPLATE jarvis_db"

      - name: 1周目：全 run_sql migration を順次実行（新規適用）
        # 対象: run_all_migrations.sh の run_sql 行すべて（numbered 0XX + タイムスタンプ形式）
        # 初期タイムスタンプ（20260601-20260603）は Python migration 依存のため引き続き除外。
        # numbered migration (013, 091 等) を含めることで、後続 migration で削除された列を
        # 前提とする型のバグ（013 vs 103 型）を 1周目→2周目で機械的に捕捉する。
        # 前提: base schema の leads に source 列あり → 1周目で 013 が index 作成 → 103 が source DROP
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🔍 1周目（新規適用）開始"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          TOTAL=$(grep '^run_sql' scripts/run_all_migrations.sh | awk '{print $2}' \
            | grep -cE '^migrations/0|^migrations/2026060[4-9]|^migrations/2026061|^migrations/2026062' || echo 0)
          echo "対象 SQL ファイル数（numbered + タイムスタンプ形式）: ${TOTAL}"
          STEP=0

          grep '^run_sql' scripts/run_all_migrations.sh | awk '{print $2}' \
            | grep -E '^migrations/0|^migrations/2026060[4-9]|^migrations/2026061|^migrations/2026062' \
            | while read sqlfile; do
            [ -z "$sqlfile" ] && continue
            STEP=$((STEP + 1))
            if [ ! -f "$sqlfile" ]; then
              echo "⚠️  [1周目 ${STEP}/${TOTAL}] ファイルなし、スキップ: $sqlfile"
              continue
            fi
            echo "▶ [1周目 ${STEP}/${TOTAL}] $sqlfile..."
            if ! psql -h localhost -U jarvis -d jarvis_db -v ON_ERROR_STOP=1 -f "$sqlfile"; then
              echo "❌ [1周目 ${STEP}/${TOTAL}] 失敗: $sqlfile"
              exit 1
            fi
            echo "✅ [1周目 ${STEP}/${TOTAL}] $sqlfile"
          done

          echo ""
          echo "✅ 1周目（新規適用）完了"

      - name: 2周目：全 run_sql migration を再実行（冪等性チェック＝再デプロイ安全性）
        # 1周目適用済み状態に対して同じ SQL を全件再実行する。
        # これにより「次回デプロイ時に同じ migration が再実行されたとき安全か」を機械的に検証。
        # 今回の事故型（013: leads.source を SELECT → 103: source を DROP → 2周目で 013 が ERROR）は
        # 2周目で source が存在しない状態で 013 が実行される時に検出される（修正なし → ERROR）。
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🔄 2周目（冪等性チェック）開始"
          echo "   ※ 1周目適用済み状態への再実行 = 本番再デプロイ安全性の検証"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          TOTAL=$(grep '^run_sql' scripts/run_all_migrations.sh | awk '{print $2}' \
            | grep -cE '^migrations/0|^migrations/2026060[4-9]|^migrations/2026061|^migrations/2026062' || echo 0)
          STEP=0

          grep '^run_sql' scripts/run_all_migrations.sh | awk '{print $2}' \
            | grep -E '^migrations/0|^migrations/2026060[4-9]|^migrations/2026061|^migrations/2026062' \
            | while read sqlfile; do
            [ -z "$sqlfile" ] && continue
            STEP=$((STEP + 1))
            if [ ! -f "$sqlfile" ]; then
              continue
            fi
            echo "▶ [2周目 ${STEP}/${TOTAL}] $sqlfile..."
            if ! psql -h localhost -U jarvis -d jarvis_db -v ON_ERROR_STOP=1 -f "$sqlfile"; then
              echo "❌ [2周目 ${STEP}/${TOTAL}] 冪等性チェック失敗: $sqlfile"
              echo "   ↑ 本番再デプロイ時に同じエラーが発生します（migration を修正してください）"
              exit 1
            fi
            echo "✅ [2周目 ${STEP}/${TOTAL}] $sqlfile"
          done

          echo ""
          echo "✅ 2周目（冪等性チェック）完了 — 再デプロイ安全性 OK"

      - name: 全件ドライラン（失敗したら止める）：登録された全ファイル − 除外一覧
        # ADR-1007 決定5。上の 1周目・2周目は、従来の日付の範囲（^migrations/0 など）のままで強制する。
        # この step は、登録された全ファイルから scripts/migration-guard/dryrun-exclusions.tsv にあるものを除いて
        # 報告用 DB（jarvis_report）に流し、落ちたファイルを一覧にする。
        # 1本でも落ちたら job を失敗させ、集約 migration-test 経由でマージを止める（#4466 で失敗0本を確認してから切替）。
        # 空の DB で通らないことが実測で分かったファイルだけ、dryrun-exclusions.tsv に実測の ERROR を理由に書いて外す。
        # --psql の後ろに -h を置くと argparse が help と読んで何も流れない（P3）。接続先は env で渡す。
        env:
          PGHOST: localhost
          PGUSER: jarvis
        run: |
          python3 scripts/migration-dryrun-report.py run --db jarvis_report --rounds 2 --psql psql

  # ルールセット必須 Check の名前と一致させる。always() で常に実行し、
  # - migration 変更あり: migration-test-run / migration-full-dryrun の結果を報告
  # - migration 変更なし: 両ジョブが skipped → 成功として報告
  migration-test:
    name: マイグレーションSQL 実行テスト（実DB）
    needs: [detect-changes, migration-registration-exists, migration-registration-exists-regression, migration-test-run, migration-full-dryrun]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Report results
        run: |
          r="${{ needs.migration-test-run.result }}"
          d="${{ needs.migration-full-dryrun.result }}"
          e="${{ needs.migration-registration-exists.result }}"
          g="${{ needs.migration-registration-exists-regression.result }}"
          echo "migration-test-run: $r"
          echo "migration-full-dryrun: $d"
          echo "migration-registration-exists: $e"
          echo "migration-registration-exists-regression: $g"
          if [[ "$e" == "success" || "$e" == "skipped" ]] && [[ "$g" == "success" || "$g" == "skipped" ]] && [[ "$r" == "success" || "$r" == "skipped" ]] && [[ "$d" == "success" || "$d" == "skipped" ]]; then
            echo "OK: all migration tests passed or no migration changes"
            exit 0
          else
            echo "FAIL: migration-registration-exists=$e, migration-registration-exists-regression=$g, migration-test-run=$r, migration-full-dryrun=$d"
            exit 1
          fi
