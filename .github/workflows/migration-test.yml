            updated_at               TIMESTAMP WITH TIME ZONE DEFAULT NOW()
          );
          -- public.ops_incidents: migrations/20261016_100000_create_ops_incident_tables.sql で本番作成済み。
          --   20261031_210000_create_ops_case.sql が参照するため前提として登録する。
          CREATE TABLE IF NOT EXISTS public.ops_incidents (
              id                    UUID        PRIMARY KEY DEFAULT gen_random_uuid(),
              fingerprint           TEXT        NOT NULL,
              starts_at             TIMESTAMPTZ NOT NULL,
              alertname             TEXT        NOT NULL,
              severity              TEXT,
              labels                JSONB       NOT NULL DEFAULT '{}'::jsonb,
              annotations           JSONB       NOT NULL DEFAULT '{}'::jsonb,
              status                TEXT        NOT NULL,
              first_notified_at     TIMESTAMPTZ NOT NULL,
              last_notified_at      TIMESTAMPTZ NOT NULL,
              notify_count          INTEGER     NOT NULL DEFAULT 1,
              resolved_at           TIMESTAMPTZ,
              recurrence_of         UUID        REFERENCES public.ops_incidents(id),
              detection_path        TEXT        NOT NULL DEFAULT 'alert',
              human_noticed_at      TIMESTAMPTZ,
              needs_action          BOOLEAN,
              first_aid_started_at  TIMESTAMPTZ,
              first_aid_done_at     TIMESTAMPTZ,
              first_aid_result      TEXT,
              ai_started_at         TIMESTAMPTZ,
              root_cause            TEXT,
              fix_pr                INTEGER,
              review_note           TEXT,
              created_at            TIMESTAMPTZ NOT NULL DEFAULT now(),
              updated_at            TIMESTAMPTZ NOT NULL DEFAULT now(),
              CONSTRAINT ops_incidents_fingerprint_starts_at_key UNIQUE (fingerprint, starts_at),
              CONSTRAINT ops_incidents_status_check CHECK (status IN ('firing', 'resolved')),
              CONSTRAINT ops_incidents_detection_path_check CHECK (detection_path IN ('alert', 'human', 'ai')),
              CONSTRAINT ops_incidents_first_aid_result_check
                  CHECK (first_aid_result IN ('recovered', 'not_recovered', 'escalated')),
              CONSTRAINT ops_incidents_notify_count_check CHECK (notify_count >= 1),
              CONSTRAINT ops_incidents_labels_size_check CHECK (octet_length(labels::text) <= 4096),
              CONSTRAINT ops_incidents_annotations_size_check CHECK (octet_length(annotations::text) <= 4096)
          );
          -- ai_cloud_meta.build_log / build_columns: migrations/20261024_100000_create_ai_cloud_meta.sql で本番作成済み。
          --   20261031_210000_create_ops_case.sql が参照するため前提として登録する。
          CREATE SCHEMA IF NOT EXISTS ai_cloud_meta;

          CREATE TABLE IF NOT EXISTS ai_cloud_meta.build_log (
            built_at timestamptz NOT NULL DEFAULT now(),
            ok boolean NOT NULL,
            view_count integer,
            failed_count integer,
            error_class text
          );

          CREATE TABLE IF NOT EXISTS ai_cloud_meta.build_columns (
            view_name text NOT NULL,
            column_name text NOT NULL,
            source text NOT NULL,
            source_type text NOT NULL,
            class text,
            mode text NOT NULL CHECK (mode IN ('pass', 'mask', 'mask_bare', 'excluded'))
          );
          PUBLIC_SQL

      # ── Step 2: Sprint 1 を適用（Sprint 2 の前提条件）──────────────────────────
      - name: Sprint 1 マイグレーションを適用
        env:
          PYTHONPATH: ${{ github.workspace }}/backend
        run: |
          if [ -f scripts/migrate_inventory_sprint1.py ]; then
            python scripts/migrate_inventory_sprint1.py
            echo "✅ Sprint 1 完了"
          else
            echo "ℹ️  Sprint 1 スクリプトなし — スキップ"
          fi

      # ── ADR-1037 拡張（段1）: Python 移行のロック待ち 1 秒（入口 scripts/migration_py_entry.py）──
      # S1: run_py の呼び先が全部、入口の差し替えが効く取り込み方であることの静的点検。
      #     新しい移行が別の書き方で足されたらここで赤になる（設計 docs/handoff/deploy-db-stall/design.md §4-3）。
      - name: S1 Python 移行の接続が入口の差し替えを通ること（静的点検）
        run: |
          set -u
          targets=$(grep -E '^run_py[[:space:]]' scripts/run_all_migrations.sh | awk '{print $2}' | sort -u)
          [ -n "$targets" ] || { echo "::error::run_py の呼び先が 0 件（抜き出し失敗）"; exit 1; }
          echo "run_py targets: $(echo "$targets" | wc -l | tr -d ' ')"
          bad=0
          for f in $targets; do
            if [ ! -f "$f" ]; then echo "::error::S1 呼び先が無い: $f"; bad=1; continue; fi
            # (a) engine モジュールから直接取る書き方は差し替えをすり抜ける
            if grep -n 'sqlalchemy\.ext\.asyncio\.engine' "$f"; then echo "::error::S1(a) $f"; bad=1; fi
            # (b) create_async_engine を取り込む行は、全部 from sqlalchemy.ext.asyncio import の形
            if grep -nE 'import.*create_async_engine' "$f" | grep -vE '^[0-9]+:[[:space:]]*from sqlalchemy\.ext\.asyncio import[[:space:]]'; then
              echo "::error::S1(b) $f"; bad=1
            fi
            # (c) 同期の create_engine( と、差し替えを通らない直接接続
            if grep -nE '(^|[^_a-zA-Z])create_engine\(' "$f"; then echo "::error::S1(c) create_engine $f"; bad=1; fi
            if grep -nE 'asyncpg\.connect\(|psycopg2?\.connect\(|import[[:space:]]+psycopg|from[[:space:]]+psycopg' "$f"; then echo "::error::S1(c) direct connect $f"; bad=1; fi
          done
          [ "$bad" -eq 0 ] || exit 1
          echo "✅ S1 全呼び先が差し替えの効く形"

      # S2: run_py の定義が入口と MIGRATION_LOCK_TIMEOUT を通していること
      - name: S2 run_py が入口を通ること
        run: |
          set -u
          body=$(awk '/^run_py\(\) \{/{p=1} p{print} p&&/^}/{exit}' scripts/run_all_migrations.sh)
          [ -n "$body" ] || { echo "::error::run_py の定義が見つからない"; exit 1; }
          echo "$body" | grep -q 'scripts/migration_py_entry.py' || { echo "::error::S2 run_py が入口を通っていない"; exit 1; }
          echo "$body" | grep -q 'MIGRATION_LOCK_TIMEOUT' || { echo "::error::S2 run_py が MIGRATION_LOCK_TIMEOUT を渡していない"; exit 1; }
          echo "✅ S2 run_py は入口と MIGRATION_LOCK_TIMEOUT を通す"

      # S3: 裏の作業を待つ書き方が無いこと（ADR-1037 第8版。第7版は run_py でプロセス置換の後に裏の番号を待ち、本番で止まった）。
      # 見る範囲は sandbox 試験 R1〜R5 の抜き出しと同じ（SQL_LOCK_TIMEOUT= の行 〜 run_sql の閉じ括弧）。コメント行は除く。
      - name: S3 再試行の範囲に裏の作業を待つ書き方が無いこと
        run: |
          set -u
          range=$(awk '/^SQL_LOCK_TIMEOUT=/{p=1} p{print} p&&/^run_sql\(\) \{/{r=1} r&&/^}/{exit}' scripts/run_all_migrations.sh | grep -vE '^[[:space:]]*#' || true)
          [ -n "$range" ] || { echo "::error::S3 抜き出し範囲が空"; exit 1; }
          bad=0
          if echo "$range" | grep -nF '$!'; then echo "::error::S3 直前の裏の作業の番号を使う書き方がある"; bad=1; fi
          if echo "$range" | grep -nF '>('; then echo "::error::S3 プロセス置換がある"; bad=1; fi
          if echo "$range" | grep -nwE 'wait'; then echo "::error::S3 裏の作業を待つ書き方がある"; bad=1; fi
          [ "$bad" = 0 ] || exit 1
          echo "✅ S3 抜き出し範囲（$(echo "$range" | wc -l | tr -d ' ') 行）に裏の作業を待つ書き方なし"

      # P1: 別接続が suppliers の読み取りロックを 6 秒持つ間、入口経由の移行は 1 秒で諦め、
      #     ほかの読み取りの最大待ちは 1500ms 以内、移行は 3 秒未満で失敗する。
      - name: P1 Python 移行のロック待ちは 1 秒で諦め、読み取りを待たせない
        env:
          PYTHONPATH: ${{ github.workspace }}/backend
        run: |
          set -u
          W="$(mktemp -d)"
          PSQL="psql -h localhost -U jarvis -d jarvis_db -v ON_ERROR_STOP=1"
          printf 'BEGIN;\nLOCK TABLE public.suppliers IN ACCESS SHARE MODE;\nSELECT pg_sleep(6);\nCOMMIT;\n' > "$W/holder.sql"
          $PSQL -q -f "$W/holder.sql" > "$W/holder.out" 2>&1 &
          HOLDER_PID=$!
          held=0
          for _ in $(seq 1 40); do
            n=$($PSQL -Atc "SELECT count(*) FROM pg_locks l JOIN pg_class c ON c.oid = l.relation JOIN pg_namespace n ON n.oid = c.relnamespace WHERE n.nspname = 'public' AND c.relname = 'suppliers' AND l.mode = 'AccessShareLock' AND l.granted AND l.pid <> pg_backend_pid()")
            if [ "${n:-0}" -ge 1 ]; then held=1; break; fi
            sleep 0.25
          done
          [ "$held" = 1 ] || { echo "::error::P1 保持役のロックが確認できない"; cat "$W/holder.out"; exit 1; }
          (
            while [ ! -f "$W/stop" ]; do
              s=$(date +%s%N)
              $PSQL -Atc 'SELECT 1 FROM public.suppliers LIMIT 1' > /dev/null 2>&1
              e=$(date +%s%N)
              echo $(( (e - s) / 1000000 )) >> "$W/reads.txt"
              sleep 0.5
            done
          ) &
          READER_PID=$!
          s=$(date +%s%N)
          rc=0
          MIGRATION_LOCK_TIMEOUT=1s python scripts/migration_py_entry.py scripts/migrate_inventory_sprint1.py > "$W/mig.out" 2> "$W/mig.err" || rc=$?
          e=$(date +%s%N)
          mig_ms=$(( (e - s) / 1000000 ))
          touch "$W/stop"
          wait "$READER_PID"
          wait "$HOLDER_PID" || true
          echo "--- migration stderr (tail 30) ---"; tail -30 "$W/mig.err"
          reads=$(tr '\n' ' ' < "$W/reads.txt")
          max=$(sort -n "$W/reads.txt" | tail -1)
          echo "read measurements (ms): ${reads}"
          echo "P1 rc=${rc} migration_ms=${mig_ms} read_max_ms=${max:-none}"
          fail=0
          [ "$rc" -ne 0 ] || { echo "::error::P1 移行が成功してしまった（ロック待ちで失敗するはず）"; fail=1; }
          grep -q 'canceling statement due to lock timeout' "$W/mig.err" || { echo "::error::P1 標準エラーに lock timeout の文字列が無い"; fail=1; }
          [ -n "${max:-}" ] && [ "$max" -le 1500 ] || { echo "::error::P1 読み取りの最大 ${max:-none}ms > 1500ms"; fail=1; }
          [ "$mig_ms" -lt 3000 ] || { echo "::error::P1 移行が失敗するまで ${mig_ms}ms >= 3000ms"; fail=1; }
          [ "$fail" -eq 0 ] || exit 1
          echo "✅ P1 PASS"

      # P2: 環境変数が無い／空のときは今と同じ（差し替えなし・成功）
      - name: P2 MIGRATION_LOCK_TIMEOUT が無い／空のときは差し替えない
        env:
          PYTHONPATH: ${{ github.workspace }}/backend
        run: |
          set -u
          W="$(mktemp -d)"
          rc=0
          env -u MIGRATION_LOCK_TIMEOUT python scripts/migration_py_entry.py scripts/migrate_inventory_sprint1.py > "$W/a.out" 2> "$W/a.err" || rc=$?
          tail -3 "$W/a.err"
          [ "$rc" -eq 0 ] || { echo "::error::P2 (未設定) rc=${rc}"; exit 1; }
          grep -q 'migration_py_entry: lock_timeout=unset applied to 0 engine(s)' "$W/a.err" || { echo "::error::P2 (未設定) 差し替え回数の行が違う"; exit 1; }
          rc=0
          MIGRATION_LOCK_TIMEOUT= python scripts/migration_py_entry.py scripts/migrate_inventory_sprint1.py > "$W/b.out" 2> "$W/b.err" || rc=$?
          tail -3 "$W/b.err"
          [ "$rc" -eq 0 ] || { echo "::error::P2 (空) rc=${rc}"; exit 1; }
          grep -q 'migration_py_entry: lock_timeout=unset applied to 0 engine(s)' "$W/b.err" || { echo "::error::P2 (空) 差し替え回数の行が違う"; exit 1; }
          echo "✅ P2 PASS"

      # P3: 値があれば全エンジンに付く（保持なしで成功し、差し替え回数が 1）
      - name: P3 MIGRATION_LOCK_TIMEOUT があれば差し替える
        env:
          PYTHONPATH: ${{ github.workspace }}/backend
        run: |
          set -u
          W="$(mktemp -d)"
          rc=0
          MIGRATION_LOCK_TIMEOUT=1s python scripts/migration_py_entry.py scripts/migrate_inventory_sprint1.py > "$W/c.out" 2> "$W/c.err" || rc=$?
          tail -3 "$W/c.err"
          [ "$rc" -eq 0 ] || { echo "::error::P3 rc=${rc}"; exit 1; }
          grep -q 'migration_py_entry: lock_timeout=1s applied to 1 engine(s)' "$W/c.err" || { echo "::error::P3 差し替え回数の行が違う"; exit 1; }
          echo "✅ P3 PASS"

      # public.suppliers.tenant_id: migrations/20260918_030000_supplier_ssot_phase2.sql:52 で本番追加済み。
      #   Sprint 1（056-063）の suppliers には tenant_id が無く、20261016_020000_add_suppliers_rls.sql（S1 段階②b）の前提として追加する。
      - name: suppliers.tenant_id を最小定義で追加（本番 phase2 相当）
        run: |
          psql -h localhost -U jarvis -d jarvis_db -v ON_ERROR_STOP=1 -c "DO \$\$ BEGIN IF to_regclass('public.suppliers') IS NOT NULL THEN ALTER TABLE public.suppliers ADD COLUMN IF NOT EXISTS tenant_id INTEGER; END IF; END \$\$;"

      # ── Step 3: PR で変更されたマイグレーションスクリプトを実行 ──────────────────
      - name: 変更されたマイグレーションを検出
        id: detect
        run: |
          BASE=${{ github.event.pull_request.base.sha }}
          HEAD=${{ github.event.pull_request.head.sha }}

          # fail-closed: base..head の diff を 1 回だけ取得し、失敗したらジョブを落とす。
          # shallow checkout 等で base SHA が無いと git diff は `fatal: bad object` になる。
          # これを `|| true` で握りつぶすと「変更なし」と誤判定し、migration を実際には
          # 実行しないまま緑（false-positive）になるため、明示的に exit 1 する。
          if ! ALL_CHANGED=$(git diff --name-only "$BASE" "$HEAD"); then
            echo "::error::git diff $BASE..$HEAD に失敗（base SHA 不在の可能性）。fail-closed でジョブを失敗させます。checkout の fetch-depth: 0 を確認してください。"
            exit 1
          fi

          # Python スクリプト（上で取得済みの diff から抽出）
          # _stage_*.py は --tenant-id 必須の手動データ移行スクリプト（CI 自動実行対象外）
          CHANGED=$(echo "$ALL_CHANGED" | grep '^scripts/migrate_' | grep -v '_stage_' | sort || true)

          echo "changed_scripts<<EOF" >> "$GITHUB_OUTPUT"
          echo "$CHANGED" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

          if [ -z "$CHANGED" ]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "ℹ️  マイグレーションスクリプトの変更なし"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "🔍 対象スクリプト:"
            echo "$CHANGED"
          fi

          # 生 SQL ファイル（{schema} テンプレートは psql 直接実行不可のため除外）
          # xargs -r: 入力が空なら grep を実行しない（GNU xargs）
          # grep -L (not -rL): ディレクトリ再帰を行わない
          CHANGED_SQL=$(echo "$ALL_CHANGED" \
            | grep '^migrations/[0-9][0-9][0-9].*\.sql$' \
            | xargs -r grep -L '{schema}' 2>/dev/null | sort || true)

          echo "changed_sql<<EOF" >> "$GITHUB_OUTPUT"
          echo "$CHANGED_SQL" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

          if [ -z "$CHANGED_SQL" ]; then
            echo "has_sql_changes=false" >> "$GITHUB_OUTPUT"
            echo "ℹ️  生 SQL マイグレーションの変更なし"
          else
            echo "has_sql_changes=true" >> "$GITHUB_OUTPUT"
            echo "🔍 対象 SQL ファイル:"
            echo "$CHANGED_SQL"
          fi

      - name: 変更スクリプトを 1回目実行（既存データへの適用テスト）
        if: steps.detect.outputs.has_changes == 'true'
        env:
          PYTHONPATH: ${{ github.workspace }}/backend
        run: |
          echo "${{ steps.detect.outputs.changed_scripts }}" | while read script; do
            [ -z "$script" ] && continue
            echo "▶ $script を実行中..."
            python "$script"
            echo "✅ $script 成功"
          done

      - name: 変更スクリプトを 2回目実行（冪等性テスト）
        if: steps.detect.outputs.has_changes == 'true'
        env:
          PYTHONPATH: ${{ github.workspace }}/backend
        run: |
          echo "🔄 冪等性チェック（同じスクリプトを再実行）"
          echo "${{ steps.detect.outputs.changed_scripts }}" | while read script; do
            [ -z "$script" ] && continue
            echo "▶ $script を再実行中..."
            python "$script"
            echo "✅ $script 再実行も成功（冪等性 OK）"
          done

      # ── Step 4: 既存データに DEFAULT 値が正しく入っているか確認 ─────────────────
      - name: 既存行に DEFAULT 値が正しく適用されているか検証
        if: steps.detect.outputs.has_changes == 'true'
        run: |
          echo "🔍 既存ユーザー行の状態を確認:"
          psql -h localhost -U jarvis -d jarvis_db -c \
            "SELECT id, email, full_name FROM public.users;" \
            -v ON_ERROR_STOP=1

          # is_super_admin が追加された場合、既存行が NULL でないことを確認
          HAS_COL=$(psql -h localhost -U jarvis -d jarvis_db -tAc \
            "SELECT COUNT(*) FROM information_schema.columns
             WHERE table_schema='public' AND table_name='users'
             AND column_name='is_super_admin';" 2>/dev/null || echo "0")

          if [ "$HAS_COL" = "1" ]; then
            NULL_COUNT=$(psql -h localhost -U jarvis -d jarvis_db -tAc \
              "SELECT COUNT(*) FROM public.users WHERE is_super_admin IS NULL;")
            if [ "$NULL_COUNT" != "0" ]; then
              echo ""
              echo "❌ 既存ユーザー ${NULL_COUNT}件 の is_super_admin が NULL です"
              echo "   migration SQL に DEFAULT 値が指定されているか確認してください"
              exit 1
            fi
            echo "✅ 既存ユーザーの is_super_admin: NULL なし（DEFAULT が正しく適用された）"
          fi

          echo "✅ 全検証パス"
      # ── Step 5: PR で変更された生 SQL マイグレーションを実行 ─────────────────────
      # {schema} プレースホルダ含む旧テンプレート（018, 019 等）は検出時に除外済み
      - name: 変更 SQL の前提の移行を先に実行（ai_cloud_meta・ai_reader_cloud）
        if: steps.detect.outputs.has_sql_changes == 'true' && contains(steps.detect.outputs.changed_sql, 'migrations/20261024_100300_create_ai_cloud_views.sql')
        run: |
          # 20261024_100300 は 100000（ai_cloud_meta）と 100100（ai_reader_cloud）が先に流れている前提（run_all_migrations.sh と同じ順）
          for sqlfile in migrations/20261024_100000_create_ai_cloud_meta.sql migrations/20261024_100100_create_ai_reader_cloud_role.sql; do
            echo "▶ $sqlfile を前提として実行中..."
            psql -h localhost -U jarvis -d jarvis_db -v ON_ERROR_STOP=1 -f "$sqlfile"
            echo "✅ $sqlfile 成功"
          done

      - name: 変更 SQL の前提の移行を先に実行（auth_events・自社ログインの表）
        if: steps.detect.outputs.has_sql_changes == 'true' && contains(steps.detect.outputs.changed_sql, 'migrations/20261101_130000_add_new_device_approval.sql')
        run: |
          # 20261101_130000 は auth_events と auth_refresh_tokens（20261013_160000）が先にある前提（本番と同じ順）
          for sqlfile in migrations/001_create_auth_events.sql migrations/20261013_160000_add_self_hosted_auth_tables.sql; do
            echo "▶ $sqlfile を前提として実行中..."
            psql -h localhost -U jarvis -d jarvis_db -v ON_ERROR_STOP=1 -f "$sqlfile"
            echo "✅ $sqlfile 成功"
          done

      - name: 変更 SQL を 1回目実行（実行可否・構文チェック）
        if: steps.detect.outputs.has_sql_changes == 'true'
        run: |
          echo "${{ steps.detect.outputs.changed_sql }}" | while read sqlfile; do
            [ -z "$sqlfile" ] && continue
            echo "▶ $sqlfile を実行中..."
            psql -h localhost -U jarvis -d jarvis_db -v ON_ERROR_STOP=1 -f "$sqlfile"
            echo "✅ $sqlfile 成功"
          done

      - name: 変更 SQL を 2回目実行（冪等性テスト）
        if: steps.detect.outputs.has_sql_changes == 'true'
        run: |
          echo "🔄 SQL 冪等性チェック（同じファイルを再実行）"
          echo "${{ steps.detect.outputs.changed_sql }}" | while read sqlfile; do
            [ -z "$sqlfile" ] && continue
            echo "▶ $sqlfile を再実行中..."
            psql -h localhost -U jarvis -d jarvis_db -v ON_ERROR_STOP=1 -f "$sqlfile"
            echo "✅ $sqlfile 再実行成功（冪等性 OK）"
          done

  # ── 全件ドライラン: 既存マイグレーション全部を順に適用し組み合わせ問題を検知 ─
  # migration 変更がある PR でのみ起動。run_all_migrations.sh の run_sql 記載順を SSoT とする。
  migration-full-dryrun:
    name: マイグレーション全件ドライラン（実DB）
    needs: detect-changes
    if: needs.detect-changes.outputs.migrations == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: jarvis
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: jarvis_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jarvis -d jarvis_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://jarvis:testpass@localhost:5432/jarvis_db
      PGPASSWORD: testpass

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: uv pip install --system -r requirements.txt

