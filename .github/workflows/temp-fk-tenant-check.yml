name: "[TEMP] FK・テナント状態確認（読み取り専用）"

# ⚠️ 使い捨てワークフロー
# 用途: ADR-090 PR4 recon — テナント一覧・quote_items FK の向き確認（一回限り）
# 調査完了後は削除すること。自動実行なし。

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: '"yes" と入力してください（Shingo 権限のみ）'
        required: true
        default: ''

jobs:
  check-fk-status:
    name: FK・テナント状態 読み取り専用調査
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm == 'yes'
    timeout-minutes: 10

    steps:
      - name: VPS SSH → psql 読み取り専用調査
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/ubuntu/salesanchor

            docker compose exec -T postgres psql \
              -U ${POSTGRES_USER:-jarvis} -d ${POSTGRES_DB:-jarvis_db} \
              -v ON_ERROR_STOP=0 \
              <<'PSQL'

            \set ON_ERROR_ROLLBACK on
            BEGIN;
            SET TRANSACTION READ ONLY;

            \echo ''
            \echo '━━━ [1/4] テナント一覧 (public.tenants) ━━━'
            SELECT id, tenant_code, tenant_name, is_active, created_at
            FROM public.tenants
            ORDER BY id;

            \echo ''
            \echo '━━━ [2/4] 全テナントの quote_items FK の向き ━━━'
            SELECT
              n.nspname AS schema,
              c.conname AS constraint_name,
              c.confrelid::regclass AS references_table
            FROM pg_constraint c
            JOIN pg_namespace n ON n.oid = c.conrelid::regclass::oid
            WHERE c.contype = 'f'
              AND n.nspname ~ '^tenant_[0-9]+$'
              AND c.conname LIKE '%product_id%'
            ORDER BY n.nspname, c.conname;

            \echo ''
            \echo '━━━ [3/4] 全テナントの tenant_NNN.products 行数 ━━━'
            DO $$
            DECLARE
              sch text;
              cnt bigint;
            BEGIN
              FOR sch IN
                SELECT nspname FROM pg_namespace
                WHERE nspname ~ '^tenant_[0-9]+$' ORDER BY nspname
              LOOP
                IF to_regclass(sch || '.products') IS NOT NULL THEN
                  EXECUTE format('SELECT COUNT(*) FROM %I.products', sch) INTO cnt;
                  RAISE NOTICE 'schema=% products.count=%', sch, cnt;
                ELSE
                  RAISE NOTICE 'schema=% products: TABLE NOT FOUND', sch;
                END IF;
              END LOOP;
            END $$;

            \echo ''
            \echo '━━━ [4/4] 全テナントの quote_items 行数 ━━━'
            DO $$
            DECLARE
              sch text;
              cnt bigint;
            BEGIN
              FOR sch IN
                SELECT nspname FROM pg_namespace
                WHERE nspname ~ '^tenant_[0-9]+$' ORDER BY nspname
              LOOP
                IF to_regclass(sch || '.quote_items') IS NOT NULL THEN
                  EXECUTE format('SELECT COUNT(*) FROM %I.quote_items', sch) INTO cnt;
                  RAISE NOTICE 'schema=% quote_items.count=%', sch, cnt;
                END IF;
              END LOOP;
            END $$;

            ROLLBACK;
            \echo ''
            \echo '✅ 調査完了 (ROLLBACK済み - DB変更ゼロ)'
            PSQL
