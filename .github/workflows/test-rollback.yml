name: Test Phase2 Rollback Simulation

# SA-18 Phase2: ロールバック安全機構の実地検証ワークフロー
# ubuntu-latest runner は Docker を持つ → 実際のコンテナで両シナリオを確認。
#
# このワークフローは手動 (workflow_dispatch) または SA-18 ブランチへの push でのみ実行。
# 本番デプロイに影響を与えない（VPS に一切アクセスしない）。
#
# 検証内容（3シナリオ）:
#   Scenario C: フラグ無し → no-op（DATABASE_URL 変化なし・パスワード未出力）
#   Scenario A: フラグ ON → auto-URL 組み立て → salesanchor_app 接続
#     - health 200 + data count > 0 + パスワードログ未出力
#   Scenario B: Phase2 失敗路（偽 green 対策の核心）
#     - BAD Phase2（503）→ ロールバック → jarvis 復帰
#     - "health 200" ではなく "data count > 0" で復旧を確認（偽 green 防止）

on:
  workflow_dispatch:
  push:
    branches:
      - feature/morimoto/sa-18-phase2-auto-url

jobs:
  phase2-rollback-simulation:
    name: Phase2 Rollback Simulation Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Docker is available
        run: |
          docker --version
          docker compose version

      - name: Run Phase2 rollback simulation
        run: |
          bash scripts/test_rollback_simulation.sh

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: phase2-rollback-test-logs
          path: /tmp/phase2-test-*/
          retention-days: 3
