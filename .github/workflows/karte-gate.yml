name: Karte Visual Gate

on:
  pull_request:
    branches:
      - main
      - develop

# NOTE: paths filter omitted (ADR-067 deadlock lesson: #523 (2)).
# When frontend is unchanged, detect-changes -> skipped -> aggregator reports success.
# Same design as e2e.yml lint-run detect-changes pattern.

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'

  karte-gate-run:
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Get Playwright version
        id: pw
        run: |
          PW_VERSION=$(node -p "require('@playwright/test/package.json').version")
          echo "version=$PW_VERSION" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install system deps (chromium)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Run Karte Visual Gate
        env:
          CI: 'true'
          VITE_FIREBASE_API_KEY: AIzaSyE2E-dummy-api-key
          VITE_FIREBASE_AUTH_DOMAIN: e2e-fixture.firebaseapp.com
          VITE_GCP_PROJECT_ID: e2e-fixture
        run: npx playwright test karte-visual-gate.spec.ts --project=chromium

      - name: Generate comparison screenshots (Phase 5a review)
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        env:
          CI: 'true'
          VITE_FIREBASE_API_KEY: AIzaSyE2E-dummy-api-key
          VITE_FIREBASE_AUTH_DOMAIN: e2e-fixture.firebaseapp.com
          VITE_GCP_PROJECT_ID: e2e-fixture
        run: npx playwright test karte-screenshot-compare.spec.ts --project=chromium

      - name: Upload comparison screenshots
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: karte-compare-screenshots
          path: frontend/screenshots/compare/
          retention-days: 14
          if-no-files-found: warn

      - name: Post comparison comment to PR
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
        run: |
          RUN_URL="https://github.com/${REPO}/actions/runs/${RUN_ID}"
          {
            echo "## Phase 5a 比較スクリーンショット（候補）"
            echo ""
            echo "CI が生成した比較画像を [こちらの Artifacts](${RUN_URL}) からダウンロードして目視確認してください。"
            echo "→ \`karte-compare-screenshots\` を展開"
            echo ""
            echo "| ファイル | 内容 |"
            echo "|---------|------|"
            echo "| \`app-lead-deal.png\` | アプリ描画 — リード ＋ 商談タブ |"
            echo "| \`app-customer-company.png\` | アプリ描画 — 既存顧客 ＋ 顧客タブ |"
            echo "| \`ref-lead-deal.png\` | 見本 HTML — リード ＋ 商談タブ |"
            echo "| \`ref-customer-company.png\` | 見本 HTML — 既存顧客 ＋ 顧客タブ |"
            echo ""
            echo "> 「**見本どおり**」承認後に Phase 5b（\`toHaveScreenshot()\` ベースライン固定）に進みます。"
          } | gh pr comment "${PR_NUMBER}" --body-file -

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: karte-gate-report
          path: frontend/playwright-report/
          retention-days: 7

  karte-gate:
    name: Karte Visual Gate (chromium)
    needs: [detect-changes, karte-gate-run]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Report results
        run: |
          r="${{ needs.karte-gate-run.result }}"
          echo "karte-gate-run: $r"
          if [[ "$r" == "success" || "$r" == "skipped" ]]; then
            echo "OK"
            exit 0
          else
            echo "FAIL"
            exit 1
          fi
