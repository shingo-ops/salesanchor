name: Karte Visual Gate

on:
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:
    # 手動実行: ベースライン更新（--update-snapshots）用
    # 使用方法: Actions タブ → Karte Visual Gate → Run workflow → 対象ブランチを選択

# NOTE: paths filter omitted (ADR-067 deadlock lesson: #523 (2)).
# When frontend is unchanged, detect-changes -> skipped -> aggregator reports success.
# Same design as e2e.yml lint-run detect-changes pattern.

permissions:
  contents: write      # ベースライン画像の自動コミット（workflow_dispatch のみ）
  pull-requests: write # PR コメント投稿（Phase 5a 比較、将来の通知）

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'

  karte-gate-run:
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Get Playwright version
        id: pw
        run: |
          PW_VERSION=$(node -p "require('@playwright/test/package.json').version")
          echo "version=$PW_VERSION" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install system deps (chromium)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # ── pull_request: 通常実行（ベースラインと比較） ──────────────────────────
      - name: Run Karte Visual Gate
        if: github.event_name != 'workflow_dispatch'
        env:
          CI: 'true'
          VITE_FIREBASE_API_KEY: AIzaSyE2E-dummy-api-key
          VITE_FIREBASE_AUTH_DOMAIN: e2e-fixture.firebaseapp.com
          VITE_GCP_PROJECT_ID: e2e-fixture
        run: npx playwright test karte-visual-gate.spec.ts --project=chromium

      # ── workflow_dispatch: ベースライン更新（--update-snapshots） ──────────────
      - name: Update baseline snapshots
        if: github.event_name == 'workflow_dispatch'
        env:
          CI: 'true'
          VITE_FIREBASE_API_KEY: AIzaSyE2E-dummy-api-key
          VITE_FIREBASE_AUTH_DOMAIN: e2e-fixture.firebaseapp.com
          VITE_GCP_PROJECT_ID: e2e-fixture
        run: npx playwright test karte-visual-gate.spec.ts --project=chromium --update-snapshots

      - name: Commit baseline snapshots
        if: github.event_name == 'workflow_dispatch'
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/tests-e2e/__snapshots__/
          if git diff --cached --quiet; then
            echo "スナップショットに変更なし — コミットをスキップ"
          else
            git commit -m "chore(karte): ベースライン更新（ubuntu-latest chromium）"
            git push
          fi

      # ── workflow_dispatch のみ: app vs 見本 HTML 比較スクリーンショット（手動レビュー用）
      - name: Generate comparison screenshots
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        env:
          CI: 'true'
          VITE_FIREBASE_API_KEY: AIzaSyE2E-dummy-api-key
          VITE_FIREBASE_AUTH_DOMAIN: e2e-fixture.firebaseapp.com
          VITE_GCP_PROJECT_ID: e2e-fixture
        run: npx playwright test karte-screenshot-compare.spec.ts --project=chromium

      - name: Upload comparison screenshots
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: karte-compare-screenshots
          path: frontend/screenshots/compare/
          retention-days: 14
          if-no-files-found: warn

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: karte-gate-report
          path: frontend/playwright-report/
          retention-days: 7

  karte-gate:
    name: Karte Visual Gate (chromium)
    needs: [detect-changes, karte-gate-run]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Report results
        run: |
          r="${{ needs.karte-gate-run.result }}"
          echo "karte-gate-run: $r"
          if [[ "$r" == "success" || "$r" == "skipped" ]]; then
            echo "OK"
            exit 0
          else
            echo "FAIL"
            exit 1
          fi
