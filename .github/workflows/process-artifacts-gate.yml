name: Process Artifacts Gate

# 標準ワークフロー遵守チェック（ADR-121）
# paths / paths-ignore を使わず常時実行し、内部でパス区分を判定する。
# ※ 必須ではない（non-mandatory）。Step 5 でしんごさんが Ruleset 追加を判断する。
# develop のみ対象: develop→main リリースPRは各featureがdevelop段階で通過済み → 誤検知防止。

on:
  pull_request:
    branches: [develop]

jobs:
  gate:
    name: process-artifacts gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run process-artifacts gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: node scripts/check-process-artifacts.js
