name: nginx config check

# ADR-1052 段2: nginx の設定の検査。文法（nginx -t）・数え合わせ・本物の nginx を起こした守りの試験を行う。
#   1. 数え合わせ: 443 を受ける server のうち case-api でないものの数 ＝ 421 の行を持つ server の数
#      （新しい入口を足したときの 421 の書き忘れを止める）。標準の python と pytest だけで動く。
#   2. 本番と同じ nginx のイメージ（docker-compose.yml の nginx）を --network host で起こし、nginx -t が通ること。
#      読む証明書は、設定が読む名前ごとの自己署名の証明書（一時の場所）。htpasswd.d・/var/www の各所は空の物。
#   3. 送り方の確認: 受けた SNI をそのまま返す試験専用の nginx で、末尾の点つき・大文字の SNI がそのまま届くこと。
#   4. 守りの台本（scripts/tests/nginx-case-api-guard.sh guard）を IPv4 の 127.0.0.1 と IPv6 の ::1 の両方で当てる。
#   5. 5 つの名前の「/」の応答コードと Location が、PR の前の nginx.conf と同じこと。
#      CI は docker の名前解決が無いので、変数で中継する名前（app など）は前も後も中継の失敗の応答になる。
#      比べが効くのは 421 の守りと jarvis・salesanchor.jp などの直接の応答。中継する名前の比べは本番の受入で見る。
# paths で絞らず毎回走らせる（ルールセットの必須 Check にしても skipped で詰まらないため。必須にするかは PO の判断）。

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  nginx-config-check:
    name: nginx config check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GUARD: scripts/tests/nginx-case-api-guard.sh
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 数え合わせ（421 の行の数・map・case-api の location）
        run: |
          python -m pip install --quiet pytest
          python -m pytest --noconftest -o addopts="" -p no:cacheprovider backend/tests/ops/test_nginx_case_api_guard.py

      - name: 試験の材料を作る（偽の証明書・空の取り付け物・前の nginx.conf）
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          T="${RUNNER_TEMP}/ngx"
          IMG=$(grep -oE 'image: nginx:[0-9][0-9.]*' docker-compose.yml | head -n 1 | sed 's/^image: //')
          [ -n "$IMG" ] || { echo "::error::docker-compose.yml から nginx のイメージを読めません"; exit 1; }
          echo "NGINX_IMAGE=${IMG}" >> "$GITHUB_ENV"
          echo "T=${T}" >> "$GITHUB_ENV"
          bash "$GUARD" prepare nginx/nginx.conf "$T"
          bash "$GUARD" sni-echo-conf "$T"
          # PR の前の nginx.conf（「同じ応答」の基準）
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git fetch --no-tags origin "$BASE_REF"
            git show "origin/${BASE_REF}:nginx/nginx.conf" > "$T/base.conf"
          else
            git show "HEAD^1:nginx/nginx.conf" > "$T/base.conf"
          fi
          test -s "$T/base.conf"
          # CI から本番の監視サーバ（nginx.conf の中継先の IP）へ要求を出さない
          sudo iptables -I OUTPUT -d 49.212.160.98 -j REJECT

      - name: nginx -t（本番と同じイメージ・本番と同じ取り付け）
        run: |
          set -euo pipefail
          docker run --rm --network host \
            -v "${GITHUB_WORKSPACE}/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
            -v "${T}/letsencrypt:/etc/letsencrypt:ro" \
            -v "${T}/htpasswd.d:/etc/nginx/htpasswd.d:ro" \
            -v "${T}/www/certbot:/var/www/certbot:ro" \
            -v "${T}/www/salesanchor:/var/www/salesanchor:ro" \
            -v "${T}/www/design-site:/var/www/design-site:ro" \
            "$NGINX_IMAGE" nginx -t

      - name: 送り方の確認（末尾の点つき・大文字の SNI がそのまま届く）
        run: |
          set -euo pipefail
          docker run -d --name ngx-echo --network host \
            -v "${T}/echo:/echo:ro" -v "${T}/echo/echo.conf:/etc/nginx/conf.d/default.conf:ro" "$NGINX_IMAGE"
          for _ in $(seq 1 20); do
            openssl s_client -connect 127.0.0.1:18443 </dev/null >/dev/null 2>&1 && break
            sleep 1
          done
          bash "$GUARD" sni-check 127.0.0.1:18443
          docker rm -f ngx-echo >/dev/null

      - name: 守りの台本（IPv4 の 127.0.0.1 と IPv6 の ::1）と、今の nginx.conf の「/」の応答
        run: |
          set -euo pipefail
          docker run -d --name ngx-new --network host \
            -v "${GITHUB_WORKSPACE}/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
            -v "${T}/letsencrypt:/etc/letsencrypt:ro" \
            -v "${T}/htpasswd.d:/etc/nginx/htpasswd.d:ro" \
            -v "${T}/www/certbot:/var/www/certbot:ro" \
            -v "${T}/www/salesanchor:/var/www/salesanchor:ro" \
            -v "${T}/www/design-site:/var/www/design-site:ro" \
            "$NGINX_IMAGE"
          for _ in $(seq 1 30); do
            openssl s_client -connect 127.0.0.1:443 </dev/null >/dev/null 2>&1 && break
            sleep 1
          done
          docker logs ngx-new 2>&1 | tail -n 5
          # どれか 1 つでも期待と違えば落とす（IPv4 と IPv6 の両方を必ず試す）
          rc=0
          bash "$GUARD" guard 127.0.0.1 || rc=1
          bash "$GUARD" guard ::1 || rc=1
          bash "$GUARD" snapshot 127.0.0.1 > "${T}/after.txt"
          docker rm -f ngx-new >/dev/null
          exit "$rc"

      - name: PR の前の nginx.conf の「/」の応答と比べる
        run: |
          set -euo pipefail
          docker run -d --name ngx-base --network host \
            -v "${T}/base.conf:/etc/nginx/conf.d/default.conf:ro" \
            -v "${T}/letsencrypt:/etc/letsencrypt:ro" \
            -v "${T}/htpasswd.d:/etc/nginx/htpasswd.d:ro" \
            -v "${T}/www/certbot:/var/www/certbot:ro" \
            -v "${T}/www/salesanchor:/var/www/salesanchor:ro" \
            -v "${T}/www/design-site:/var/www/design-site:ro" \
            "$NGINX_IMAGE"
          for _ in $(seq 1 30); do
            openssl s_client -connect 127.0.0.1:443 </dev/null >/dev/null 2>&1 && break
            sleep 1
          done
          bash "$GUARD" snapshot 127.0.0.1 > "${T}/before.txt"
          docker rm -f ngx-base >/dev/null
          echo "--- before（PR の前）"; cat "${T}/before.txt"
          echo "--- after（今）"; cat "${T}/after.txt"
          diff "${T}/before.txt" "${T}/after.txt" && echo "同じ応答"

      - name: 後片付け
        if: always()
        run: |
          docker rm -f ngx-echo ngx-new ngx-base >/dev/null 2>&1 || true
          sudo iptables -D OUTPUT -d 49.212.160.98 -j REJECT >/dev/null 2>&1 || true
