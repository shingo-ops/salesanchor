name: External API Smoke Gate

# 外部API呼び出しの有無は scripts/detect-external-api-change.js で判定する。
# PayPal は既存の実Sandbox smoke を必須化し、それ以外のAPIは未整備を可視化する。

on:
  pull_request:
    branches: [main, develop]

concurrency:
  group: external-api-smoke
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  external-api-gate:
    name: External API gate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Detect external API changes
        id: detect
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          node scripts/detect-external-api-change.js

      - name: Skip unrelated PRs
        if: steps.detect.outputs.has_external != 'true'
        run: echo "No external API changes detected; workflow completes successfully."

      - name: Report unprepared external APIs
        if: steps.detect.outputs.unprepared_apis != ''
        run: |
          echo "実環境スモーク未整備: ${{ steps.detect.outputs.unprepared_apis }}"
          echo "検出API: ${{ steps.detect.outputs.detected_apis }}"

      - name: Setup Python
        if: steps.detect.outputs.paypal_detected == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup uv
        if: steps.detect.outputs.paypal_detected == 'true'
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: backend/requirements-dev.txt

      - name: Install backend dependencies
        if: steps.detect.outputs.paypal_detected == 'true'
        working-directory: backend
        run: uv pip install --system -r requirements.txt -r requirements-dev.txt

      - name: Run PayPal Sandbox smoke
        if: steps.detect.outputs.paypal_detected == 'true'
        env:
          PAYPAL_SANDBOX_CLIENT_ID: ${{ secrets.PAYPAL_SANDBOX_CLIENT_ID }}
          PAYPAL_SANDBOX_CLIENT_SECRET: ${{ secrets.PAYPAL_SANDBOX_CLIENT_SECRET }}
          CI: 'true'
          PYTHONPATH: backend
        run: pytest --no-cov -m sandbox backend/tests/sandbox/test_paypal_sandbox.py -v --tb=short
# Keep sandbox smoke execution without coverage gate.
# No coverage gate for this sandbox smoke; keep PayPal API assertions intact and stable.
# Intentionally keep sandbox smoke separate from repo coverage.
