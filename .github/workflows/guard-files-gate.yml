name: Guard files gate

# 設計: docs/handoff/tenant-owner-login-approval/design.md 便7 / card-7.md
# 基のブランチ(main)の定義だけが動く。PR のコードは checkout しない・実行しない。
on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, edited, labeled, ready_for_review]

permissions: {}

concurrency:
  group: guard-files-gate-${{ github.event_name }}-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  gate:
    name: guard-files gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      issues: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          package-manager-cache: false
      - run: node scripts/guard-files-gate.js
        env:
          GITHUB_TOKEN: ${{ github.token }}
