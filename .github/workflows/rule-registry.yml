name: Rule Registry

# 決まり台帳（docs/specs/rule-enforcement/rules.yml）の検査。
# 決まりの語を含む行が台帳に載っているか・台帳の項目が実在するかを調べる。
#
# ※ 非必須（non-mandatory）。警告で開始（continue-on-error）。
#    連続5PRで誤検知0を確認してから必須化を別途 GO で判断する（前例: ADR-1040）。
#    ただし「Run rule fixtures」の手順は continue-on-error を付けず、失敗で止まる（ジョブ自体は必須チェックではない）。
#
# 関連: docs/handoff/rule-enforcement/design.md §5 R1

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  rule-registry:
    name: rule registry
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Run rule registry tests
        run: python3 -I scripts/tests/test_check_rule_registry.py -v

      - name: Run rule registry check
        continue-on-error: true
        run: python3 -I scripts/ci/check_rule_registry.py --summary-file "$GITHUB_STEP_SUMMARY"

      - name: Run rule fixtures
        run: python3 -I scripts/tests/run_rule_fixtures.py

  existing-rule-tests:
    name: existing rule tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: uv を入れる
        uses: astral-sh/setup-uv@v4

      - name: pytest を入れる
        run: uv pip install --system pytest

      - name: 工程の成果物の検査の試験
        run: env -u GITHUB_ACTIONS node scripts/tests/test-process-artifacts.js

      - name: migration 列の増減の検査の試験
        run: node scripts/tests/test-migration-column-churn.js

      - name: migration 重複登録の検査の試験
        run: node scripts/tests/test-migration-duplicate-registration.js

      - name: tenant schema 検査の試験
        run: python3 -m pytest -q scripts/test_lint_tenant_schema.py
