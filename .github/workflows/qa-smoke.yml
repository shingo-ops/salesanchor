name: QA Smoke Suite (ADR-038)

# ADR-038 / QA Smoke Suite
#
# 目的:
#   - 実 VPS backend (https://api.salesanchor.jp) を対象に、ACS 範囲外の
#     領域横断機能を毎スプリント機械的に検証する
#   - mock e2e (frontend/tests-e2e/) とは別資産 (撮影資産 + 高速 CI とは分離)
#
# Trigger:
#   - workflow_dispatch     手動 (Evaluator / Generator が任意に走らせる)
#   - schedule (weekly)     毎週月曜 03:00 JST (18:00 UTC Sunday)
#   - pull_request          tests/qa-smoke/ または scripts/qa/ が変更されたとき
#                           (毎 PR 走らせると prod 負荷になるため変更時のみ)
#
# Runner:
#   - **self-hosted** (VPS or 同等ネットワーク経路内のホスト)
#     reason: 本番 DB + 本番 API + 本番 Firebase に直アクセスするため
#             github-hosted runner からは firewall で塞がれる前提
#
# Required Secrets (Settings → Secrets and variables → Actions):
#   DATABASE_URL                postgresql://... (本番 readwrite 想定。tenant_006 限定で使用)
#   QA_ADMIN_EMAIL              Firebase real user (tenant_006 = tenant-review)
#   QA_ADMIN_PASSWORD
#   QA_STAFF_EMAIL
#   QA_STAFF_PASSWORD
#   QA_VIEWER_EMAIL
#   QA_VIEWER_PASSWORD
#   QA_ADMIN_FIREBASE_UID       seed-tenant.sql に渡す
#   QA_STAFF_FIREBASE_UID
#   QA_VIEWER_FIREBASE_UID
#   QA_ADMIN_PASSWORD_HASH      bcrypt 済 (fallback)
#   QA_STAFF_PASSWORD_HASH
#   QA_VIEWER_PASSWORD_HASH
#   QA_DISCORD_WEBHOOK_URL      (optional) reset 開始/完了 通知用

on:
  workflow_dispatch:
  schedule:
    # 毎週月曜 03:00 JST (= 18:00 UTC Sun)
    - cron: '0 18 * * 0'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'tests/qa-smoke/**'
      - 'scripts/qa/**'

concurrency:
  # 同時実行禁止 (tenant_006 を共有するため race condition を防ぐ)
  group: qa-smoke-tenant-006
  cancel-in-progress: false

jobs:
  reset-and-smoke:
    name: Reset tenant_006 + run smoke (real backend)
    runs-on: [self-hosted, salesanchor-vps]
    timeout-minutes: 90

    env:
      QA_SMOKE_BASE_URL: https://app.salesanchor.jp
      QA_SMOKE_API_URL:  https://api.salesanchor.jp
      DATABASE_URL: ${{ secrets.QA_TENANT006_DATABASE_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # --- Node + Playwright deps (tests/qa-smoke を package boundary にする) ---
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          # Node.js 22 LTS。self-hosted VPS runner で初回実行時のみダウンロードが発生する（数十秒・1回限り）。
          # Playwright は Node.js 22 正式サポート済み。GHA Node.js 20 廃止対応 2026-06-16。
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/qa-smoke/package-lock.json

      - name: Install qa-smoke dependencies (for @playwright/test)
        working-directory: tests/qa-smoke
        run: npm ci

      - name: Get Playwright version
        id: pw
        working-directory: tests/qa-smoke
        run: |
          PW_VERSION=$(node -p "require('@playwright/test/package.json').version")
          echo "version=$PW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        working-directory: tests/qa-smoke
        run: npx playwright install chromium

      - name: Locate host psql
        run: command -v psql || which psql

      # --- tenant_006 reset (seed 投入) ---
      - name: Bootstrap qa_tenant006_rw role on VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            QA_TENANT006_DATABASE_URL='${{ secrets.QA_TENANT006_DATABASE_URL }}'
            db_without_scheme=${QA_TENANT006_DATABASE_URL#postgresql://}
            db_password_and_host=${db_without_scheme#*:}
            db_password=${db_password_and_host%@*}
            docker exec -i \
              astro-webapp-postgres-1 \
              psql -U jarvis -d jarvis_db -v ON_ERROR_STOP=1 -v role_password="$db_password" <<'SQL'
            DO $$
            BEGIN
              CREATE ROLE qa_tenant006_rw
                LOGIN NOSUPERUSER NOBYPASSRLS NOCREATEDB NOCREATEROLE NOINHERIT;
            EXCEPTION WHEN duplicate_object THEN
              RAISE NOTICE 'qa_tenant006_rw already exists, skipping CREATE';
            END $$;

            ALTER ROLE qa_tenant006_rw
              LOGIN NOSUPERUSER NOBYPASSRLS NOCREATEDB NOCREATEROLE NOINHERIT;
            ALTER ROLE qa_tenant006_rw PASSWORD :'role_password';
            GRANT CONNECT ON DATABASE jarvis_db TO qa_tenant006_rw;
            GRANT USAGE ON SCHEMA tenant_006 TO qa_tenant006_rw;
            GRANT SELECT, INSERT, UPDATE, DELETE, TRUNCATE
              ON ALL TABLES IN SCHEMA tenant_006 TO qa_tenant006_rw;
            GRANT USAGE, SELECT, UPDATE
              ON ALL SEQUENCES IN SCHEMA tenant_006 TO qa_tenant006_rw;
            ALTER DEFAULT PRIVILEGES FOR ROLE jarvis IN SCHEMA tenant_006
              GRANT SELECT, INSERT, UPDATE, DELETE, TRUNCATE ON TABLES TO qa_tenant006_rw;
            ALTER DEFAULT PRIVILEGES FOR ROLE jarvis IN SCHEMA tenant_006
              GRANT USAGE, SELECT, UPDATE ON SEQUENCES TO qa_tenant006_rw;
            ALTER ROLE qa_tenant006_rw SET search_path = tenant_006, public;
            SQL

      - name: Verify qa_tenant006_rw role and tenant_006 schema access
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            docker exec -i astro-webapp-postgres-1 psql -U jarvis -d jarvis_db -At <<'SQL'
            SELECT rolname, rolcanlogin, rolsuper, rolbypassrls
              FROM pg_roles
             WHERE rolname = 'qa_tenant006_rw';
            SELECT has_schema_privilege('qa_tenant006_rw', 'tenant_006', 'USAGE') AS schema_usage;
            SQL

      - name: Prepare tenant_006 funnel seed payload
        run: |
          awk '
            {
              line = $0
              sub(/[[:space:]]*--.*/, "", line)
              if (line ~ /public\./) {
                print "FATAL: scripts/qa/funnel-seed-tenant006.sql contains a forbidden reference on a non-comment line" > "/dev/stderr"
                bad = 1
              }
            }
            END { exit bad }
          ' scripts/qa/funnel-seed-tenant006.sql
          FUNNEL_SEED_TENANT006_SQL_B64="$(python3 -c 'import base64, pathlib; print(base64.b64encode(pathlib.Path("scripts/qa/funnel-seed-tenant006.sql").read_bytes()).decode())')"
          echo "FUNNEL_SEED_TENANT006_SQL_B64=$FUNNEL_SEED_TENANT006_SQL_B64" >> "$GITHUB_ENV"

      - name: Seed tenant_006 funnel known state on VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: FUNNEL_SEED_TENANT006_SQL_B64
          script: |
            set -e
            QA_TENANT006_DATABASE_URL='${{ secrets.QA_TENANT006_DATABASE_URL }}'
            db_without_scheme=${QA_TENANT006_DATABASE_URL#postgresql://}
            db_password_and_host=${db_without_scheme#*:}
            db_password=${db_password_and_host%@*}
            printf '%s' "$FUNNEL_SEED_TENANT006_SQL_B64" | base64 -d | \
              docker exec -i \
                -e PGPASSWORD="$db_password" \
                astro-webapp-postgres-1 \
                psql -U qa_tenant006_rw -d jarvis_db -v ON_ERROR_STOP=1 -f -

      # --- 8 scene 実行 ---
      - name: Run QA smoke (8 scenes against real backend)
        working-directory: tests/qa-smoke
        env:
          QA_ADMIN_EMAIL:    ${{ secrets.QA_ADMIN_EMAIL }}
          QA_ADMIN_PASSWORD: ${{ secrets.QA_ADMIN_PASSWORD }}
          QA_STAFF_EMAIL:    ${{ secrets.QA_STAFF_EMAIL }}
          QA_STAFF_PASSWORD: ${{ secrets.QA_STAFF_PASSWORD }}
          QA_VIEWER_EMAIL:   ${{ secrets.QA_VIEWER_EMAIL }}
          QA_VIEWER_PASSWORD: ${{ secrets.QA_VIEWER_PASSWORD }}
          CI: 'true'
        run: |
          # tests/qa-smoke を package boundary にして、同じ package から Playwright を解決する
          npx playwright test \
            --config playwright.config.ts

      # --- Cleanup: qa-/QA- 接頭辞データを掃除 (best-effort) ---
      - name: Cleanup smoke-prefixed data
        if: always()
        run: bash scripts/qa/cleanup-smoke-data.sh || echo "cleanup failed (best-effort)"

      # --- Artifacts ---
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-smoke-playwright-report
          path: tests/qa-smoke/playwright-report
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload test-results (trace / video / screenshot)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: qa-smoke-test-results
          path: tests/qa-smoke/test-results
          retention-days: 14
          if-no-files-found: ignore
