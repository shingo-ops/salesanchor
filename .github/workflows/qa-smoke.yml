name: QA Smoke Suite (ADR-038)

# ADR-038 / QA Smoke Suite
#
# 目的:
#   - 実 VPS backend (https://api.salesanchor.jp) を対象に、ACS 範囲外の
#     領域横断機能を毎スプリント機械的に検証する
#   - mock e2e (frontend/tests-e2e/) とは別資産 (撮影資産 + 高速 CI とは分離)
#
# Trigger:
#   - workflow_dispatch     手動 (Evaluator / Generator が任意に走らせる)
#   - schedule (weekly)     毎週月曜 03:00 JST (18:00 UTC Sunday)
#   - pull_request          tests/qa-smoke/ または scripts/qa/ が変更されたとき
#                           (毎 PR 走らせると prod 負荷になるため変更時のみ)
#
# Runner:
#   - **self-hosted** (salesanchor-vps ラベル = 監視VPS 49.212.160.98)
#     reason: 本番 API + 本番 Firebase に直アクセスするため
#             github-hosted runner からは firewall で塞がれる前提
#
# アーキテクチャ注記:
#   - Reset / Cleanup は appleboy/ssh-action でアプリVPS上の docker exec で実行する
#     理由: runner(監視VPS) → PostgreSQL(アプリVPS docker 内部) は 5432 port 未公開のため
#           runner から直接 psql 接続不可。deploy.yml と同パターンで回避。
#   - DATABASE_URL は backend コンテナ内の env を使うため GitHub Secret 不要。
#
# Required Secrets (Settings → Secrets and variables → Actions):
#   VPS_HOST                    アプリVPS ホスト名/IP (既存 deploy 共用)
#   VPS_USER                    SSH ユーザー名 (既存 deploy 共用)
#   SSH_PRIVATE_KEY             SSH 秘密鍵 (既存 deploy 共用)
#   QA_ADMIN_EMAIL              Firebase real user (tenant_006 = tenant-review)
#   QA_ADMIN_PASSWORD
#   QA_STAFF_EMAIL
#   QA_STAFF_PASSWORD
#   QA_VIEWER_EMAIL
#   QA_VIEWER_PASSWORD
#   QA_ADMIN_FIREBASE_UID       reset-tenant.sh / seed-tenant.sql に渡す
#   QA_STAFF_FIREBASE_UID
#   QA_VIEWER_FIREBASE_UID
#   QA_DISCORD_WEBHOOK_URL      (optional) reset 開始/完了 通知用
#
# Secrets 初期登録:
#   上記 QA_* Secrets は一回限りの VPS 作業で事前登録済み。
#   Firebase ユーザー作成・Secrets 登録は CI 外で実施（このワークフロー外）。

on:
  workflow_dispatch:
  schedule:
    # 毎週月曜 03:00 JST (= 18:00 UTC Sun)
    - cron: '0 18 * * 0'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'tests/qa-smoke/**'
      - 'scripts/qa/**'
      - '.github/workflows/qa-smoke.yml'

concurrency:
  # 同時実行禁止 (tenant_006 を共有するため race condition を防ぐ)
  group: qa-smoke-tenant-006
  cancel-in-progress: false

jobs:
  reset-and-smoke:
    name: Reset tenant_006 + run smoke (real backend)
    runs-on: [self-hosted, salesanchor-vps]
    timeout-minutes: 90

    env:
      QA_SMOKE_BASE_URL: https://app.salesanchor.jp
      QA_SMOKE_API_URL:  https://api.salesanchor.jp
      # DATABASE_URL は runner(監視VPS) から直接 psql 接続できないため job env に置かない。
      # reset / cleanup は SSH 経由でアプリVPS docker 内で実行し、コンテナの DATABASE_URL を使う。

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # --- Node + Playwright deps (frontend が @playwright/test を持っている) ---
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          # Node.js 22 LTS。self-hosted VPS runner で初回実行時のみダウンロードが発生する（数十秒・1回限り）。
          # Playwright は Node.js 22 正式サポート済み。GHA Node.js 20 廃止対応 2026-06-16。
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies (for @playwright/test)
        working-directory: frontend
        run: npm ci

      - name: Get Playwright version
        id: pw
        working-directory: frontend
        run: |
          PW_VERSION=$(node -p "require('@playwright/test/package.json').version")
          echo "version=$PW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Playwright browsers
        working-directory: frontend
        run: |
          # self-hosted runner は OS 依存ライブラリ pre-install 済のため --with-deps 不要
          # (--with-deps は sudo を要求するが runner user に passwordless sudo がない)
          # 条件なしで実行: playwright install は冪等 (binary 存在時は即時終了)
          npx playwright install chromium

      # --- QA スクリプトをアプリVPSへ転送 ---
      # runner の git checkout にある scripts/qa/ をアプリVPSの /tmp/qa-scripts/ に SCP し、
      # docker cp でコンテナへ投入する。コンテナ再作成後も毎回最新スクリプトが使われる。
      - name: Upload QA scripts to app VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "scripts/qa/reset-tenant.sh,scripts/qa/seed-tenant.sql,scripts/qa/cleanup-smoke-data.sh"
          target: "/tmp/qa-scripts/"
          strip_components: 2

      - name: Inject QA scripts into backend container
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            docker exec astro-webapp-backend-1 mkdir -p /app/scripts/qa 2>/dev/null || true
            docker cp /tmp/qa-scripts/reset-tenant.sh    astro-webapp-backend-1:/app/scripts/qa/reset-tenant.sh
            docker cp /tmp/qa-scripts/seed-tenant.sql    astro-webapp-backend-1:/app/scripts/qa/seed-tenant.sql
            docker cp /tmp/qa-scripts/cleanup-smoke-data.sh astro-webapp-backend-1:/app/scripts/qa/cleanup-smoke-data.sh
            # docker cp は元ファイルのパーミッションを引き継ぐ (chmod 不要)
            docker exec astro-webapp-backend-1 ls -la /app/scripts/qa/

      # --- tenant_006 reset (seed 投入): アプリVPS上でSSH経由実行 ---
      # runner (監視VPS 49.212.160.98) は PostgreSQL (アプリVPS docker 内部) に
      # 直接アクセスできないため、appleboy/ssh-action でアプリVPS にSSH し、
      # backend コンテナ内で reset-tenant.sh を実行する。
      # DATABASE_URL はコンテナが既に持っている env を使用するため Secret 不要。
      - name: Reset tenant_006 on app VPS (via SSH + docker exec)
        uses: appleboy/ssh-action@v1
        env:
          QA_ADMIN_FIREBASE_UID:   ${{ secrets.QA_ADMIN_FIREBASE_UID }}
          QA_STAFF_FIREBASE_UID:   ${{ secrets.QA_STAFF_FIREBASE_UID }}
          QA_VIEWER_FIREBASE_UID:  ${{ secrets.QA_VIEWER_FIREBASE_UID }}
          QA_DISCORD_WEBHOOK_URL:  ${{ secrets.QA_DISCORD_WEBHOOK_URL }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: QA_ADMIN_FIREBASE_UID,QA_STAFF_FIREBASE_UID,QA_VIEWER_FIREBASE_UID,QA_DISCORD_WEBHOOK_URL
          script: |
            set -e
            # docker compose exec はプロジェクト名解決 (salesanchor vs astro-webapp) に依存するため
            # deploy.yml と同様に docker exec でコンテナ名を直接指定する
            docker exec -i \
              -e QA_ADMIN_FIREBASE_UID="$QA_ADMIN_FIREBASE_UID" \
              -e QA_STAFF_FIREBASE_UID="$QA_STAFF_FIREBASE_UID" \
              -e QA_VIEWER_FIREBASE_UID="$QA_VIEWER_FIREBASE_UID" \
              -e QA_DISCORD_WEBHOOK_URL="${QA_DISCORD_WEBHOOK_URL:-}" \
              astro-webapp-backend-1 \
              bash /app/scripts/qa/reset-tenant.sh

      # --- 8 scene 実行 ---
      - name: Run QA smoke (8 scenes against real backend)
        env:
          QA_ADMIN_EMAIL:    ${{ secrets.QA_ADMIN_EMAIL }}
          QA_ADMIN_PASSWORD: ${{ secrets.QA_ADMIN_PASSWORD }}
          QA_STAFF_EMAIL:    ${{ secrets.QA_STAFF_EMAIL }}
          QA_STAFF_PASSWORD: ${{ secrets.QA_STAFF_PASSWORD }}
          QA_VIEWER_EMAIL:   ${{ secrets.QA_VIEWER_EMAIL }}
          QA_VIEWER_PASSWORD: ${{ secrets.QA_VIEWER_PASSWORD }}
          CI: 'true'
        run: |
          # tests/qa-smoke/playwright.config.ts が @playwright/test を解決できるよう
          # リポジトリルートに node_modules シンボリックリンクを作成する
          # (@playwright/test は frontend/node_modules にのみインストール済み)
          ln -sfn frontend/node_modules node_modules
          ./frontend/node_modules/.bin/playwright test \
            --config tests/qa-smoke/playwright.config.ts

      # --- Cleanup: qa-/QA- 接頭辞データを掃除 (best-effort, via SSH + docker exec) ---
      # cleanup-smoke-data.sh も psql を使うため同様に SSH 経由で実行する。
      - name: Cleanup smoke-prefixed data (via SSH + docker exec)
        if: always()
        uses: appleboy/ssh-action@v1
        continue-on-error: true
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            docker exec -i astro-webapp-backend-1 \
              bash /app/scripts/qa/cleanup-smoke-data.sh \
              || echo "cleanup failed (best-effort)"

      # --- Artifacts ---
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-smoke-playwright-report
          path: playwright-report
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload test-results (trace / video / screenshot)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: qa-smoke-test-results
          path: test-results
          retention-days: 14
          if-no-files-found: ignore
