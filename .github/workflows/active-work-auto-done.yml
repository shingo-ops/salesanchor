name: active-work auto-DONE（ADR-114）

# develop への PR がマージされた瞬間に active-work.md の行を DONE に更新する
# 担当: GitHub 側（原則 4: ノートの行を更新するのは GitHub 側）

on:
  pull_request:
    types: [closed]
    branches: [develop]

# active-work-update グループで直列化（auto-review と同じグループ）
concurrency:
  group: active-work-update
  cancel-in-progress: false

jobs:
  mark-done:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: develop
          token: ${{ secrets.PIPELINE_PAT }}
          fetch-depth: 0

      - name: Update row to DONE
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          python3 - <<'PYEOF'
          import os, sys
          from datetime import datetime, timezone

          branch = os.environ["BRANCH"]
          pr_number = os.environ["PR_NUMBER"]
          merge_sha = os.environ.get("MERGE_SHA", "")[:7]
          filepath = ".claude-pipeline/active-work.md"

          with open(filepath, encoding="utf-8") as f:
              content = f.read()

          lines = content.splitlines(keepends=True)
          new_lines = []
          found = False
          updated = False

          for line in lines:
              if branch in line and line.strip().startswith("|"):
                  parts = line.rstrip("\n").split("|")
                  cols = parts[1:-1]
                  if len(cols) == 7 and cols[0].strip() == branch:
                      found = True
                      status = cols[3].strip()
                      if status in ("IN_PROGRESS", "REVIEW", "BLOCKED"):
                          cols[3] = " DONE "
                          # PR# が空なら補完
                          if not cols[4].strip():
                              cols[4] = f" #{pr_number} "
                          # 備考に merge SHA を追記（既存備考を壊さない）
                          existing_note = cols[6].strip()
                          sha_note = f"merged:{merge_sha}"
                          if sha_note not in existing_note:
                              cols[6] = f" {(existing_note + ' ') if existing_note else ''}{sha_note} "
                          eol = "\n" if line.endswith("\n") else ""
                          line = "|".join([""] + cols + [""]) + eol
                          updated = True
              new_lines.append(line)

          if not found:
              # 行が無ければ "---\n\n## 記入例" の直前（テーブル末尾）に挿入
              now = datetime.now(timezone.utc).strftime("%Y-%m-%d %H:%M")
              new_row = f"| {branch} | （自動登録） | {now} | DONE | #{pr_number} | | merged:{merge_sha} merged時自動登録・要確認 |\n"
              inserted = False
              for i, l in enumerate(new_lines):
                  if l.rstrip() == "---":
                      # この --- の後（空行を挟んで）## 記入例 があるか確認
                      j = i + 1
                      while j < len(new_lines) and new_lines[j].strip() == "":
                          j += 1
                      if j < len(new_lines) and new_lines[j].startswith("## 記入例"):
                          new_lines.insert(i, new_row)
                          inserted = True
                          break
              if not inserted:
                  print("ERROR: active-work.md に '---' + '## 記入例' パターンが見つかりません。テーブル外への追記を防ぐため中止します。", file=sys.stderr)
                  sys.exit(1)
              updated = True
              print(f"AUTO_ADDED: {branch} as DONE #{pr_number} (merged:{merge_sha})")

          if updated:
              with open(filepath, "w", encoding="utf-8") as f:
                  f.write("".join(new_lines))
              print(f"DONE_UPDATED: {branch} #{pr_number}")
          else:
              print(f"SKIP (no matching entry): {branch}")
          PYEOF

      - name: Commit and push DONE update
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --quiet .claude-pipeline/active-work.md; then
            echo "No changes to commit"
            exit 0
          fi

          git add .claude-pipeline/active-work.md
          git commit -m "chore: active-work.md — ${BRANCH} を DONE に更新（自動）"

          echo "git status before push:"
          git status
          echo "git log (last 3):"
          git log --oneline -3

          # 並行更新に備えて push 前に pull --rebase
          git pull --rebase origin develop

          # active-work DONE 更新は補助的な操作。
          # develop の Branch Protection (Required Status Checks) により direct push が
          # ブロックされる場合でも後続ワークフロー（reaper dispatch 等）を止めない。
          if git push origin HEAD:refs/heads/develop; then
            echo "DONE update pushed to develop"
          else
            echo "::warning::DONE update failed to push (branch protection / required status checks). Manual update or next automation will catch up."
            exit 0
          fi

      - name: Trigger reaper-run dispatch
        env:
          GH_TOKEN: ${{ secrets.PIPELINE_PAT }}
        run: |
          gh api repos/${{ github.repository }}/dispatches \
            --method POST \
            --field event_type=reaper-run \
            --field "client_payload[triggered_by]=active-work-auto-done" \
            --field "client_payload[branch]=${{ github.event.pull_request.head.ref }}"
