name: Doc Index Reachability

# paths を使わず常時実行する（check-claude-size.yml と同じ理由）。
# --strict で動かし、1件でもあれば失敗する（design §32 D1）。必須チェックへの登録は PO の操作（design §32 M4）。

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '0 0 * * 1'

jobs:
  check:
    name: doc index reachability
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check doc index reachability
        shell: bash
        run: |
          set +e
          python3 -I scripts/ci/check_doc_index.py --root . --strict | tee /tmp/doc-index.txt
          rc=${PIPESTATUS[0]}
          set -e
          echo "doc-index: $(grep '^SUMMARY' /tmp/doc-index.txt)" >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"
