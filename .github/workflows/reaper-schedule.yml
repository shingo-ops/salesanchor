name: reaper-schedule — マージ済み worktree 定期回収（ADR-114）

# 各 Mac で毎日実行し、DONE/マージ済みの worktree フォルダを自動削除する
# Mac が offline の日は次回起動時に自動追いつき（launchd 自動起動: PR-C で実装）
#
# repository_dispatch で active-work-auto-done 完了後にも即時起動できる
# Mac が offline なら即時実行は失敗して OK（毎日 03:00 JST の定期で追いつく）

on:
  schedule:
    - cron: '0 18 * * *'  # 毎日 18:00 UTC = 03:00 JST
  workflow_dispatch:        # 手動実行（テスト・緊急時）
  repository_dispatch:
    types: [reaper-run]    # active-work-auto-done 完了後の即時回収

jobs:
  reaper:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Run reaper（マージ済み worktree を自動削除）
        # self-hosted runner の checkout（_work）を git の基点にすると、MAIN_REPO_ROOT が _work を指し、
        # 本体の worktree を削除できない（2026-10-09 確認。docs/handoff/reaper-on-merge/design.md §1）。
        # そのため、スクリプトは最新の checkout のものを使い、cwd は本体リポジトリにする。
        working-directory: /Users/tanizawashingo/salesanchor
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/scripts/reaper-worktree.sh" ]; then
            echo "reaper-worktree.sh が見つかりません"
            exit 0
          fi
          bash "$GITHUB_WORKSPACE/scripts/reaper-worktree.sh" --execute

      - name: 未保存あり保護件数をサマリ表示
        if: always()
        working-directory: /Users/tanizawashingo/salesanchor
        run: |
          if [ -f "$GITHUB_WORKSPACE/scripts/reaper-worktree.sh" ]; then
            bash "$GITHUB_WORKSPACE/scripts/reaper-worktree.sh" 2>&1 | grep -E "^(⚠️|✅)" || true
          fi
