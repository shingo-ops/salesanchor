name: reaper-schedule — マージ済み worktree 定期回収（ADR-114）

# 各 Mac で毎日実行し、DONE/マージ済みの worktree フォルダを自動削除する
# Mac が offline の日は次回起動時に自動追いつき（launchd 自動起動: PR-C で実装）
#
# repository_dispatch で active-work-auto-done 完了後にも即時起動できる
# Mac が offline なら即時実行は失敗して OK（毎日 03:00 JST の定期で追いつく）

on:
  schedule:
    - cron: '0 18 * * *'  # 毎日 18:00 UTC = 03:00 JST
  workflow_dispatch:        # 手動実行（テスト・緊急時）
  repository_dispatch:
    types: [reaper-run]    # active-work-auto-done 完了後の即時回収

jobs:
  reaper:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Run reaper（マージ済み worktree を自動削除）
        # self-hosted runner の actions/checkout は _work 配下に別 checkout を作る。
        # そのまま実行すると reaper は _work 側の .git を基点に見てしまい、
        # 本店(/Users/tanizawashingo/worktrees/salesanchor) の実 worktree を走査できず
        # 「対象0件」になる。2026-07-20 実測のズレを塞ぐため、本店の worktree 親を明示注入する。
        env:
          REAPER_WORKTREES_DIR: /Users/tanizawashingo/worktrees/salesanchor
        run: |
          if [ ! -f scripts/reaper-worktree.sh ]; then
            echo "reaper-worktree.sh が見つかりません（PR-A 未マージ）"
            exit 0
          fi
          bash scripts/reaper-worktree.sh --execute

      - name: 未保存あり保護件数をサマリ表示
        if: always()
        run: |
          if [ -f scripts/reaper-worktree.sh ]; then
            bash scripts/reaper-worktree.sh 2>&1 | grep -E "^(⚠️|✅)" || true
          fi
