name: Test Schema Dup Gate

# テスト（backend/tests/）が本番テーブル定義を新規にコピー（独自 CREATE TABLE 増加）
# したら検出して PR をブロックする。柱3-a/b（docs/specs/process-hardening/design-pillar3.md）。
# ※ 必須ではない（non-mandatory）。安定確認後に Ruleset 追加を別途 GO で判断する。

on:
  pull_request:
    branches: [main, develop]

jobs:
  gate:
    name: test-schema-dup gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Run test-schema-dup gate
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/check-test-schema-dup.js

      - name: Run test-schema-dup tests
        run: node scripts/tests/test-check-test-schema-dup.js
